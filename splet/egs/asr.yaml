# Conventional ASR evaluation: WER and CER over pre-segmented utterances.
#
# A config is either a bare list of metrics, exactly as in VERSA, or -- as
# here -- a mapping whose `normalize:` pipeline applies to every metric that
# does not override it. The pipeline is part of the result: a figure reported
# without the normalization that produced it cannot be reproduced.
#
# A metric's own `normalize:` REPLACES the shared one, it does not extend it.
# That is why wer and cer below each spell their pipeline out in full: they
# differ in one step, and there is no way to say "the shared one, but with
# this changed".

normalize:
  - name: unicode
    form: NFKC
  - name: remove_tokens
    tokens: ["<unk>", "<noise>"]
  - name: lowercase
  - name: remove_punctuation
    keep: "'"        # keeping apostrophes: "don't" must not become "dont"
  - name: whitespace

metrics:
  # Word error rate. ESPnet removes non-speech markers inside
  # espnet2.text.word_tokenizer, which drops one only when it is a whole
  # whitespace-separated token -- `match: token`, the default.
  - name: wer
    normalize:
      - name: unicode
        form: NFKC
      - name: remove_tokens
        tokens: ["<unk>", "<noise>"]
        match: token
      - name: lowercase
      - name: remove_punctuation
        keep: "'"
      - name: whitespace

  # The same implementation on the raw text, under its own id. `name` is
  # the implementation, `id` the instance; every key this entry reports is
  # prefixed `wer_raw`, so the two never overwrite each other.
  - name: wer
    id: wer_raw
    normalize: []

  # Character error rate. espnet2.text.char_tokenizer scans the line and
  # removes a marker wherever it starts, including one glued to a word, then
  # collapses the spaces that leaves behind -- `match: substring`. Using
  # `token` here reports a different denominator than the recipe did.
  #
  # Spaces count as characters, matching jiwer.cer and the current espnet3
  # CER. Recipes that strip spaces need remove_space: true; recipes scored
  # through tokenize_text need space_symbol: "<space>" instead.
  - name: cer
    tokenizer_conf:
      remove_space: false
    normalize:
      - name: unicode
        form: NFKC
      - name: remove_tokens
        tokens: ["<unk>", "<noise>"]
        match: substring
      - name: lowercase
      - name: remove_punctuation
        keep: "'"
      - name: whitespace

# Two more that this config does not turn on, because each needs something
# from the recipe:
#
#   # Token error rate over BPE pieces -- what egs2 calls "ter" when
#   # token_type=bpe. Not sacrebleu's TER, which is translation edit rate.
#   - name: token_error_rate
