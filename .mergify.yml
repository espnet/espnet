# Path-based labelling lives in .github/labeler.yml, not here: `files~=`
# takes a regular expression, and the rules that used to be in this file
# were written as globs, so `^(espnet*/asr|egs*/*/asr1)` - which reads as
# `espne` then any number of `t` - matched none of the repository's paths
# and the ASR, TTS, MT and LM labels were never applied.
# ci/check_ci_image_config.py fails if such a rule comes back.
pull_request_rules:
  - name: automatic merge if label=auto-merge
    conditions:
      - "label=auto-merge"
      # These four jobs each aggregate every job in their workflow, so their
      # names stay stable when the CI matrix changes.
      - "check-success=ci_gate_ubuntu"
      - "check-success=ci_gate_macos"
      - "check-success=ci_gate_windows"
      - "check-success=ci_gate_debian12"
    actions:
      merge:
        method: merge
  - name: "add label=auto-merge for PR by mergify"
    conditions:
      - author=mergify[bot]
    actions:
      label:
        add: ["auto-merge"]
  - name: warn on conflicts
    conditions:
      - conflict
    actions:
      comment:
        message: This pull request is now in conflict :(
      label:
        add: ["conflicts"]
  - name: unlabel conflicts
    conditions:
      - -conflict
    actions:
      label:
        remove: ["conflicts"]
