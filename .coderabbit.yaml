# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# https://docs.coderabbit.ai/reference/yaml-template
#
# CodeRabbit reviews each pull request once, when it is opened. It does not
# re-review on every push: the open-source plan is rate limited per repository
# and per-push reviews would spend that budget on a handful of active PRs.
# After pushing fixes, ask for a fresh pass by commenting on the pull request:
#
#     @coderabbitai full review
#
# Use `full review`, not `review`. `@coderabbitai review` is the incremental
# command: it only looks at commits that have not been reviewed yet, and it
# reports that there is nothing to do when the automatic review already
# covered them. `full review` re-reads the whole pull request.
# `@coderabbitai configuration` prints the settings actually in effect.
#
# Replaces .gemini/config.yaml -- the consumer version of Gemini Code Assist
# on GitHub was shut down by Google on 2026-07-17.
language: en-US
tone_instructions: >-
  Be concise and technical. No jokes or emoji. Report only correctness,
  reproducibility, or API-compatibility problems. Contributors are often
  students: explain the problem, do not pile on style nitpicks.
reviews:
  profile: quiet              # only the most important feedback
  high_level_summary: false   # PR summaries are handled separately
  review_status: false        # no "review skipped" / status chatter
  poem: false
  changed_files_summary: false
  sequence_diagrams: false
  auto_review:
    enabled: true
    drafts: false               # wait until a PR leaves draft
    auto_incremental_review: false  # not on every push; see the note above
    ignore_usernames:           # nothing to review in automated bumps
      - dependabot[bot]
      - pre-commit-ci[bot]
      - mergify[bot]
  path_filters:
    - '!**/*.ipynb'
    # RESULTS.md is generated by the common recipe pipeline, not hand-written.
    - '!egs2/**/RESULTS.md'
    - '!egs3/**/RESULTS.md'
  path_instructions:
    # The rules below come from CONTRIBUTING.md. They are conventions a
    # general-purpose reviewer cannot infer from the diff alone.
    - path: 'egs2/**'
      instructions: >-
        ESPnet2 recipe. Check against the recipe checklist in CONTRIBUTING.md:
        shared files and directories (utils, steps, asr.sh, tts.sh, enh.sh,
        pyscripts, scripts) must be symbolic links, never copied files -- a
        large diff on one of these almost always means a copy;
        the default training and decoding configs used by run.sh must be
        conf/train.yaml and conf/decode.yaml, with variants under conf/tuning/;
        cluster settings (cmd.sh, conf/slurm.conf, conf/queue.conf,
        conf/pbs.conf) must be left at their defaults and not tuned to the
        author's own cluster;
        a new corpus needs a matching entry in egs2/README.md and in
        egs2/TEMPLATE/*/db.sh;
        prefer the shared pipeline stages over corpus-specific stages;
        large meta-information such as keyword or speaker lists does not belong
        in the recipe itself.
        Also verify that stage numbering is contiguous and that every path the
        recipe references is produced by an earlier stage.
    - path: 'egs3/**'
      instructions: >-
        ESPnet3 recipe. Conventions are still stabilizing, so compare against
        egs3/TEMPLATE and the existing librispeech_100 and mini_an4 recipes and
        flag divergence rather than assuming the egs2 rules apply.
    - path: 'espnet2/**'
      instructions: >-
        Library code used by every recipe and by downstream projects.
        Prioritize: backward compatibility of public classes and of their
        constructor and CLI arguments (a new argument needs a default that
        preserves current behavior); tensor shape, dtype, and device handling,
        especially padding, masking, and length bookkeeping; correct
        registration in the relevant task class when a new module is added.
        Breaking an existing config that users already have on disk is the most
        expensive mistake here -- call it out explicitly.
    - path: 'espnet3/**'
      instructions: >-
        Newer library layer (components, systems, parallel, publication, utils).
        Check that new code composes with the existing abstractions in this
        directory rather than duplicating espnet2 logic, and that anything
        touching parallel/ is safe under multi-process and multi-node launches.
    - path: 'test/**'
      instructions: >-
        Test files must be named test_xxx.py with test functions named
        test_yyy, and a test file should cover a single source file rather than
        grouping many. Prefer several small files over one large one.
        Check that the test actually asserts the behavior under change and is
        not merely a smoke test, and that it does not require a GPU, network
        access, or a downloaded corpus.
    - path: 'ci/**'
      instructions: >-
        CI scripts gate every pull request in the repository. Flag anything
        that silently reduces coverage: tests skipped or made non-blocking,
        error handling weakened, or a dependency unpinned.
    - path: '.github/workflows/**'
      instructions: >-
        Check permissions granted to each job, whether secrets could be exposed
        to code from forked pull requests, and that third-party actions are
        pinned. pull_request_target must never check out PR head code into the
        workspace root.
    - path: 'tools/**'
      instructions: >-
        Installation scripts and Makefiles. Changes here can break existing
        environments. Check version pinning and that the change does not force
        a reinstall for users who do not need the new component.
    - path: 'pyproject.toml'
      instructions: >-
        A new required dependency affects every ESPnet user. Question whether
        it can be an optional extra instead, and check that version constraints
        are neither unpinned nor needlessly narrow.
chat:
  art: false
