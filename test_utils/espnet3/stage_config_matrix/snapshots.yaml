    model_dir: ${exp_dir}/model_pack
  dataset: *id003
  inference_dir: ${exp_dir}/inference
  score_file: ${inference_dir}/test/text.scp
  pack: &id009
    out_dir: __ROOT__/demo
  upload_model: *id007
  upload_demo: &id010
    demo_dir: ${pack.out_dir}
    hf_repo: example/demo
upload_demo:
  exp_dir: __ROOT__/train
