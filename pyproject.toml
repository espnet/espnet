[project]
name = "espnet"
dynamic = ["version", "readme"]
authors = [
    {name="Shinji Watanabe", email="shinjiw@ieee.org"}
]
description = "ESPnet: end-to-end speech processing toolkit"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12,<3.14"
license = { "text" = "Apache Software License" }

# We can use newer setuptools after removing chainer support.
# We didn't specify torch-related packages as it highly depends on environment.
dependencies = [
    # ESPnet-2 and ESPnet-3 dependencies
    "setuptools>=38.5.1,<74.0.0",
    "configargparse>=1.2.1",
    "packaging",
    "typeguard",
    "humanfriendly",
    "scipy>=1.4.1",
    "numpy>=2.0.0",
    "PyYAML>=5.1.2",
    "soundfile>=0.10.2",
    # Imported directly by espnet2/asr/encoder/{hubert,avhubert,wav2vec2}_encoder.py.
    # It arrives through torch today, which is why nothing has broken; tools/setup.py
    # was the only file that declared it, and that file is deleted in this commit.
    "filelock",
    "torch_optimizer",
    "sentencepiece==0.2.1",
    "librosa>=0.10.2",
    "lightning",
    "torch_complex",
    "tensorboard>=1.14",
    "einops",
    "lhotse",
    "espnet_model_zoo",
    "matplotlib",
    "nltk>=3.4.5",

    # ESPnet-3 related
    "hydra-core",
    "omegaconf",
    "datasets",
    "dask[distributed]",
    "dask_jobqueue",
    # The supported set is exactly {2.9.1, 2.10.0, 2.11.0}, and three places have
    # to agree on it: ci/image_variants.json, which is what CI builds images for;
    # tools/installers/install_torch.sh, which exits 1 on anything else; and here.
    # The upper bound is not arbitrary - torchaudio's newest release is 2.11.0,
    # ESPnet installs the two as a matched pair, and torchaudio publishes no
    # dependency metadata at all, so nothing stops pip from pairing torchaudio
    # 2.11.0 with a much newer torch. It did: `pip install espnet[asr]==202609`
    # resolved torch 2.12.1 against torchaudio 2.11.0.
    "torch>=2.9.1,<2.12",
    "torchaudio>=2.9.1,<2.12",
    "huggingface_hub",
    "wandb",
]

[project.scripts]
espnet3 = "espnet3.cli.main:main"

[project.urls]
Homepage = "http://github.com/espnet/espnet"

[build-system]
requires = ["setuptools>=38.5.1,<74.0.0", "wheel", "setuptools-scm>=8.0,<9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {file = "version.txt"}
readme = {file = ["README.md"], content-type = "text/markdown"}

[tool.setuptools.packages.find]
include = ["espnet*", "egs3*"]

[tool.setuptools.package-data]
egs3 = ["egs3/TEMPLATE/**/*.yaml"]


[project.optional-dependencies]
# Three of the packages below are ESPnet-maintained forks of projects whose
# upstream releases do not work here, published to PyPI under their own names:
# espnet-ctc-segmentation, espnet-g2p-en and espnet-s3prl. Their import names
# are unchanged (ctc_segmentation, g2p_en, s3prl), and each carries a
# FORK_NOTICE.md saying what differs from upstream and why.
#
# They must be declared like this, by name and version. A direct reference -
# "name @ git+https://..." - makes PyPI reject the whole distribution with
# 400 Can't have direct dependency, which is what kept ESPnet off PyPI from
# v.202604 to v.202609 with nothing local reporting it. ci/check_ci_image_config.py
# now fails on one.
asr = [
  "espnet-ctc-segmentation>=1.7.4.post1",  # fork of lumaku/ctc-segmentation
  "editdistance",
  "opt_einsum",
  "jiwer",
]

tts = [
  "pyworld>=0.3.4",
  "pypinyin<=0.44.0",
  "espnet_tts_frontend",
  "espnet-g2p-en>=2.1.0.post1",  # fork of Kyubyong/g2p
  "jamo==0.4.1",
  "jaconv",
]

enh = [
  "ci_sdr",
  "fast-bss-eval==0.1.3",
]

asr2 = [
  "editdistance",
]

s2st = [
  "editdistance",
  "espnet-s3prl>=2026.5.14",  # fork of s3prl/s3prl
]

st = [
  "editdistance",
]

s2t = [
  "editdistance",
]

spk = [
  "asteroid_filterbanks==0.4.0"
]

egs2 = [
  "gdown",
  "resampy",
  "pysptk>=0.2.1",
  "morfessor",
  "youtube_dl",
  "nnmnkwii",
  "museval>=0.2.1",
  "pystoi>=0.2.2",
  "mir-eval>=0.6",
  "fastdtw",
  "nara_wpe>=0.0.5",
  "sacrebleu>=1.5.1",
  "praatio>=6,<7",
  "scikit-learn>=1.0.0",
]

# Extras needed for SpeechLM training (espnet2/speechlm).
# Contains only packages not already in the base "dependencies" above.
# GPU-only runtime deps (torchtitan, liger-kernel) are listed here so that
# `pip install espnet[speechlm]` pulls them, but they are not imported at
# module load time in the hot path, so CPU-only installs still succeed.
speechlm = [
  "psutil",
  "transformers==5.5.4",
  "huggingface-hub",
  "joblib",
  "polars",
  "duckdb",
  # torchtitan (distributed training) and liger-kernel (CUDA Triton
  # kernels) are Linux+CUDA only. Leave them off Windows/macOS so
  # `pip install espnet[all]` doesn't spend minutes backtracking
  # through incompatible versions and then fail.
  "torchtitan; sys_platform == 'linux'",
  "liger-kernel; sys_platform == 'linux'",
]

# Extras for the spoken dialogue system demo (espnet2/sds and
# egs2/TEMPLATE/sds1). None of these were declared anywhere, so there was no
# supported way to install that module from the repo.
sds = [
  "pydub",
  "snac",
  # 0.4.3 is the release the vendored mini-omni code was adapted from, and the
  # last one without an upper bound on huggingface-hub. Newer litgpt pins
  # huggingface-hub<1.4, which cannot be satisfied together with gradio's
  # >=1.16, so leaving this unpinned makes pip quietly downgrade gradio.
  "litgpt==0.4.3",
  "openai-whisper",
  # Prebuilt wheels, unlike the original webrtcvad which needs a compiler.
  "webrtcvad-wheels",
  "gradio",
  "transformers",
]

# Kaldi ark/scp I/O (kaldiio). Kept out of the default dependencies because
# the kaldiio license restricts redistribution, which is a problem for software
# that is publicly distributed; see
# https://github.com/espnet/espnet/issues/6529.
# Install this extra only if you need to read/write Kaldi-format features.
kaldiio = [
  "kaldiio>=2.18.0",
]

dev = [
  "black",
  "flake8>=3.7.8",
  "pytest>=7.0.0,<8.4.0",
  "pytest-cov>=2.7.1",
  "isort",
]

test = [
  "pytest>=7.0.0,<8.4.0",
  "pytest-timeouts>=1.2.1",
  "pytest-pythonpath>=0.7.3",
  "pytest-cov>=2.7.1",
  "hacking>=2.0.0",
  "mock>=2.0.0",
  "pycodestyle",
  "jsondiff>=2.0.0",
  "flake8>=3.7.8",
  "flake8-docstrings>=1.3.1",
  "black",
  "isort",
  "h5py>=2.10.0",
  "kaldiio>=2.18.0",
  "gradio",
  "playwright",
]

doc = [
  "sphinx<9.0.0",
  "sphinx-rtd-theme>=0.2.4",
  "myst-parser",
  "sphinx-argparse>=0.2.5",
  "sphinx-markdown-builder",
  "sphinx-markdown-tables"
]

all = [
  "espnet[asr]",
  "espnet[tts]",
  "espnet[enh]",
  "espnet[spk]",
  "espnet[speechlm]",
  "espnet[egs2]",
  "espnet[kaldiio]",
  "fairscale",
  "transformers",
  "evaluate",
]
