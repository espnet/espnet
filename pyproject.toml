[project]
name = "espnet"
dynamic = ["version", "readme"]
authors = [
    {name="Shinji Watanabe", email="shinjiw@ieee.org"}
]
description = "ESPnet: end-to-end speech processing toolkit"
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.12,<3.14"
license = { "text" = "Apache Software License" }

# We didn't specify torch-related packages as it highly depends on environment.
dependencies = [
    # What `pip install espnet` has to be able to do: load a pretrained model
    # through any from_pretrained in espnet2/bin and run it. Nothing here is
    # for training - that stack (lightning, tensorboard, wandb, torch_optimizer,
    # matplotlib, nltk, and hydra, omegaconf, datasets, dask for espnet3) is the
    # [train] extra, which [all] includes.
    # ci/check_inference_imports.py, run by the test_import job on a wheel
    # installed with no extras, fails when an inference module starts
    # importing one of them at module level.
    # Both ends are torch's, near enough. The floor: torch 2.13.0 and 2.14.0
    # require setuptools>=77.0.3, and the "<74.0.0" that stood here - left over
    # from chainer, which is gone - meant pip could satisfy espnet only by
    # resolving torch backwards, which it did, quietly, until ci/install.sh
    # pinned the version and turned it into the ResolutionImpossible it always
    # was. The cap: setuptools 82.0.0 removed pkg_resources, and pyworld imports
    # it at module scope, so every TTS/SVS test module fails to import under 82
    # with ModuleNotFoundError. torch 2.11.0 declares setuptools<82 itself for
    # the same class of reason. Drop the cap when pyworld stops importing
    # pkg_resources, not before.
    "setuptools>=77.0.3,<82",
    "configargparse>=1.2.1",
    "packaging",
    "typeguard",
    "humanfriendly",
    "scipy>=1.4.1",
    "numpy>=2.0.0",
    "PyYAML>=5.1.2",
    "soundfile>=0.10.2",
    # Kaldi ark/scp I/O. Replaced kaldiio, whose license restricts
    # redistribution; see https://github.com/espnet/espnet/issues/6529.
    # 0.1.2 is the floor, not a preference: earlier versions refuse the WAV
    # header sox leaves behind when it pipes to stdout and so cannot read a
    # speed-perturbed wav.scp entry at all.
    "omniio>=0.1.2",
    # Imported directly by espnet2/asr/encoder/{hubert,avhubert,wav2vec2}_encoder.py.
    "filelock",
    "sentencepiece==0.2.1",
    "librosa>=0.10.2",
    "torch_complex",
    "einops",
    # enh_inference and enh_tse_inference import it at module level; until now
    # it arrived only through huggingface_hub.
    "tqdm>=4.64",
    "espnet_model_zoo",
    # The supported set is exactly {2.11.0, 2.13.0, 2.14.0}, and three places
    # have to agree on it: ci/image_variants.json, which is what CI builds
    # images for; tools/installers/install_torch.sh, which exits 1 on anything
    # else; and here. 2.12.0 and 2.12.1 exist and sit between two supported
    # versions, so they are excluded one at a time: a plain range would let pip
    # resolve to a torch CI never tests, and it does exactly that given the
    # chance - `pip install -e ".[test,all]"` in ci/install.sh picked 2.12.1
    # while the environment had been built for 2.13.0.
    # The two bounds differ on purpose. torchaudio's newest release is 2.11.0
    # and there is no 2.12, 2.13 or 2.14, so from torch 2.12 on the pair is no
    # longer lockstep: torchaudio 2.11.0 is what every supported torch above it
    # gets, which makes this range exactly that one version.
    # That pairing is deliberate now rather than an accident of resolution:
    # torchaudio 2.11.0's native libraries import only PyTorch's stable ABI (the
    # aoti_torch_* C API, no mangled C++ torch symbols), and it was run against
    # both torch 2.13.0 and 2.14.0 - resample, MelSpectrogram, Spectrogram and
    # compliance.kaldi.fbank all work.
    # The bounds still have to be written out, because torchaudio publishes no
    # dependency metadata at all: nothing here would otherwise stop pip from
    # pairing torchaudio 2.11.0 with a torch past the set CI tests, which is how
    # `pip install espnet[asr]==202609` reached torch 2.12.1 back when the
    # supported set stopped at 2.11.0.
    "torch>=2.11.0,!=2.12.0,!=2.12.1,<2.15",
    "torchaudio>=2.11.0,<2.12",
    "huggingface_hub",
]

[project.urls]
Homepage = "http://github.com/espnet/espnet"

[project.scripts]
espnet = "espnet2.bin.cli:main"
espnet-mcp = "espnet2.bin.mcp_server:main"

[build-system]
requires = ["setuptools>=38.5.1,<74.0.0", "wheel", "setuptools-scm>=8.0,<9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {file = "version.txt"}
readme = {file = ["README.md"], content-type = "text/markdown"}

[tool.setuptools.packages.find]
include = ["espnet*", "egs3*"]

[tool.setuptools.package-data]
egs3 = ["egs3/TEMPLATE/**/*.yaml"]


[project.optional-dependencies]
# Training, with espnet2 (espnet2/bin/*_train.py, egs2 recipes) or espnet3
# (espnet3/, egs3/: Hydra configs, the Lightning trainer, Hugging Face
# datasets, Dask for the parallel/ helpers). Every one of these was a hard
# dependency until 202609, so `pip install espnet` dragged W&B, Lightning,
# TensorBoard and Dask into installs that only ever ran a model. abs_task.py
# and espnet2/train import wandb, torch_optimizer and matplotlib lazily;
# lightning_train.py, the Lightning callbacks, the speechlm trainers and
# espnet3 import theirs at module level and are training entry points.
train = [
  "lightning",
  "tensorboard>=1.14",
  "torch_optimizer",
  "matplotlib",
  "nltk>=3.4.5",
  "wandb",
  # CER/WER during validation (legacy/nets/e2e_asr_common.py, the transducer
  # error calculator, uasr/espnet_model.py); also in [asr].
  "editdistance",
  "hydra-core",
  "omegaconf",
  "datasets",
  "dask[distributed]",
  "dask_jobqueue",
]
# Three of the packages below are ESPnet-maintained forks of projects whose
# upstream releases do not work here, published to PyPI under their own names:
# espnet-ctc-segmentation, espnet-g2p-en and espnet-s3prl. Their import names
# are unchanged (ctc_segmentation, g2p_en, s3prl), and each carries a
# FORK_NOTICE.md saying what differs from upstream and why.
#
# They must be declared like this, by name and version. A direct reference -
# "name @ git+https://..." - makes PyPI reject the whole distribution with
# 400 Can't have direct dependency, which is what kept ESPnet off PyPI from
# v.202604 to v.202609 with nothing local reporting it. ci/check_ci_image_config.py
# now fails on one.
asr = [
  "espnet-ctc-segmentation>=1.7.4.post1",  # fork of lumaku/ctc-segmentation
  "editdistance",
  "opt_einsum",
  "jiwer",
]

tts = [
  "pyworld>=0.3.4",
  "pypinyin<=0.44.0",
  "espnet_tts_frontend",
  "espnet-g2p-en>=2.1.0.post1",  # fork of Kyubyong/g2p
  "jamo==0.4.1",
  "jaconv",
]

enh = [
  "ci_sdr",
  "fast-bss-eval==0.1.3",
]

asr2 = [
  "editdistance",
]

s2st = [
  "editdistance",
  "espnet-s3prl>=2026.5.14",  # fork of s3prl/s3prl
]

st = [
  "editdistance",
]

s2t = [
  "editdistance",
]

spk = [
  "asteroid_filterbanks==0.4.0"
]

egs2 = [
  "espnet[train]",
  "gdown",
  "resampy",
  "pysptk>=0.2.1",
  "morfessor",
  "youtube_dl",
  "nnmnkwii",
  "museval>=0.2.1",
  "pystoi>=0.2.2",
  "mir-eval>=0.6",
  "fastdtw",
  "nara_wpe>=0.0.5",
  "sacrebleu>=1.5.1",
  "praatio>=6,<7",
  "scikit-learn>=1.0.0",
]

# Dependencies for SpeechLM training (espnet2/speechlm).
# Shared packages are supplied by the base dependencies above.
speechlm = [
  "lhotse",
  # dataloader/batch.py and the polars/duckdb loaders import these at module
  # level; until the training stack left the core dependencies they arrived
  # through dask[distributed] and datasets, undeclared.
  "sortedcontainers",
  "pyarrow",
  "psutil",
  "transformers==5.14.1",
  "huggingface-hub",
  "joblib",
  "polars",
  "duckdb",
  # Keep Linux training dependencies off Windows/macOS installs.
  "torchtitan; sys_platform == 'linux'",
  "liger-kernel; sys_platform == 'linux'",
  "flash-linear-attention>=0.2.2; sys_platform == 'linux'",
  "tilelang>=0.1.12; sys_platform == 'linux'",
]

# Extras for the spoken dialogue system demo (espnet2/sds and
# egs2/TEMPLATE/sds1). None of these were declared anywhere, so there was no
# supported way to install that module from the repo.
sds = [
  "pydub",
  "snac",
  # 0.4.3 is the release the vendored mini-omni code was adapted from, and the
  # last one without an upper bound on huggingface-hub. Newer litgpt pins
  # huggingface-hub<1.4, which cannot be satisfied together with gradio's
  # >=1.16, so leaving this unpinned makes pip quietly downgrade gradio.
  "litgpt==0.4.3",
  "openai-whisper",
  # Prebuilt wheels, unlike the original webrtcvad which needs a compiler.
  "webrtcvad-wheels",
  "gradio",
  "transformers",
]

# The browser demo (espnet2/bin/demo.py): `espnet demo` serves the OWSM app
# the Hugging Face Spaces run. gradio is the only thing it needs beyond a bare
# install, and it stays here rather than in the core dependencies because a
# web framework has no business in `pip install espnet`: the command imports
# it inside the function that builds the app and names this extra when it is
# missing. Not in [all], for the reason [sds] is not - one demo must not drag
# gradio into every install.
demo = [
  "gradio",
]

# Model Context Protocol server (espnet2/bin/mcp_server.py): the `espnet-mcp`
# command through which Claude Code, Cursor and other agents call ESPnet as
# tools. It pulls the three task extras because its default tools cover ASR,
# TTS and enhancement.
mcp = [
  "mcp>=2.0",
  "espnet[asr]",
  "espnet[tts]",
  "espnet[enh]",
]

dev = [
  "black",
  "flake8>=3.7.8",
  "pytest>=7.0.0,<8.4.0",
  "pytest-cov>=2.7.1",
  "isort",
]

test = [
  "espnet[train]",
  "pytest>=7.0.0,<8.4.0",
  "pytest-timeouts>=1.2.1",
  "pytest-pythonpath>=0.7.3",
  "pytest-cov>=2.7.1",
  "hacking>=2.0.0",
  "mock>=2.0.0",
  "pycodestyle",
  "jsondiff>=2.0.0",
  "flake8>=3.7.8",
  "flake8-docstrings>=1.3.1",
  "black",
  "isort",
  "h5py>=2.10.0",
  "gradio",
  "playwright",
  # test_mcp_server.py imports mcp outright; macOS CI installs only .[test].
  "mcp>=2.0",
]

doc = [
  "sphinx<9.0.0",
  "sphinx-rtd-theme>=0.2.4",
  "myst-parser",
  "sphinx-argparse>=0.2.5",
  "sphinx-markdown-builder",
  "sphinx-markdown-tables"
]

# Every task extra plus training. Not sds: it pins litgpt==0.4.3 and pulls
# openai-whisper and gradio for one demo, and would drag those into every
# `pip install espnet[all]`; install it by name.
all = [
  "espnet[train]",
  "espnet[asr]",
  "espnet[asr2]",
  "espnet[tts]",
  "espnet[enh]",
  "espnet[st]",
  "espnet[s2t]",
  "espnet[s2st]",
  "espnet[spk]",
  "espnet[speechlm]",
  "espnet[egs2]",
  "espnet[mcp]",
  "fairscale",
  "transformers",
  "evaluate",
]
