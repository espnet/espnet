# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
        exclude: ^(egs2/TEMPLATE/asr1/utils|egs2/TEMPLATE/asr1/steps|egs2/TEMPLATE/tts1/sid|tools/installers/patch_mwerSegmenter)
    -   id: end-of-file-fixer
        exclude: ^(egs2/TEMPLATE/asr1/utils|egs2/TEMPLATE/asr1/steps|egs2/TEMPLATE/tts1/sid|tools/installers/patch_mwerSegmenter)
    -   id: mixed-line-ending
        # Everything is LF. A CRLF source file is invisible until a formatter
        # rewrites every line of it and a two-line change becomes a whole-file
        # diff. Windows batch files and patches keep their own endings, and
        # a captured log keeps the carriage returns of its progress bars.
        args: [--fix=lf]
        exclude: ^(egs2/TEMPLATE/asr1/utils|egs2/TEMPLATE/asr1/steps|egs2/TEMPLATE/tts1/sid|tools/installers/patch_mwerSegmenter)|\.(bat|patch|log)$
    -   id: check-yaml
        exclude: ^(egs2/TEMPLATE/asr1/utils|egs2/TEMPLATE/asr1/steps|egs2/TEMPLATE/tts1/sid|tools/installers/patch_mwerSegmenter)
    -   id: check-added-large-files
        exclude: ^(egs2/TEMPLATE/asr1/utils|egs2/TEMPLATE/asr1/steps|egs2/TEMPLATE/tts1/sid|tools/installers/patch_mwerSegmenter)

-   repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.0
    hooks:
    -   id: black
        exclude: ^(egs2/TEMPLATE/asr1/utils|egs2/TEMPLATE/asr1/steps|egs2/TEMPLATE/tts1/sid|doc)

-   repo: https://github.com/pycqa/isort
    rev: 9.0.2
    hooks:
    -   id: isort
        exclude: ^(egs2/TEMPLATE/asr1/utils|egs2/TEMPLATE/asr1/steps|egs2/TEMPLATE/tts1/sid|doc)

# Auto-application lives here, not in CI: pre-commit.ci commits the fix back
# to the pull request, whereas `ruff check --fix` in CI writes it to the
# runner's checkout, exits 0, and throws it away - so every fixable violation
# would pass the gate and land unfixed.
#
# This hook sees a slightly larger file set than `ruff check` does in CI.
# pre-commit passes files explicitly, so extension-less Python scripts such as
# tools/sentencepiece_commands/spm_encode are linted here; Ruff's own directory
# walk only picks up *.py and skips them. Expect findings that CI never reports.
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
    -   id: ruff-check
        args: [--fix]
