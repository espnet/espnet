task: espnet3.systems.esp2_tse.task.TSETask
recipe_dir: .
data_dir: ${recipe_dir}/data
exp_tag: ${self_name:}
exp_dir: ${recipe_dir}/exp/${exp_tag}
stats_dir: ${recipe_dir}/exp/stats
num_device: 1
num_nodes: 1
dataset:
  train:
  - data_src_args:
      split: 2mix_16k_max_train_mix-clean
      training_placeholders: true
      ignore_key_prefix:
      - text_spk
      - utt_id
      - num_spk
      recipe_dir: ${recipe_dir}
      data_dir: ${oc.env:LIBRIMIX,${data_dir}}
    transform:
      _target_: espnet3.systems.esp2_tse.src.transforms.TSEAudioLoadTransform
      load_enrollment_as_audio: false
  valid:
  - data_src_args:
      split: 2mix_16k_max_dev_mix-clean
      ignore_key_prefix: ${dataset.train[0].data_src_args.ignore_key_prefix}
      recipe_dir: ${recipe_dir}
      data_dir: ${oc.env:LIBRIMIX,${data_dir}}
    transform:
      _target_: espnet3.systems.esp2_tse.src.transforms.TSEAudioLoadTransform
      load_enrollment_as_audio: false
  - data_src_args:
      split: 2mix_16k_max_test_mix-clean
      ignore_key_prefix: ${dataset.train[0].data_src_args.ignore_key_prefix}
      recipe_dir: ${recipe_dir}
      data_dir: ${oc.env:LIBRIMIX,${data_dir}}
    transform:
      _target_: espnet3.systems.esp2_tse.src.transforms.TSEAudioLoadTransform
      load_enrollment_as_audio: false
  preprocessor:
    _target_: espnet2.train.preprocessor.TSEPreprocessor
    train_spk2enroll: ${dataset.train[0].data_src_args.data_dir}/${dataset.train[0].data_src_args.split}/spk2enroll.json
    enroll_segment: 48000
    load_spk_embedding: false
    load_all_speakers: true
    num_spk: ${model.model_conf.num_spk}
create_dataset:
  recipe_dir: ${recipe_dir}
model:
  encoder: conv
  encoder_conf:
    channel: 256
    kernel_size: 32
    stride: 16
  decoder: conv
  decoder_conf:
    channel: 256
    kernel_size: 32
    stride: 16
  extractor: td_speakerbeam
  extractor_conf:
    layer: 8
    stack: 4
    bottleneck_dim: 256
    hidden_dim: 512
    skip_dim: 256
    kernel: 3
    causal: false
    norm_type: gLN
    pre_nonlinear: prelu
    nonlinear: linear
    i_adapt_layer: 7
    adapt_layer_type: mul
    adapt_enroll_dim: 256
    use_spk_emb: false
  model_conf:
    num_spk: 2
    share_encoder: true
  criterions:
  - name: snr
    conf:
      eps: 1.0e-07
    wrapper: fixed_order
    wrapper_conf:
      weight: 1.0
optimizer:
  _target_: torch.optim.Adam
  lr: 0.001
  eps: 1.0e-08
  weight_decay: 0
scheduler:
  _target_: torch.optim.lr_scheduler.StepLR
  step_size: 200000
  gamma: 0.98
best_model_criterion:
- - valid/loss
  - 3
  - min
parallel:
  env: local
  n_workers: 4
  allow_overwrite_lock: false
dataloader:
  train:
    iter_factory:
      _target_: espnet2.iterators.chunk_iter_factory.ChunkIterFactory
      shuffle: true
      batch_size: 4
      chunk_length: 48000
      chunk_shift_ratio: 0.5
      excluded_key_prefixes:
      - enroll_ref
      num_workers: 4
      batches:
        type: unsorted
        shape_files:
        - ${stats_dir}/train/feats_shape
        batch_size: 1
        batch_bins: -1
trainer:
  devices: ${num_device}
  num_nodes: ${num_nodes}
  accumulate_grad_batches: 1
  check_val_every_n_epoch: 1
  gradient_clip_val: 5.0
  log_every_n_steps: 100
  max_epochs: 100
  precision: 32
  limit_train_batches: 1.0
  logger:
  - _target_: lightning.pytorch.loggers.TensorBoardLogger
    save_dir: ${exp_dir}/tensorboard
    name: tb_logger
  strategy: ddp_find_unused_parameters_true
fit: {}
