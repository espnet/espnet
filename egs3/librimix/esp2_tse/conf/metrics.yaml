metrics:
- metric:
    _target_: espnet3.systems.esp2_tse.metrics.tsos.TSOS
    batch_size: 1
    power: 2.0
    threshold: 0.1
    ref_channel: 0
    device: cpu
  inputs:
    ref: dataset:speech_ref1
    hyp: inf
- metric:
    _target_: espnet3.systems.esp2_tse.metrics.pesq.PESQ
    batch_size: 1
    ref_channel: 0
  inputs:
    ref: dataset:speech_ref1
    hyp: inf
- metric:
    _target_: espnet3.systems.esp2_tse.metrics.stoi.ESTOI
    batch_size: 1
    ref_channel: 0
  inputs:
    ref: dataset:speech_ref1
    hyp: inf
- metric:
    _target_: espnet3.systems.esp2_tse.metrics.sisnr.SISNR
    batch_size: 1
    ref_channel: 0
    device: cuda
    clamp_db: 50
    zero_mean: true
  inputs:
    ref: dataset:speech_ref1
    hyp: inf
- metric:
    _target_: espnet3.systems.esp2_tse.metrics.sdr.SDR
    batch_size: 1
    ref_channel: 0
    device: cuda
    clamp_db: 50
  inputs:
    ref: dataset:speech_ref1
    hyp: inf
- metric:
    _target_: espnet3.systems.esp2_tse.metrics.dnsmos.DNSMOS
    batch_size: 1
    ref_channel: 0
    dnsmos_dir: /path/to/dir_containing_DNSMOS_checkpoints
    use_gpu: false
    convert_to_torch: false
  inputs:
    hyp: inf
dataset_artifacts:
  speech_ref1:
    type: wav
    sample_rate: 16000
