##########################################################
#        ABSOLUTE-POSITION VARIANT OF THE BASELINE       #
##########################################################
# conf/tuning/train_e_branchformer.yaml with exactly two lines changed:
#
#   attention_layer_type: rel_selfattn -> selfattn
#   pos_enc_layer_type:   rel_pos      -> abs_pos
#
# Everything else is inherited, so a comparison against the baseline isolates
# the attention and position scheme and nothing else.
#
# WHY. Relative-position attention is the single most expensive part of this
# encoder: a per-submodule profile of the baseline on an A40 put
# `RelPositionMultiHeadedAttention` at 419 ms of a 1090 ms micro-batch, 44% of
# the encoder. It builds a second score matrix for the position term and
# shifts it, and neither survives into a fused attention kernel. Dropping to
# absolute positions removes both: forward and backward each fall about 17%
# before any kernel change, and 80 min per epoch against the baseline's 106
# once `train_e_branchformer_sdpa.yaml` is in the comparison too.
#
# WHAT IT COSTS. Per epoch the baseline is, if anything, slightly ahead on
# valid/acc -- 0.436 against 0.397 at epoch 9, 0.631 against 0.566 at 10 --
# though the gap closes as training goes on (+0.017 by epoch 17). Per hour
# this config is ahead. Which matters depends on whether the budget is epochs
# or days.
#
# NOT ABOUT FLASH ATTENTION. An earlier version of this note claimed `selfattn`
# was the only way to reach a fused kernel. espnet/espnet#6886 gave relative
# attention an SDPA path, so that is no longer true, and flash-attn measured
# *slower* than SDPA at this recipe's sequence lengths -- around T=300 after
# subsampling, the unpad/pad round trip it needs costs more than the kernel
# saves.
##########################################################

defaults:
  - train_e_branchformer
  - _self_

model:
  encoder_conf:
    attention_layer_type: selfattn
    pos_enc_layer_type: abs_pos
