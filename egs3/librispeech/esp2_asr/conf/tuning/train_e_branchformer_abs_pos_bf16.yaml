##########################################################
#        TRUE-bf16 VARIANT OF THE ABS_POS CONFIG         #
##########################################################
# conf/tuning/train_e_branchformer_abs_pos.yaml with one line changed:
#
#   trainer.precision: bf16-mixed -> bf16-true
#
# WHY. `bf16-mixed` is autocast: the parameters stay fp32 and every operator
# casts its inputs down and its outputs back up. On an A40 that costs a lot
# here, because this recipe is memory-bound rather than compute-bound -- a
# kernel profile of the abs_pos run put 29% of GPU time in element-wise work,
# with 2,070 `aten::copy_` and 1,529 `aten::_to_copy` launches per
# micro-batch. `bf16-true` holds the model in bf16, so those casts disappear
# and every weight read moves half the bytes.
#
# Measured over 96 micro-batches on one A40, against the otherwise identical
# bf16-mixed config:
#
#     run_training_batch   0.818 s -> 0.432 s   (-47%)
#     forward              0.404 s -> 0.221 s   (-45%)
#     backward             0.408 s -> 0.206 s   (-49%)
#     optimizer step       0.916 s -> 0.492 s   (-46%)
#
# WHAT IT COSTS. `bf16-mixed` keeps fp32 master weights; `bf16-true` does not,
# and Adam's moments end up in bf16 as well. bf16 carries a 7-bit mantissa, so
# its relative resolution is about 0.8%: an update small against the weight it
# is applied to is simply lost. Over 240 epochs that is not a safe assumption
# to make without evidence.
#
# WHAT IT COSTS IN PRACTICE. Against train_e_branchformer_abs_pos, same seed
# and same data order, precision the only difference:
#
#     epoch      9     17     25     34     37
#     mixed   .397   .884   .921   .935      -      valid/acc
#     true    .120   .424   .661   .800   .838
#
# It is slow to start and it does converge. The other configs leave the
# opening plateau at epoch 9; this one sits there until 14 and lifts around
# 17. That is what dropping the fp32 master weights predicts -- updates are
# smallest while warmup holds the learning rate near 2e-07, so that is where
# bf16's 7-bit mantissa loses them. By epoch 37 it is about 0.10 behind at
# matched epochs and closing. Whether 240 epochs is enough to catch up is
# still open, and is why this config is being trained to the end rather than
# judged on its first ten epochs.
#
# Wall clock on one A40: 70 min per epoch against 80, so -13%. That does not
# pay for the lost epochs unless it does catch up.
#
# If it does not, the thing to try is bf16 weights with fp32 master weights in
# the optimizer, which keeps the cast savings without losing the updates.
##########################################################

defaults:
  - train_e_branchformer_abs_pos
  - _self_

trainer:
  precision: bf16-true
