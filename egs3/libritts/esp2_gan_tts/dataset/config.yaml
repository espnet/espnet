##########################################################
#                LIBRITTS DATASET SETTING                #
##########################################################
# Read by dataset/builder.py and dataset/dataset.py.
#
# `builder` drives the create_dataset stage: which OpenSLR subsets to
# download into `dataset_path`, the sampling rate the task-ready audio is
# resampled to under `data_path/audio_path`, and where under `data_path` the
# resulting per-split TSV manifests are written.
#
# `dataset` tells LibriTTSDataset which manifest backs each split when no
# explicit `manifest_path` is passed through `data_src_args`.

##########################################################
#                   MANIFEST BUILDING                    #
##########################################################
builder:
  dataset_path: downloads
  data_path: data
  # LibriTTS ships at 24 kHz. The espnet2 LibriTTS VITS recipe trains at
  # 22.05 kHz (`run.sh --fs 22050`, resampled by `format_wav_scp`), so `build`
  # writes a PCM_16 copy at this rate under `<data_path>/<audio_path>` and the
  # manifests point at it. Keep `fs` equal to `dataset.preprocessor.fs`,
  # `mel_loss_params.fs` and `tts_conf.sampling_rate` in conf/training.yaml.
  fs: 22050
  audio_path: wav
  split_subsets:
    train:
      - train-clean-100
      - train-clean-360
      - train-other-500
    valid:
      - dev-clean
    test:
      - test-clean
  manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv

##########################################################
#                DATASET SPLIT MANIFESTS                 #
##########################################################
dataset:
  split_manifest_paths:
    train: manifest/train.tsv
    valid: manifest/valid.tsv
    test: manifest/test.tsv
