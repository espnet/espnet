# F5-TTS-Small trained on LibriTTS, reproducing arXiv:2410.06885 Table 9 /
# Appendix B.7 ("F5-TTS small models evaluation results ... model trained on
# LibriTTS 585 hours").
#
# Numbers below are taken from the paper (Table 3 arch config, Table 9 /
# Sec. B.7 batch size, Sec. 4 optimizer/schedule) and cross-checked against
# upstream's own src/f5_tts/configs/F5TTS_Small.yaml (github.com/SWivid/F5-TTS),
# which matches exactly.
#
# The model was trained on 4x V100 GPUs with 8 gradient accumulation steps,
# for a total of 307,200 mel-frames per optimizer update, matching the upstream
# F5-TTS configuration.
#
# This file is complete on its own (see `egs3/TEMPLATE/f5tts/conf/training.yaml`):
# the infer stage and a packed model rebuild the model and the tokenizer from
# it alone, without the template defaults `run.py` merges underneath.
num_device: 4
num_nodes: 1

# F5-TTS is an ESPnet3-native model: `model` below is instantiated directly
# via Hydra, so the ESPnet2 `task` bridge stays unset.
task:

recipe_dir: .
data_dir: ${recipe_dir}/data
exp_tag: ${self_name:}
exp_dir: ${recipe_dir}/exp/${exp_tag}
stats_dir: ${exp_dir}/stats
inference_dir: ${exp_dir}/inference

# Mel / audio front-end settings shared by feats_extract and the model.
sample_rate: 24000
n_mel_channels: 100
hop_length: 256
win_length: 1024
n_fft: 1024

create_dataset:
  recipe_dir: ${recipe_dir}

dataset:
  _target_: espnet3.components.data.data_organizer.DataOrganizer
  _recursive_: false
  recipe_dir: ${recipe_dir}
  train:
    - data_src_args:
        split: train
        manifest_path: ${remove_long_short.save_path}/train.tsv
        fs: ${sample_rate}    # ensure consistent sampling rate via resampling in the dataset
  valid:
    - data_src_args:
        split: valid
        manifest_path: ${remove_long_short.save_path}/valid.tsv
        fs: ${sample_rate}    # ensure consistent sampling rate via resampling in the dataset
  # espnet2 CommonPreprocessor: char tokenization (F5 native vocab) + raw speech.
  # The mel is produced inside the model by VocoderMelSpec.
  preprocessor:
    _target_: espnet2.train.preprocessor.CommonPreprocessor
    token_type: ${create_token_list.token_type}
    token_list: ${token_list}
    text_cleaner: ${create_token_list.cleaner}
    g2p_type: ${create_token_list.g2p}

remove_long_short:
  min_wav_duration: 1.0
  max_wav_duration: 20.0
  splits: [train, valid, test]
  manifest_paths:
    train: ${data_dir}/manifest/train.tsv
    valid: ${data_dir}/manifest/valid.tsv
    test: ${data_dir}/manifest/test.tsv
  save_path: ${data_dir}/manifests_filtered

create_token_list:
  manifest_path: ${data_dir}/manifests_filtered/train.tsv
  save_path: ${data_dir}/tokens
  filename: char_tokens.txt
  token_type: char
  cleaner: tacotron
  g2p: null
  non_linguistic_symbols: null
  bpemodel: null
  space_symbol: "<space>"
  add_symbol:
    - "<blank>:0"
    - "<unk>:1"
    - "<sos/eos>:-1"
  vocabulary_size: -1
  cutoff: 0

# Single source of truth for the token-list path used by the preprocessor,
# the model, and (through the bundled training config) inference.
token_list: ${create_token_list.save_path}/${create_token_list.filename}

parallel:
  env: local
  n_workers: 1

# Model args, instantiated by Hydra. `F5TTS` IS the ESPnet3 model, so there is
# no espnet2 `task:` and no registry names. The mel dimension is derived from
# VocoderMelSpec.output_size. Hyper-parameters use the spelled-out ESPnet3
# names; the comment on each line gives the upstream F5-TTS name, and
# F5TTS.__init__ carries the full mapping table.
model:
  _target_: espnet3.systems.f5tts.f5tts.F5TTS
  token_list: ${token_list}
  feats_extract_config:
    fs: ${sample_rate}
    n_fft: ${n_fft}
    hop_length: ${hop_length}
    win_length: ${win_length}
    n_mels: ${n_mel_channels}
  # F5 trains on raw vocos log-mel, so there is no normalization layer.
  # F5TTS_Small (paper Table 3 / upstream F5TTS_Small.yaml).
  hidden_size: 768                  # upstream `dim`
  depth: 18
  attention_heads: 12               # upstream `heads`
  attention_head_size: 64           # upstream `dim_head`
  feed_forward_multiplier: 2        # upstream `ff_mult`
  text_embedding_size: 512          # upstream `text_dim`
  text_mask_padding: false          # match F5TTS_Small.yaml
  rotary_attention_heads: 1         # upstream `pe_attn_head`; match F5TTS_Small
  convolution_layers: 4             # upstream `conv_layers`
  sigma: 0.0
  audio_drop_probability: 0.3       # upstream `audio_drop_prob`
  condition_drop_probability: 0.2   # upstream `cond_drop_prob`
  mask_fraction_range: [0.7, 1.0]   # upstream `frac_lengths_mask`
  ode_solver_method: euler          # upstream `odeint_kwargs.method`
  # No mel block here: the flow-matching wrapper derives its mel from
  # feats_extract_config, so the two front ends cannot drift apart.

optimizer:
  _target_: torch.optim.AdamW
  lr: 7.5e-5
  betas: [0.9, 0.999]      # F5-TTS uses AdamW defaults
  weight_decay: 0.01

scheduler:
  _target_: espnet3.components.schedulers.linear_warmup_decay.LinearWarmupDecayLR
  warmup_steps: 20000
  total_steps: 600000
scheduler_interval: step

best_model_criterion:
  - - valid/loss
    - 1
    - min

dataloader:
  collate_fn:
    _target_: espnet2.train.collate_fn.CommonCollateFn
    int_pad_value: 0
    float_pad_value: 0.0
  train:
    num_shards: 1
    num_workers: 0
    iter_factory:
      _target_: espnet2.iterators.sequence_iter_factory.SequenceIterFactory
      shuffle: true
      collate_fn: ${dataloader.collate_fn}
      batches:
        type: numel
        batch_size: 1          # required by signature, unused for "numel"
        min_batch_size: 4
        shape_files:
          - ${stats_dir}/train/feats_shape
        batch_bins: 960000
  valid:
    num_shards: 1
    num_workers: 0
    iter_factory:
      _target_: espnet2.iterators.sequence_iter_factory.SequenceIterFactory
      shuffle: false
      collate_fn: ${dataloader.collate_fn}
      batches:
        type: ${dataloader.train.iter_factory.batches.type}
        batch_size: 1          # required by signature, unused for "numel"
        min_batch_size: 4
        shape_files:
          - ${stats_dir}/valid/feats_shape
        batch_bins: ${dataloader.train.iter_factory.batches.batch_bins}

trainer:
  accelerator: auto
  devices: ${num_device}
  num_nodes: ${num_nodes}
  accumulate_grad_batches: 8
  max_steps: 600000
  check_val_every_n_epoch: 1
  log_every_n_steps: 50
  max_epochs: 1000
  gradient_clip_val: 1.0
  strategy: auto
  callbacks:
    - _target_: espnet3.components.callbacks.ema.EMACallback
      decay: 0.9999
  logger:
    - _target_: lightning.pytorch.loggers.TensorBoardLogger
      save_dir: ${exp_dir}/tensorboard
      name: tb_logger

fit: {}
