# Default F5-TTS eval: LibriSpeech-PC test-clean cross-sentence, the protocol
# used by arXiv 2410.06885 (1127 same-speaker prompt/target pairs from the
# F5-TTS repo's librispeech_pc_test_clean_cross_sentence.lst).
#
# The manifest is written by the create_dataset stage, which downloads both
# external inputs (LibriSpeech test-clean and the pinned pair list); see
# dataset/builder.py. No manual preparation step is needed.
#
# Merged over `egs3/TEMPLATE/f5tts/conf/inference.yaml`, which names the model
# (`espnet3.systems.f5tts.inference.Inference`, rebuilt from the config `train`
# wrote to `${exp_dir}/config.yaml`) and holds the path scaffold; `run.py`
# copies `exp_tag` / `exp_dir` from `--training_config`, so pass both. This
# recipe names its test set and the paper's sampling settings.

# Every row of the manifest pins its own prompt, reproducing the paper's fixed
# pairing. The dataset serves `text`, `reference_speech`, `reference_text`
# (the Inference's inputs), `utt_id` and `ref_wav_path` (read by metrics.yaml).
dataset:
  test:
    - name: librispeech_pc
      data_src: egs3.libritts.f5tts.dataset.librispeech_pc
      data_src_args:
        manifest_path: ${data_dir}/librispeech_pc/manifest.tsv

model:
  ode_solver_steps: 32              # upstream `nfe_step`
  guidance_strength: 2.0            # upstream `cfg_strength`
  sway_sampling_coefficient: -1.0   # upstream `sway_sampling_coef`
  speed: 1.0
  seed: 0
