##########################################################
#                 LACE INFERENCE SETTING                 #
##########################################################
# Quick usage:
#   python run.py --stages infer \
#       --training_config conf/training.yaml \
#       --inference_config conf/inference.yaml
#
# Merged over egs3/TEMPLATE/lace/conf/inference.yaml, which supplies
# `recipe_dir`, `exp_dir`, `inference_dir`, `parallel`, `batch_size` and
# the provider/runner classes. `exp_tag`/`exp_dir` are copied in from the
# training config by run.py, so only recipe-specific keys live here.
#
# The model is the LACE `Inference` (espnet3.api.inference): it takes the
# dataset's `audio` and returns `resyn_audio`, the encode -> decode
# roundtrip of the fine-tuned codec at the configured compression `rate`,
# which the runner writes as 24 kHz WAV files listed in
# `${inference_dir}/test/resyn_audio.scp`. The ground-truth waveform for
# scoring is the test set's own `wav_path` column (conf/metrics.yaml).
#
# The wrapped architecture is rebuilt from ${exp_dir}/lace_model.yaml
# (written by LACESystem.train), and the fine-tuned checkpoint is loaded
# strictly on top.
#
# For a rate sweep, copy this config once per rate (e.g.
# conf/inference_r025.yaml) and change `rate` there; the inference dir is
# derived from the config's filename, so the runs do not overwrite each
# other. Outside the recipe, `load(tag, rate=0.25)` does the same.

dataset:
  test:
    - name: test
      data_src_args:
        split: test
        inference: true

model:
  _target_: espnet3.systems.lace.inference.Inference
  train_config: ${exp_dir}/lace_model.yaml
  # Fine-tuned checkpoint (wrapped key layout). Lightning checkpoints
  # (last.ckpt) are unwrapped automatically and loaded strictly.
  model_file: ${exp_dir}/last.ckpt
  rate: 0.5
  # Anchor constraint (optional): layers at/after this index may only
  # place boundaries inside the union of the earlier layers' boundaries.
  # null disables; e.g. 2 anchors layers 2+ on layers 0-1.
  anchor_start_layer: null
