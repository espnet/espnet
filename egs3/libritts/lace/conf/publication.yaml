##########################################################
#                  PUBLICATION SETTING                   #
##########################################################
# Quick usage:
#   python run.py --stages pack_model \
#       --training_config conf/training.yaml \
#       --inference_config conf/inference.yaml \
#       --metrics_config conf/metrics.yaml \
#       --publication_config conf/publication.yaml
#   python run.py --stages upload_model \
#       --training_config conf/training.yaml \
#       --publication_config conf/publication.yaml
#
# Merged over egs3/TEMPLATE/lace/conf/publication.yaml, which supplies the
# path scaffold, the README template, the exclude list and the upload
# settings. `exp_tag`/`exp_dir` are copied in from the training config by
# run.py, so only recipe-specific keys live here.
#
# The bundle is self-contained: `${exp_dir}/lace_model.yaml` (bulk-copied
# with exp_dir) names the published baseline by its Hugging Face id, which
# espnet_model_zoo downloads again when the bundle is loaded.

pack_model:
  # The template excludes every checkpoint from the bulk copy, so the one that
  # `conf/inference.yaml` references must be registered here; `files` entries
  # bypass `exclude` and the packed inference config is rewritten to the bundled
  # copy. Keep this in sync with `model.model_file` in conf/inference.yaml.
  files:
    model_file: ${exp_dir}/last.ckpt
  include:
    # The demo launcher and the dataset package travel with the bundle; the
    # model itself is the system's `Inference`, so no recipe code is needed
    # to load it.
    - ${recipe_dir}/src
    - ${recipe_dir}/dataset
