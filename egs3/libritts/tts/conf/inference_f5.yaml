# Default F5-TTS eval: LibriSpeech-PC test-clean cross-sentence, the protocol
# used by arXiv 2410.06885 (1127 same-speaker prompt/target pairs from the
# F5-TTS repo's librispeech_pc_test_clean_cross_sentence.lst).
#
# The manifest is written by the create_dataset stage, which downloads both
# external inputs (LibriSpeech test-clean and the pinned pair list); see
# dataset/builder.py. No manual preparation step is needed.
#
# exp_tag is intentionally empty so this config inherits experiment identity
# from the training config. That means run.py must always be given
# --training_config alongside --inference_config.
#
# For the in-domain LibriTTS cross-speaker eval instead, use
# conf/inference_f5_libritts.yaml.
recipe_dir: .

exp_tag:
exp_dir: ${recipe_dir}/exp/${exp_tag}
data_dir: ${recipe_dir}/data
inference_dir: ${exp_dir}/${self_name:}

# Every row of the manifest pins its own prompt, reproducing the paper's fixed
# pairing rather than sampling a reference like the LibriTTS config does.
dataset:
  _target_: espnet3.components.data.data_organizer.DataOrganizer
  recipe_dir: ${recipe_dir}
  test:
    - name: librispeech_pc
      data_src: egs3.libritts.tts.dataset.librispeech_pc
      data_src_args:
        manifest_path: ${data_dir}/librispeech_pc/manifest.tsv
        fs: 24000

parallel:
  env: local
  n_workers: 1

model:
  _target_: espnet2.tts.f5.inference.F5TTSInference
  train_config: ${recipe_dir}/conf/training_f5_tts_small.yaml
  ckpt_path: ${exp_dir}/last.ckpt
  use_ema: true
  vocoder_name: vocos
  vocoder_path: null
  target_sample_rate: 24000
  nfe_step: 32
  cfg_strength: 2.0
  sway_sampling_coef: -1.0
  speed: 1.0
  seed: 0

input_key: [text, ref_speech, ref_text]
batch_size: null
output_fn: src.inference.build_output
output_artifacts:
  wav:
    type: wav
    sample_rate: 24000

provider:
  _target_: espnet3.systems.base.inference_provider.InferenceProvider
runner:
  _target_: espnet3.systems.base.inference_runner.InferenceRunner
