# Inference for the Kotiria (gvc) model; every setting but the language is
# shared in conf/inference.yaml.
#
#   python run.py --stages infer \
#       --training_config conf/tuning/training_gvc.yaml \
#       --inference_config conf/tuning/inference_gvc.yaml
defaults:
  - ../inference
  - _self_

lang: gvc
