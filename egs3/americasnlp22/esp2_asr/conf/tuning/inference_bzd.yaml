# Inference for the Bribri (bzd) model; every setting but the language is
# shared in conf/inference.yaml.
#
#   python run.py --stages infer \
#       --training_config conf/tuning/training_bzd.yaml \
#       --inference_config conf/tuning/inference_bzd.yaml
defaults:
  - ../inference
  - _self_

lang: bzd
