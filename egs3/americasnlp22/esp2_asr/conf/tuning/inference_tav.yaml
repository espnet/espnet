# Inference for the Wa'ikhana (tav) model; every setting but the language is
# shared in conf/inference.yaml.
#
#   python run.py --stages infer \
#       --training_config conf/tuning/training_tav.yaml \
#       --inference_config conf/tuning/inference_tav.yaml
defaults:
  - ../inference
  - _self_

lang: tav
