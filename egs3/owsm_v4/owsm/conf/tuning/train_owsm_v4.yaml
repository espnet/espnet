# OWSM v4 on SPGISpeech + MuST-C v1.2.
#
# Defaults come from egs3/TEMPLATE/owsm/conf/training.yaml; this file supplies
# the corpora and the mixture.
#
# Still to come (steps 0-7 cover create_dataset through collect_stats):
#   tokenizer   one shared BPE vocabulary; nlsyms from dataset/utils.py:nlsyms()
#   model       the S2TTask encoder/decoder configuration
#   batch_bins  has to be calibrated by running it: CTC's own T_enc x V logits
#               are modelled by no shape file

# The environment variables path.sh documents win; download/ is the fallback for
# a recipe-local copy, matching how the other recipes lay out a corpus.
create_dataset:
  corpora:
    spgispeech:
      source_dir: ${oc.env:SPGISPEECH,${recipe_dir}/download/spgispeech}
    must_c:
      source_dir: ${oc.env:MUST_C,${recipe_dir}/download/must_c}

# Entries are POSITIONAL -- see the banner in the template. Append; do not
# reorder, or every shape key after the change is invalidated.
dataset:
  train:
    - data_src: egs3.owsm_v4.owsm.dataset.sub_datasets.spgispeech
      data_src_args:
        split: train
        recipe_dir: ${recipe_dir}
        cache: ${cache}
    - data_src: egs3.owsm_v4.owsm.dataset.sub_datasets.must_c
      data_src_args:
        split: train
        recipe_dir: ${recipe_dir}
        cache: ${cache}
  valid:
    - data_src: egs3.owsm_v4.owsm.dataset.sub_datasets.spgispeech
      data_src_args:
        split: val
        recipe_dir: ${recipe_dir}
        cache: ${cache}
    - data_src: egs3.owsm_v4.owsm.dataset.sub_datasets.must_c
      data_src_args:
        split: dev
        recipe_dir: ${recipe_dir}
        cache: ${cache}
