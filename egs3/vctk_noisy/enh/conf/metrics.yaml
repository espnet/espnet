##########################################################
#               VCTK-NOISY METRIC OVERRIDES              #
##########################################################
# Common usage:
#   python run.py --stages measure \
#       --training_config conf/training.yaml \
#       --inference_config conf/inference.yaml \
#       --metrics_config conf/metrics.yaml
#
# Explicit SI-SNR / PESQ / STOI (same defaults as TEMPLATE/enh/conf/metrics.yaml).
metrics:
  - metric:
      _target_: espnet3.systems.enh.metrics.sisnr.SISNRMetric
      ref_key: reference
      hyp_key: enhanced
    inputs:
      reference: reference
      enhanced: enhanced

  - metric:
      _target_: espnet3.systems.enh.metrics.pesq.PESQMetric
      ref_key: reference
      hyp_key: enhanced
      fs: 16000
    inputs:
      reference: reference
      enhanced: enhanced

  - metric:
      _target_: espnet3.systems.enh.metrics.stoi.STOIMetric
      ref_key: reference
      hyp_key: enhanced
      fs: 16000
    inputs:
      reference: reference
      enhanced: enhanced
