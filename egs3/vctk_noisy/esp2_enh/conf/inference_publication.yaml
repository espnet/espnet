##########################################################
#        VCTK-NOISY INFERENCE CONFIG FOR PUBLICATION     #
##########################################################
# Same as conf/inference.yaml, but model_file selects the best validation
# SI-SNR checkpoint. pack_model excludes last.ckpt and **/step*.ckpt, so the
# packed model must point at a checkpoint the package keeps.
#
#   python run.py --stages pack_model \
#       --training_config conf/training_conv_tasnet.yaml \
#       --inference_config conf/inference_publication.yaml \
#       --metrics_config conf/metrics.yaml \
#       --publication_config conf/publication.yaml

##########################################################
#                    PATHS AND INPUTS                    #
##########################################################
# VCTK-DEMAND root. Leave empty to use $VCTK_DEMAND, the same way
# conf/training_conv_tasnet.yaml does.
dataset_dir:

# Experiment trained with conf/training_conv_tasnet.yaml. run.py replaces both
# with the training config values when --training_config is passed.
exp_tag: training_conv_tasnet
exp_dir: ${recipe_dir}/exp/${exp_tag}

##########################################################
#                    DATASET DEFINITION                  #
##########################################################
# ESPnet3 loads ${recipe_dir}/dataset/__init__.py.
# Both valid and test splits are evaluated.
dataset:
  test:
    - name: valid
      data_src_args:
        split: valid
        data_path: ${dataset_dir}
        inference: true
    - name: test
      data_src_args:
        split: test
        data_path: ${dataset_dir}
        inference: true

##########################################################
#                    MODEL AND OUTPUT                    #
##########################################################
model:
  _target_: espnet3.systems.esp2_enh.src.inference.Inference
  train_config: ${exp_dir}/config.yaml
  model_file: ${exp_dir}/epoch27_step37800_valid.si_snr_loss.ckpt
  normalize_output_wav: true
