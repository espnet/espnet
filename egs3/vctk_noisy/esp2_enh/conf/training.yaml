##########################################################
#               VCTK-NOISY TRAINING OVERRIDES            #
##########################################################
# Quick usage:
#   python run.py --stages create_dataset --training_config conf/training.yaml
#   python run.py --stages collect_stats  --training_config conf/training.yaml
#   python run.py --stages train          --training_config conf/training.yaml
#
# The VCTK-DEMAND root is set in dataset/config.yaml (see README.md).

# Leave empty to use builder.dataset_dir from dataset/config.yaml. Set it here
# only to point this experiment at another copy of the corpus.
dataset_dir:
num_device: 3

create_dataset:
  recipe_dir: ${recipe_dir}
  dataset_dir: ${dataset_dir}

##########################################################
#                    DATASET DEFINITION                  #
##########################################################
# data_src is omitted; ESPnet3 loads ${recipe_dir}/dataset/__init__.py.
# data_src_args are forwarded directly to VCTKNoisyDataset(...).
# EnhPreprocessor.train is set automatically by DataOrganizer per split.
dataset:
  train:
    - data_src_args:
        split: train
        data_path: ${dataset_dir}
        chunk_length: 32000
  valid:
    - data_src_args:
        split: valid
        data_path: ${dataset_dir}
  preprocessor:
    _target_: espnet2.train.preprocessor.EnhPreprocessor
    speech_ref_name_prefix: speech_ref
    num_spk: 1
    sample_rate: 16000

##########################################################
#                      MODEL SETTING                     #
##########################################################
# Conv-TasNet following egs2/vctk_noisy/enh1/conf/tuning/train_enh_conv_tasnet.yaml,
# with si_snr loss (more common/stable than ci_sdr for this setup).
model:
  encoder: conv
  encoder_conf:
    channel: 256
    kernel_size: 20
    stride: 10

  separator: tcn
  separator_conf:
    num_spk: 1
    layer: 8
    stack: 3
    bottleneck_dim: 256
    hidden_dim: 512
    kernel: 3
    causal: false
    norm_type: gLN
    nonlinear: relu

  decoder: conv
  decoder_conf:
    channel: 256
    kernel_size: 20
    stride: 10

  model_conf:
    loss_type: si_snr

##########################################################
#                OTHER TRAINING SETTING                  #
##########################################################
best_model_criterion:
  - - valid/si_snr
    - 1
    - max
  - - valid/loss
    - 1
    - min

##########################################################
#                   DATALOADER SETTING                   #
##########################################################
dataloader:
  train:
    iter_factory:
      _target_: espnet2.iterators.sequence_iter_factory.SequenceIterFactory
      shuffle: true
      collate_fn: ${dataloader.collate_fn}
      batches:
        type: unsorted
        shape_files:
          - ${stats_dir}/train/feats_shape
        batch_size: 8

##########################################################
#                    TRAINER SETTING                     #
##########################################################
trainer:
  gradient_clip_val: 5.0
  max_epochs: 100
