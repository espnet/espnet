##########################################################
#               TOKENIZER TRAINING SETTING               #
##########################################################
# BEATs base VQ tokenizer on AudioSet-2M (egs2 `conf/tok_beats_base.yaml` +
# `conf/ds_beats_tok.json`). Iteration, teacher, fbank statistics, and paths
# come from `--training_config`.

dataset:
  train:
    - data_src_args:
        split: train
        recipe_dir: ${recipe_dir}
  valid:
    - data_src_args:
        split: eval
        recipe_dir: ${recipe_dir}

trainer:
  # egs2 `conf/tok_beats_base.yaml`: `max_epoch: 14`, `log_interval: 1000`.
  log_every_n_steps: 1000
  max_epochs: 14
  max_steps: -1
