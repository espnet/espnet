##########################################################
#                    TRAINING SETTING                    #
##########################################################
# BEATs iteration 1 on AudioSet-2M: the tokenizer is distilled from the
# iteration-0 encoder, and the encoder is re-trained on its targets.
#
#   python run.py --stages train_tokenizer \
#       --training_config conf/training_iter1.yaml \
#       --train_tokenizer_config conf/training_tokenizer.yaml
#   python run.py --stages infer train \
#       --training_config conf/training_iter1.yaml \
#       --train_tokenizer_config conf/training_tokenizer.yaml \
#       --inference_config conf/inference.yaml
#
# (Separate invocations because training uses 2 GPUs; see readme.md.)
defaults:
  - training

iteration: 1
teacher_ckpt_path: ${recipe_dir}/exp/beats_iter0_${ssl_tag}/beats_encoder_iter0.pt
