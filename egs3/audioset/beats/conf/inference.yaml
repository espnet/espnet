##########################################################
#                  TOKENIZATION SETTING                  #
##########################################################
# Tokenize AudioSet-2M into BEATs targets (egs2 stage 5 / `conf/as2m_inf.yaml`).
# `train` and `valid` are the target directories read by `conf/training.yaml`.

dataset:
  test:
    - name: train
      data_src_args:
        split: train
        recipe_dir: ${recipe_dir}
    - name: valid
      data_src_args:
        split: eval
        recipe_dir: ${recipe_dir}

# egs2 `--tokenizer_inference_batch_size 144`, sized for one H200 (141 GB).
# Lower it on smaller GPUs (e.g. 32 on a 40 GB A100/A40); it only affects
# speed and memory, not the targets.
batch_size: 144
