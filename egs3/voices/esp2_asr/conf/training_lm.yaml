# ESPnet3 LMSystem configuration; shares the ASR tokenizer for shallow fusion.
# Prepare data with src.language_model, then run run_lm.py collect_stats/train.
# Source: egs2/voices/asr1/conf/tuning/train_lm_transformer2.yaml.

# Paths are relative to the recipe directory, independently of the ASR exp_tag.
task: espnet3.systems.esp2_asr.lm_task.LMTask
num_device: 4
seed: 0
exp_tag: lm
exp_dir: ${recipe_dir}/exp/lm
stats_dir: ${exp_dir}/stats
tokenizer_dir: ${data_dir}/unigram_5000
train_text: ${data_dir}/lm/train.txt
valid_text: ${data_dir}/lm/valid.txt
# Full-release LM text also uses the source recipe's external LibriSpeech corpus.
# Set external_text: null explicitly for a devkit-only experiment.
external_text:
  archive: ${recipe_dir}/downloads/librispeech-lm-norm.txt.gz
  url: https://www.openslr.org/resources/11/librispeech-lm-norm.txt.gz

# The preparation command writes lm_train.txt, preserving source text before
# ASR duration filtering. DataOrganizer handles preprocessing and batching.
dataset:
  train:
  - data_src: espnet3.systems.esp2_asr.lm_dataset
    data_src_args:
      text_path: ${exp_dir}/lm_train.txt
  valid:
  - data_src: espnet3.systems.esp2_asr.lm_dataset
    data_src_args:
      text_path: ${valid_text}
  preprocessor:
    _target_: espnet2.train.preprocessor.CommonPreprocessor
    token_type: bpe
    token_list: ${tokenizer_dir}/tokens.txt
    bpemodel: ${tokenizer_dir}/unigram.model
    text_cleaner: null

# Only model construction uses the copied LMTask. LMSystem.train delegates to
# the existing ESPnet3 Lightning trainer; no ESPnet2 training CLI is launched.
model:
  token_list: ${tokenizer_dir}/tokens.txt
  lm: transformer
  lm_conf:
    pos_enc: null
    embed_unit: 128
    att_unit: 512
    head: 8
    unit: 2048
    layer: 16
    dropout_rate: 0.0

# Source optimizer/scheduler settings. Zero weight decay overrides TEMPLATE.
optimizer:
  lr: 0.005
  weight_decay: 0.0
scheduler:
  warmup_steps: 25000

# Select the lowest validation loss using the shared checkpoint callback.
# Speech2Text consumes config.yaml and valid.loss.ave_Nbest.pth directly.
best_model_criterion:
- - valid/loss
  - 10
  - min

# collect_stats writes token lengths with a vocabulary-size dimension for
# numel accounting. Pad ID 0 is the source LM model's ignored token.
dataloader:
  collate_fn:
    int_pad_value: 0
  train:
    iter_factory:
      seed: ${seed}
      num_workers: 1
      batches:
        sort_batch: descending
        shape_files:
        - ${stats_dir}/train/text_shape
        type: numel
        # Public ESPnet3 batches are per GPU: 500M source bins / 4 GPUs.
        # The original full LM was documented on 16 x 32GB V100s. This
        # four-GPU budget is not validated; use explicit memory-fit overrides.
        batch_bins: 125000000
  valid:
    iter_factory:
      seed: ${seed}
      num_workers: 1
      batches:
        sort_batch: descending
        shape_files:
        - ${stats_dir}/valid/text_shape

# Source training budget; normal Lightning validation/AMP/accumulation apply.
# To resume, set fit.ckpt_path to the existing exp/lm/last.ckpt explicitly.
trainer:
  max_epochs: 25
  gradient_clip_val: 5.0
  accumulate_grad_batches: 2
  precision: 16-mixed
