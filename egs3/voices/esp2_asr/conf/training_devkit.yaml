# Self-contained devkit training configuration: no sibling-YAML inheritance.
# Model/training settings match training_conformer.yaml; only corpus changes.
# The small devkit needs explicit 1000-piece tokenizer/path overrides; the
# source 5000-piece vocabulary below remains the full-release model default.
# Port of egs2/voices/asr1/conf/train_asr_conformer.yaml.
# Source + distant single-channel recordings; devkit is an explicit override.
# ESPnet2-derived model construction inside the existing ESPnet3 ASRSystem.
task: espnet3.systems.esp2_asr.task.ASRTask
num_device: 4
seed: 0
stats_dir: ${recipe_dir}/exp/stats_conformer
# Build the source data split and transcripts before statistics/training.
create_dataset:
  recipe_dir: ${recipe_dir}
  corpus: devkit
# DataOrganizer supplies the public preprocessing and data-loader interfaces.
# Local Dataset accepts only the data_src_args below; it returns speech/text.
dataset:
  train:
  - data_src_args:
      split: train
      recipe_dir: ${recipe_dir}
  valid:
  - data_src_args:
      split: valid
      recipe_dir: ${recipe_dir}
  preprocessor:
    _target_: espnet2.train.preprocessor.CommonPreprocessor
    token_type: bpe
    token_list: ${tokenizer.save_path}/tokens.txt
    bpemodel: ${tokenizer.save_path}/unigram.model
    text_cleaner: null
    fs: 16000
# Train SentencePiece on the original, pre-duration-filter training text.
# The token list is also reused by the shallow-fusion LM.
tokenizer:
  vocab_size: 5000
  model_type: unigram
  save_path: ${data_dir}/unigram_5000
  text_builder:
    func: egs3.voices.esp2_asr.src.tokenizer.gather_training_text
    text_path: ${data_dir}/manifest/tokenizer_train.txt
# Preserve the source acoustic model, decoder, and loss/augmentation settings.
# GlobalMVN reads statistics collected in a separate run.py invocation.
model:
  token_list: ${tokenizer.save_path}/tokens.txt
  normalize: global_mvn
  normalize_conf:
    stats_file: ${stats_dir}/train/feats_stats.npz
  frontend_conf:
    n_fft: 512
    hop_length: 160
  encoder: conformer
  # Encoder depth, hidden size, and source regularization.
  encoder_conf:
    output_size: 512
    attention_heads: 8
    linear_units: 2048
    num_blocks: 12
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.1
    input_layer: conv2d
    normalize_before: true
    macaron_style: true
    rel_pos_type: latest
    pos_enc_layer_type: rel_pos
    selfattention_layer_type: rel_selfattn
    activation_type: swish
    use_cnn_module: true
    cnn_module_kernel: 31
  decoder: transformer
  # Autoregressive attention decoder used with the CTC branch.
  decoder_conf:
    attention_heads: 8
    linear_units: 2048
    num_blocks: 6
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    self_attention_dropout_rate: 0.1
    src_attention_dropout_rate: 0.1
  # Joint CTC/attention training objective and label smoothing.
  model_conf:
    ctc_weight: 0.3
    lsm_weight: 0.1
    length_normalized_loss: false
  specaug: specaug
  # Training-only frequency/time masking and time warping.
  specaug_conf:
    apply_time_warp: true
    time_warp_window: 5
    time_warp_mode: bicubic
    apply_freq_mask: true
    freq_mask_width_range:
    - 0
    - 27
    num_freq_mask: 2
    apply_time_mask: true
    time_mask_width_ratio_range:
    - 0.0
    - 0.05
    num_time_mask: 10
# Source optimizer hyperparameters; remaining defaults come from TEMPLATE.
optimizer:
  lr: 0.0025
# Advance the source learning-rate schedule through the shared trainer.
scheduler:
  warmup_steps: 40000
# Average the best validation-accuracy checkpoints with the shared callback.
best_model_criterion:
- - valid/acc
  - 10
  - max
# Shapes describe frontend features rather than raw waveform/text lengths.
# Batch construction and distribution follow the public ESPnet3 data loader.
dataloader:
  train:
    iter_factory:
      num_workers: 1
      seed: ${seed}
      batches:
        sort_batch: descending
        shape_files:
        - ${stats_dir}/train/feats_shape
        type: numel
        # Feature-element budget per GPU, sized for 24 GiB accelerators.
        batch_bins: 2000000
  valid:
    iter_factory:
      num_workers: 1
      seed: ${seed}
      batches:
        sort_batch: descending
        shape_files:
        - ${stats_dir}/valid/feats_shape
# Ordinary Lightning training: native GPU CTC and default validation checks.
trainer:
  precision: bf16-mixed
  gradient_clip_val: 5.0
  accumulate_grad_batches: 4
  max_epochs: 50
