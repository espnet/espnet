dataset:
  test:
    - name: test
      data_src_args:
        split: test
        recipe_dir: ${recipe_dir}

model:
  _target_: espnet2.bin.asr_inference.Speech2Text
  asr_train_config: ${exp_dir}/config.yaml
  asr_model_file: ${exp_dir}/valid.acc.ave_10best.pth
  device: cpu
  beam_size: 20
  ctc_weight: 0.3
  lm_weight: 0.6
  lm_train_config: ${recipe_dir}/exp/lm/config.yaml
  lm_file: ${recipe_dir}/exp/lm/valid.loss.ave.pth

output_fn: egs3.voices.asr.src.inference.build_output
