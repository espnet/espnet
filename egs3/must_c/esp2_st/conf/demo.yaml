##########################################################
#                      DEMO SETTING                      #
##########################################################
# Quick usage:
#   python run.py --stages pack_demo   --demo_config conf/demo.yaml
#   python run.py --stages upload_demo --demo_config conf/demo.yaml
#
# Assumptions:
# - `pack_model` has already created the model pack referenced by
#   `model.dir_or_tag`, or that field points to a Hugging Face model repo.
# - `ui.app_script` points to the Gradio launcher copied into the packed demo.

##########################################################
#                    MODEL REFERENCE                     #
##########################################################
# `dir_or_tag` can point to:
# - a local packed model directory created by `pack_model`
# - a Hugging Face model repo containing the packed conf/inference.yaml
# Relative local paths are resolved from the packed demo directory at runtime.
# Left unset here: the default `exp/${exp_tag}/model_pack` already matches
# this recipe's layout, which is the converged train_st_conformer pack. Set
# it to `espnet/must_c_esp2_st_train_st_conformer` to demo the published
# model instead of a local one.
model:
  # The bundle carries this recipe's dataset package, which the packed
  # inference config names through `data_src`, so loading it imports
  # bundled code. Inference code itself is no longer bundled: it lives in
  # espnet3.systems.esp2_st.
  trust_user_code: true

# Use this recipe's launcher; the contract's audio-to-text layout drives the
# UI, so the ST demo takes a recording and returns its translation.
ui:
  app_script: ${config_path:../src/app.py}
