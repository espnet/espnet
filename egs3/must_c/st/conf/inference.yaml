##########################################################
#                   INFERENCE SETTING                    #
##########################################################
#   python run.py --stages infer \
#       --training_config conf/tuning/train_st_conformer.yaml \
#       --inference_config conf/inference.yaml
#
# Ported from egs2/must_c/st1: run.sh passes
# conf/tuning/decode_st_conformer.yaml, which is
#     batch_size: 1  beam_size: 10  penalty: 0.0
#     maxlenratio: 0.0  minlenratio: 0.0  lm_weight: 0.0
# All of those are reproduced below.

recipe_dir: .
data_dir: ${recipe_dir}/data
dataset_dir: ${data_dir}
exp_tag: train_st_conformer
exp_dir: ${recipe_dir}/exp/${exp_tag}
inference_dir: ${exp_dir}/infer

cache:
  enabled: true
  backend: hf
  cache_dir: ${data_dir}/hf/en_de

##########################################################
#                        DATASET                         #
##########################################################
# egs2 test_sets="tst-COMMON.en-de tst-HE.en-de". Neither is touched by the
# long/short filter -- st.sh applies that to train and valid only -- so these
# are the complete 2,641 and 600 utterances.
#
# return_utt_id: true is the one thing these entries add over the training
# ones. InferenceRunner.idx_key defaults to "utt_id" and resolve_idx_key raises
# without it, and inference never collates (inference_runner.py:251 reads
# `data = dataset[idx]` one sample at a time), so the str is safe here while it
# would abort training on the first batch. See dataset/dataset.py:_sample.
#
# No `preprocessor:` -- text must stay a raw string so src/inference.py can
# write it as the reference.
dataset:
  _target_: espnet3.components.data.data_organizer.DataOrganizer
  _recursive_: false
  recipe_dir: ${recipe_dir}
  test:
    - name: tst-COMMON
      data_src: must_c/st
      data_src_args: &infer_args
        split: test
        recipe_dir: ${recipe_dir}
        source_dir: ${dataset_dir}
        cache: ${cache}
        task: st
        tgt_lang: de
        src_case: lc.rm
        tgt_case: tc
        return_utt_id: true
    - name: tst-HE
      data_src: must_c/st
      data_src_args:
        <<: *infer_args
        split: tst-HE

##########################################################
#                    MODEL AND OUTPUT                    #
##########################################################
# st_train_config is espnet3's exp/<tag>/config.yaml, written in espnet2
# STTask layout, so Speech2Text reads it as-is. Its internal paths
# (token_list, src_token_list, bpemodel, normalize stats_file) are recipe
# relative and run.py executes from the recipe dir, so they resolve.
# Speech2TextShortSafe, not Speech2Text: tst-COMMON keeps 54 utterances shorter
# than conv2d subsampling allows, and espnet2's TooShortUttError guard lives in
# its CLI loop, not in Speech2Text.__call__. See src/inference.py.
model:
  _target_: src.inference.Speech2TextShortSafe
  st_train_config: ${exp_dir}/config.yaml
  # Weight average over the top-10 valid/acc checkpoints, written by
  # AverageCheckpointsCallback (best_model_criterion keeps 10). Before 10
  # epochs have been validated only ave_1best..ave_Nbest exist -- point this at
  # one of those, or at a single stepN.ckpt, for a mid-training check.
  st_model_file: ${exp_dir}/valid.acc.ave_10best.pth
  # egs2 conf/tuning/decode_st_conformer.yaml
  # 10, not Speech2Text's default of 20: egs2/must_c/st1 decodes with 10.
  beam_size: 10
  # [DEVIATION] no LM. egs2 sets lm_weight 0.0 for this recipe and trains no
  # LM, so there is nothing to shallow-fuse; the key is omitted rather than
  # set to 0.0 because Speech2Text wants an lm_train_config alongside it.

input_key: speech
output_fn: src.inference.build_output

##########################################################
#                  PARALLELIZATION SETTING               #
##########################################################
# `env: local` yields exactly ONE shard whatever n_workers says:
# BaseRunner._plan_shards only reads n_workers when env is not "local"
# (espnet3/parallel/base_runner.py:286). 3,241 utterances at beam 10 is slow
# enough that a real run wants `env: slurm` with scheduler options here.
parallel:
  env: local
  n_workers: 1
