##########################################################
#                    TRAINING SETTING                    #
##########################################################
# Quick usage:
#   python run.py --stages create_dataset collect_stats train \
#       --training_config conf/training.yaml
#
# A tiny ESPnet3 port of egs2/mini_an4/lid1 for integration tests: the model,
# sampler and schedule follow its conf/default_ecapa_baseline.yaml.

##########################################################
#                  SYSTEM AND PATH SETTING               #
##########################################################
task: espnet3.systems.esp2_lid.task.LIDTask

##########################################################
#                    DATASET DEFINITION                  #
##########################################################
# `data_src` is omitted, so ESPnet3 loads `${recipe_dir}/dataset/__init__.py`.
dataset:
  train:
    - data_src_args:
        split: train
  valid:
    - data_src_args:
        split: valid
  preprocessor:
    _target_: espnet2.train.preprocessor.LIDPreprocessor
    lang2utt: ${stats_dir}/train/lang2utt
    fix_duration: false
    sample_rate: 16000
    noise_apply_prob: 0.0
    rir_apply_prob: 0.0

create_dataset:
  recipe_dir: ${recipe_dir}

##########################################################
#                      MODEL SETTING                     #
##########################################################
model:
  lang_num: 3

  frontend: default

  normalize: utterance_mvn
  normalize_conf:
    norm_vars: false

  encoder: ecapa_tdnn
  encoder_conf:
    model_scale: 2
    ndim: 16
    output_size: 24

  pooling: chn_attn_stat

  projector: rawnet3
  projector_conf:
    output_size: 8

  loss: aamsoftmax_sc_topk
  loss_conf:
    margin: 0.5
    scale: 30
    K: 1
    mp: 0.06
    k_top: 1

  model_conf:
    extract_feats_in_collect_stats: false

##########################################################
#            OPTIMIZER & SCHEDULER SETTING               #
##########################################################
# One epoch of four steps: warm up 1, hold 2, decay 1.
scheduler:
  max_steps: 4
  warmup_ratio: 0.25
  hold_ratio: 0.5
  decay_ratio: 0.25

##########################################################
#                OTHER TRAINING SETTING                  #
##########################################################
seed: 3702

##########################################################
#                   DATALOADER SETTING                   #
##########################################################
dataloader:
  train:
    iter_factory:
      seed: ${seed}
      num_iters_per_epoch: 4
      batches:
        type: catpow
        batch_bins: 10000
        min_batch_size: 2
        upsampling_factor: 0.5
        dataset_scaling_factor: 1.2
        drop_last: true
        category2utt_file: ${stats_dir}/train/category2utt
  valid:
    iter_factory:
      batches:
        category2utt_file: ${stats_dir}/valid/category2utt
        min_batch_size: 2
        upsampling_factor: 0.5
        dataset_scaling_factor: 1.2

##########################################################
#                    TRAINER SETTING                     #
##########################################################
trainer:
  log_every_n_steps: 1
  max_epochs: 1
