##########################################################
#                    TRAINING SETTING                    #
##########################################################
# One-batch EnCodec run on the AN4 sample for `ci/test_integration_espnet3.sh`.
# Merged over egs3/TEMPLATE/esp2_codec/conf/training.yaml, which supplies the
# path scaffold, the data organizer with the codec preprocessor and the
# trainer defaults; the model is a reduced copy of
# egs3/libritts/esp2_codec/conf/training_encodec.yaml at 16 kHz.
task: espnet3.systems.esp2_codec.task.GANCodecTask

create_dataset:
  recipe_dir: ${recipe_dir}

##########################################################
#                    CODEC MODEL SETTING                 #
##########################################################
model:
  codec: encodec
  codec_conf:
    sampling_rate: 16000
    generator_params:
      hidden_dim: 32
      encdec_channels: 1
      encdec_n_filters: 4
      encdec_n_residual_layers: 1
      encdec_ratios: [8, 5, 4, 2]
      encdec_activation: ELU
      encdec_activation_params:
        alpha: 1.0
      encdec_norm: weight_norm
      encdec_kernel_size: 7
      encdec_residual_kernel_size: 7
      encdec_last_kernel_size: 7
      encdec_dilation_base: 2
      encdec_causal: false
      encdec_pad_mode: reflect
      encdec_true_skip: false
      encdec_compress: 2
      encdec_lstm: 1
      decoder_trim_right_ratio: 1.0
      decoder_final_activation: null
      decoder_final_activation_params: null
      quantizer_n_q: 2
      quantizer_bins: 16
      quantizer_decay: 0.99
      quantizer_kmeans_init: false
      quantizer_kmeans_iters: 1
      quantizer_threshold_ema_dead_code: 2
      quantizer_target_bandwidth: [0.5, 1]
    discriminator_params:
      msstft_discriminator_params:
        filters: 4
        in_channels: 1
        out_channels: 1
        norm: weight_norm
        n_ffts: [512, 256, 128]
        hop_lengths: [128, 64, 32]
        win_lengths: [512, 256, 128]
        activation: LeakyReLU
        activation_params:
          negative_slope: 0.3
    generator_adv_loss_params:
      average_by_discriminators: false
      loss_type: mse
    discriminator_adv_loss_params:
      average_by_discriminators: false
      loss_type: mse
    use_feat_match_loss: true
    feat_match_loss_params:
      average_by_discriminators: false
      average_by_layers: false
      include_final_outputs: true
    use_mel_loss: true
    mel_loss_params:
      range_start: 6
      range_end: 10
      window: hann
      n_mels: 40
      fmin: 0
      fmax: null
      log_base: null
    lambda_quantization: 0.0
    lambda_commit: 1.0
    lambda_reconstruct: 1.0
    lambda_adv: 1.0
    lambda_mel: 45.0
    lambda_feat_match: 2.0
    cache_generator_outputs: true
    use_loss_balancer: false

##########################################################
#            OPTIMIZER & SCHEDULER SETTING               #
##########################################################
optimizers:
  generator:
    optimizer:
      _target_: torch.optim.AdamW
      lr: 3.0e-4
      betas: [0.5, 0.9]
    params: generator
  discriminator:
    optimizer:
      _target_: torch.optim.AdamW
      lr: 3.0e-4
      betas: [0.5, 0.9]
    params: discriminator

schedulers:
  generator:
    scheduler:
      _target_: torch.optim.lr_scheduler.ExponentialLR
      gamma: 0.999875
    interval: epoch
  discriminator:
    scheduler:
      _target_: torch.optim.lr_scheduler.ExponentialLR
      gamma: 0.999875
    interval: epoch

##########################################################
#                OTHER TRAINING SETTING                  #
##########################################################
best_model_criterion:
  - - valid/mel_loss
    - 1
    - min

##########################################################
#                   DATALOADER SETTING                   #
##########################################################
# Chunk iteration as in the LibriTTS recipe: one-second chunks, two per batch.
dataloader:
  collate_fn:
    _target_: espnet2.train.collate_fn.CommonCollateFn
    float_pad_value: 0.0
    int_pad_value: 0
  train:
    iter_factory:
      _target_: espnet2.iterators.chunk_iter_factory.ChunkIterFactory
      batch_size: 2
      chunk_length: 16000
      num_cache_chunks: 2
      num_samples_per_epoch: null
      shuffle: true
      num_workers: 0
      collate_fn: ${dataloader.collate_fn}
      batches:
        type: unsorted
        batch_size: 1
        batch_bins: 0
        shape_files:
          - ${data_dir}/manifest/train.tsv
  valid:
    iter_factory:
      _target_: espnet2.iterators.chunk_iter_factory.ChunkIterFactory
      batch_size: ${dataloader.train.iter_factory.batch_size}
      chunk_length: ${dataloader.train.iter_factory.chunk_length}
      num_cache_chunks: ${dataloader.train.iter_factory.num_cache_chunks}
      shuffle: false
      num_workers: 0
      collate_fn: ${dataloader.collate_fn}
      batches:
        type: unsorted
        batch_size: 1
        batch_bins: 0
        shape_files:
          - ${data_dir}/manifest/valid.tsv

##########################################################
#                    TRAINER SETTING                     #
##########################################################
trainer:
  log_every_n_steps: 1
  max_epochs: 1
  limit_train_batches: 1
  limit_val_batches: 1

  gan:
    generator_first: true
    skip_discriminator_prob: 0.0

  # Keep the TensorBoard logs under `exp/`, where `rm -rf exp data` in the
  # integration test removes them; without a logger Lightning writes
  # `lightning_logs/` into the recipe directory.
  logger:
    - _target_: lightning.pytorch.loggers.TensorBoardLogger
      save_dir: ${exp_dir}/tensorboard
      name: tb_logger
