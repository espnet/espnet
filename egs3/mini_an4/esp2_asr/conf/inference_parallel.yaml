# CI only (ci/test_integration_espnet3.sh): inference_serial.yaml on two
# CPU workers (Dask LocalCluster). With one worker there is one shard, so
# only this run splits the test set, builds the model in separate worker
# processes and merges the shard outputs; CI checks the result is the
# serial run's. Kept in step with inference_serial.yaml by hand; only
# `parallel` differs.

##########################################################
#                   Inference SETTING                    #
##########################################################
# Common usage:
#   python run.py --stages infer \
#       --training_config conf/training_asr_transformer.yaml \
#       --inference_config conf/inference.yaml
#
##########################################################
#                    PATHS AND INPUTS                    #
##########################################################
# This recipe omits `exp_tag`, `exp_dir`, and `inference_dir` on purpose.
# `run.py` copies `training_config.exp_tag` and `training_config.exp_dir` here
# before resolving `${exp_dir}`.
#
# The default output directory uses the stem of the file passed to
# `--inference_config`.
# If `inference_dir` is omitted, `conf/<name>.yaml` becomes `${exp_dir}/<name>`.
# Override `inference_dir` only when you want a different output location.

##########################################################
#                    DATASET DEFINITION                  #
##########################################################
# Each test entry is a dataset reference consumed by `DataOrganizer`.
# - `name` becomes `${inference_dir}/<name>/`
# - `data_src` is omitted, so ESPnet3 loads
#   `${recipe_dir}/dataset/__init__.py`
# - `data_src_args` is passed directly to `MiniAn4Dataset(...)`
#
# Dataset splits:
#   test:
#     - split="valid" from `MiniAn4Dataset`
#     - split="test" from `MiniAn4Dataset`
# Notes:
#   - actual data sources are defined via `${recipe_dir}`
dataset:
  test:
    - name: valid
      data_src_args:
        split: valid
    - name: test
      data_src_args:
        split: test

##########################################################
#                    MODEL AND OUTPUT                    #
##########################################################
model:
  _target_: espnet3.systems.esp2_asr.inference.Inference
  asr_train_config: ${exp_dir}/config.yaml
  asr_model_file: ${exp_dir}/epoch0_step1_valid.loss.ckpt
  beam_size: 1
  ctc_weight: 0.3

# utterances per beam search; `null` decodes one at a time (see TEMPLATE)
batch_size: 1

# Two CPU workers, one shard each.
parallel:
  env: local
  n_workers: 2
