##########################################################
#                 METRIC SCORING SETTING                 #
##########################################################
# Quick usage:
#   python run.py --stages measure --metrics_config conf/metrics.yaml
#
# Assumptions:
# - `infer` has already produced `<test_name>/*.scp` files: one per output of
#   the model, named after the output (`resyn_audio.scp` for LACE, listing the
#   resynthesized WAV files).
# - A metric input names one of those files (`wav: resyn_audio`), or a column
#   of the test set itself as `dataset:<column>` (`ref: dataset:wav_path`): the
#   reference waveform is the data's, so it is read from the data, into
#   `<test_name>/dataset/wav_path.scp` on first use.
#
# Recipe configs fill in the `metrics` list; see
# `egs3/libritts/lace/conf/metrics.yaml` for a working example built on
# `espnet3.systems.lace.metrics.versa.VersaMetric` (signal metrics, pseudo-MOS
# predictors and more). Every entry binds the metric's declared inputs beside
# `metric`, so `infer` writes only what the model produced.
#
# `metrics: []` is deliberate rather than a populated example: OmegaConf
# merges lists by whole replacement, so a non-empty default here would leak
# into every downstream LACE recipe that omits `metrics:`.

##########################################################
#                    PATHS AND INPUTS                    #
##########################################################
recipe_dir: .
exp_tag:
exp_dir: ${recipe_dir}/exp/${exp_tag}

##########################################################
#                    METRIC DEFINITION                   #
##########################################################
metrics: []
