recipe_dir: .
exp_tag: null
model:
  dir_or_tag: exp/${exp_tag}/model_pack
  trust_user_code: false
  call_args: {}
ui:
  app_script: ${config_path:../../esp2_asr/src/app.py}
  title: ${set_corpus_and_system:} demo
  description: README.md
  inputs:
  - key: speech_mix
    type: audio
    label: Mixture Audio
  - key: enroll_ref1
    type: audio
    label: Enrollment Audio (Target Speaker)
  outputs:
  - key: inf
    type: audio
    label: Extracted Audio
pack:
  out_dir: demo
  include: []
  exclude: []
  requirements:
  - git+https://github.com/espnet/espnet.git
  readme: ${config_path:../src/hf_demo_readme.md}
  readme_context:
    title: ${ui.title}
    emoji: "\U0001F399\uFE0F"
    color_from: blue
    color_to: green
    sdk: gradio
    app_file: app.py
    pinned: 'false'
    license: apache-2.0
    tags: '- espnet

      - espnet3

      - gradio

      - speech-to-speech

      - target-speaker-extraction'
    hf_repo: ${upload_demo.hf_repo}
    model_ref: ${model.dir_or_tag}
upload_demo:
  hf_repo: espnet/${set_corpus_and_system:}_${exp_tag}
  update: false
  delete_patterns:
  - '*'
