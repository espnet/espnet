##########################################################
#                   Inference SETTING                    #
##########################################################
# Quick usage:
#   python run.py --stages infer --inference_config conf/inference.yaml
#
# Outputs:
# - `${inference_dir}/<test_name>/*.scp`
# - each SCP stores `utt_id value` pairs for one inference field

##########################################################
#                    PATHS AND INPUTS                    #
##########################################################
recipe_dir: .
# Common case:
# - pass both `--training_config` and `--inference_config`
# - `run.py` copies `training_config.exp_tag` / `training_config.exp_dir` here
# - `${self_name:}` resolves to the stem of the config file passed to
#   `--inference_config`
# - if `inference_dir` is omitted, `conf/<name>.yaml` becomes `${exp_dir}/<name>`
# Override `inference_dir` only when you want a different output location.
exp_tag:
exp_dir: ${recipe_dir}/exp/${exp_tag}
data_dir: ${recipe_dir}/data
inference_dir: ${exp_dir}/${self_name:}

# If inference needs access to manifests under the same dataset root as
# training, define `dataset_dir` here by reusing the training config instead of
# hardcoding a dataset name again.
#
# Example:
# dataset_dir: ${recipe_dir}/data


# Test split definitions are required for inference.
# Each item in `dataset.test` is a dataset reference entry.
# - `name` becomes the output subdirectory name under `${inference_dir}`
# - `data_src` can be a `<recipe>/<task>` tag, a dotted module path, or be
#   omitted to load `${recipe_dir}/dataset/__init__.py`
# - `data_src_args` is forwarded to `Dataset(...)`
# - `transform` is optional and runs before `preprocessor`
#
# Only `data_src_args` is passed to the recipe `Dataset` constructor.
# Top-level fields such as `name` and `transform` are consumed by
# `DataOrganizer`.
#
# Example:
# dataset:
#   test:
#     - name: librispeech_test_clean
#       data_src: librispeech/asr
#       data_src_args:
#         split: test_clean
#         data_path: ${dataset_dir}
#     - name: local_eval
#       data_src_args:
#         split: test
#
# When training already defines `dataset_dir`, prefer referencing that shared
# location rather than requiring users to specify a second dataset path just
# for inference.
dataset:
  _target_: espnet3.components.data.data_organizer.DataOrganizer
  _recursive_: false
  recipe_dir: ${recipe_dir}
  test:
  preprocessor:

##########################################################
#                  PARALLELIZATION SETTING               #
##########################################################
parallel:
  env: local
  n_workers: 1
  # Replace a stale shard lock left by an interrupted run. Do not enable while
  # another run may still be writing to the same output directory.
  allow_overwrite_lock: false

##########################################################
#                    MODEL AND OUTPUT                    #
##########################################################
# The model is the system's `Inference` (espnet3.api.inference): it declares
# what it takes and returns, so nothing below needs to say. Its arguments are
# the ones `espnet2.bin.asr_inference.Speech2Text` takes; `device` is added by
# the provider. For a transducer, set
# `backend_class: espnet2.bin.asr_transducer_inference.Speech2Text` and
# `return_decoded_hyp: true`.
model:
  _target_: espnet3.systems.asr.inference.Inference
  # asr_train_config: ${exp_dir}/config.yaml
  # asr_model_file: ${exp_dir}/valid.acc.ave.pth
  # beam_size: 10

# Dataset columns written beside the outputs, source -> file name. The
# reference for scoring is the usual one; `measure` reads it with
# `ref_key: ref` and the hypothesis with `hyp_key: text`.
copy:
  text: ref

# Only for a model that is not an `Inference`: the dataset field(s) passed to
# it. If `dataset[i]` returns `{"speech": ..., "text": ..., "utt_id": ...}` and
# `input_key: speech`, inference uses `dataset[i]["speech"]` as model input;
# `input_key: [speech, text]` calls `model(speech=..., text=...)`. An
# `Inference` declares its inputs, so leave this unset.
#
# input_key: speech

# Optional output key list.
# These keys must exist in the dict returned by `output_fn`.
# Only the fields listed here are written as SCP files under
# `${inference_dir}/<test_name>/`.
# If omitted, keys are inferred from the first returned sample except for
# `idx_key`. Set this explicitly when you want stable SCP filenames.
#
# output_keys:
#   - hyp

# Sample identifier field name expected in the final inference output dict.
# Inference uses `utt_id` by default, and the final output dict must contain it
# unless you explicitly override `idx_key`.
# This value becomes the first column in generated SCP files and is used to map
# each inference result back to the corresponding dataset sample.
#
#idx_key: utt_id

# Number of utterances decoded per model call. Consecutive dataset items form a
# batch and are passed to the model as a list per input key.
# `espnet2.bin.asr_inference.Speech2Text` decodes such a list in one beam
# search, which is 1.5-2.5x faster than one utterance at a time on a GPU.
# A long utterance next to short ones pads them all, so 4 is a safe default;
# 8-16 pays off when the test set is roughly sorted by length. A batch that does
# not fit in memory is split in halves and retried with a warning; a single
# utterance that does not fit raises an error that names its length.
# Set to `null` for a model or `output_fn` that only supports one item per call.
batch_size: 4

# Only for a model that is not an `Inference`, or for a column the contract
# does not produce: a recipe function converting raw model outputs into dicts
# such as {"utt_id": "...", "hyp": "..."}. With an `Inference` and the
# APIRunner below, the declared outputs are written as they are (`text.scp`)
# and `copy` adds the reference, so this stays unset.
#
# Each output field must be a single value.
# - Primitive values (`str`, `int`, `float`, `bool`) are written directly to SCP.
# - `dict` values are serialized as JSON artifacts and the artifact path is
#   written to SCP.
# - Bare top-level `list` / `tuple` outputs are not supported.
#
# output_fn: src.inference.build_output

# Optional artifact writers for non-scalar outputs. An `Inference`'s audio
# outputs are written as WAV at their own rate without any of this; declare a
# field here only to write it differently.
# Primitive values (str/int/float/bool) are written directly into SCP files.
# Non-primitive values can be saved under:
#   `${inference_dir}/<test_name>/split.<rank>/<field>/<utt_id>.*`
# and the generated file path is written to the SCP entry.
#
# Supported built-in types:
#   - wav    : requires `sample_rate`
#   - npy
#   - json
#   - pickle
#
# If an output field is a `dict`, it is saved as JSON by default. Any nested
# lists inside that dict are preserved through JSON serialization.
#
# You can either declare a built-in type here, or provide a custom writer via
# `_target_`. Custom writers must return the written file path.
#
# output_artifacts:
#   audio:
#     type: wav
#     sample_rate: 16000
#   posterior:
#     type: npy
#   debug_obj:
#     type: pickle
#   custom_field:
#     writer:
#       _target_: src.inference.write_custom_artifact
#       some_option: 123

##########################################################
#               PROVIDER AND RUNNER SETTING              #
##########################################################
# The provider builds `model` on the device it picks. APIRunner runs an
# `Inference` over the dataset shards and writes what it declares; use
# InferenceRunner (with `input_key` and `output_fn`) for a model that is not one.
provider:
  _target_: espnet3.systems.base.inference_provider.InferenceProvider
runner:
  _target_: espnet3.systems.base.api_runner.APIRunner
