##########################################################
#                   Inference SETTING                    #
##########################################################
# Quick usage:
#   python run.py --stages infer --inference_config conf/inference.yaml
#
# Output, one line per trial: `${inference_dir}/<test_name>/score.scp`.
# `measure` reads the target/nontarget labels from the dataset itself
# (`dataset:spk_labels` in `metrics.yaml`).

##########################################################
#                    PATHS AND INPUTS                    #
##########################################################
recipe_dir: .
# Common case:
# - pass both `--training_config` and `--inference_config`
# - `run.py` copies `training_config.exp_tag` / `training_config.exp_dir` here
# - if `inference_dir` is omitted, `conf/<name>.yaml` becomes `${exp_dir}/<name>`
exp_tag:
exp_dir: ${recipe_dir}/exp/${exp_tag}
data_dir: ${recipe_dir}/data
inference_dir: ${exp_dir}/${self_name:}

# Each entry of `dataset.test` is a trial list. `name` becomes the output
# subdirectory under `${inference_dir}`, and `data_src_args` is forwarded to
# the recipe `Dataset` class.
#
# Example:
# dataset:
#   test:
#     - name: vox1_o
#       data_src_args:
#         split: voxceleb1_test
#         trials: vox1_o
dataset:
  _target_: espnet3.components.data.data_organizer.DataOrganizer
  _recursive_: false
  recipe_dir: ${recipe_dir}
  test:
  # No preprocessor: `Inference` takes each trial's two whole utterances and
  # cuts the evaluation crops itself (`model.num_eval` below), so a published
  # model scores raw audio the same way.
  preprocessor:

##########################################################
#                  PARALLELIZATION SETTING               #
##########################################################
parallel:
  env: local
  n_workers: 1

##########################################################
#                    MODEL AND OUTPUT                    #
##########################################################
# `Inference` declares its inputs (`speech`, `speech2`) and output (`score`),
# so there is no `input_key` or `output_fn` to set.
model:
  _target_: espnet3.systems.esp2_spk.inference.Inference
  train_config: ${exp_dir}/config.yaml
  model_file: ${exp_dir}/valid.eer.ave_3best.pth
  # The crops validation takes during training: `num_eval` evenly spaced
  # `target_duration`-second windows of each utterance.
  sample_rate: 16000
  target_duration: 3.0
  num_eval: 10

# Trials are scored one at a time; the crops of a single trial already fill a
# forward pass.
batch_size:


##########################################################
#               PROVIDER AND RUNNER SETTING              #
##########################################################
provider:
  _target_: espnet3.systems.base.inference_provider.InferenceProvider
runner:
  _target_: espnet3.systems.base.inference_runner.InferenceRunner
