##########################################################
#                   Inference SETTING                    #
##########################################################
# Quick usage:
#   python run.py --stages infer --inference_config conf/inference.yaml
#
# Outputs:
# - `${inference_dir}/<test_name>/*.scp`
# - each SCP stores `utt_id value` pairs for one inference field

##########################################################
#                    PATHS AND INPUTS                    #
##########################################################
recipe_dir: .
# Common case:
# - pass both `--training_config` and `--inference_config`
# - `run.py` copies `training_config.exp_tag` / `training_config.exp_dir` here
# - `${self_name:}` resolves to the stem of the config file passed to
#   `--inference_config`
# - if `inference_dir` is omitted, `conf/<name>.yaml` becomes `${exp_dir}/<name>`
# Override `inference_dir` only when you want a different output location.
exp_tag:
exp_dir: ${recipe_dir}/exp/${exp_tag}
data_dir: ${recipe_dir}/data
inference_dir: ${exp_dir}/${self_name:}

# Inference reads the caches `create_dataset` wrote, so this has to resolve to
# the same place the training config used. Keeping the same default and the same
# environment variable is what makes that automatic.
cache:
  cache_dir: ${oc.env:OWSM_CACHE,${recipe_dir}/data/hf}


# Test split definitions are required for inference.
# Each item in `dataset.test` is a dataset reference entry.
# - `name` becomes the output subdirectory name under `${inference_dir}`
# - `data_src` is a dotted module path naming one sub-dataset. It cannot be
#   omitted here: a mixture has several, and `${recipe_dir}/dataset/` is the
#   shared layer rather than a dataset of its own.
# - `data_src_args` is forwarded to `Dataset(...)`
# - `transform` is optional and runs before `preprocessor`. Every entry wants
#   one here: it is what turns the reference's `<lang><task>` tags into the
#   `language` and `task` the model is prompted with.
#
# Only `data_src_args` is passed to the recipe `Dataset` constructor.
# Top-level fields such as `name` and `transform` are consumed by
# `DataOrganizer`.
#
# `name` is free-form, but naming it `<corpus>_<split>` keeps the output
# directories readable once the mixture has a dozen entries.
#
# Example:
# dataset:
#   test:
#     - name: spgispeech_val
#       data_src: egs3.owsm_v4.esp2_s2t.dataset.sub_datasets.spgispeech
#       data_src_args:
#         split: val
#         recipe_dir: ${recipe_dir}
#         cache: ${cache}
#       transform:
#         _target_: egs3.owsm_v4.esp2_s2t.dataset.dataset.PromptFromTags
#     - name: must_c_dev
#       data_src: egs3.owsm_v4.esp2_s2t.dataset.sub_datasets.must_c
#       data_src_args:
#         split: dev
#         recipe_dir: ${recipe_dir}
#         cache: ${cache}
#       transform:
#         _target_: egs3.owsm_v4.esp2_s2t.dataset.dataset.PromptFromTags
dataset:
  _target_: espnet3.components.data.data_organizer.DataOrganizer
  _recursive_: false
  recipe_dir: ${recipe_dir}
  test:
  preprocessor:

##########################################################
#                  PARALLELIZATION SETTING               #
##########################################################
parallel:
  env: local
  n_workers: 1

##########################################################
#                    MODEL AND OUTPUT                    #
##########################################################
# The model is the system's `Inference` (espnet3.api.inference): it declares
# what it takes and returns, so nothing below needs to say. Its arguments are
# the ones `espnet2.bin.s2t_inference.Speech2Text` takes; `device` is added by
# the provider.
#
# Besides `speech` it takes an optional `language` and `task` per utterance,
# picked out of each dataset item by those names. One OWSM cache holds every
# direction at once, so a fixed task would decode the translation rows as
# ASR; each test entry below therefore carries a `transform` that reads the
# reference's `<lang><task>` tags into those two columns.
model:
  # S2TLongFormBackend cuts a recording of any length into utterances and
  # returns (start, end, text) for each; ESP2S2TInferenceRunner reads `text`
  # and `segments` off that. `_recursive_: false` keeps the inner config
  # unbuilt so the backend can pass the provider's `device` to the checkpoint.
  _target_: espnet3.systems.esp2_s2t.src.longform_backend.S2TLongFormBackend
  _recursive_: false
  model:
    _target_: espnet2.bin.s2t_inference.Speech2Text
    # s2t_train_config: ${exp_dir}/config.yaml
    # s2t_model_file: ${exp_dir}/valid.acc.ave.pth
    # beam_size: 5

# Nothing but the model's outputs is written here: `text.scp` is what the
# model said, with the tags already stripped, and `segments` where each
# utterance fell. The reference for scoring is the dataset's `text` column,
# which keeps its tags, and `measure` reads it from the data
# (`ref: dataset:text` in metrics.yaml's `inputs:`), so this stage does not
# copy it.

# The dataset field(s) passed to the backend. Besides `speech` it takes an
# optional `language` and `task` per utterance: one OWSM cache holds every
# direction at once, so a fixed task would decode the translation rows as
# ASR. Each test entry below carries a `transform` that reads the reference's
# `<lang><task>` tags into those two columns. Every name here must also appear
# in `contract.inputs`.
input_key: [speech, language, task]

# Optional output key list.
# These keys must exist in the runner's named result.
# Only the fields listed here are written as SCP files under
# `${inference_dir}/<test_name>/`.
# If omitted, keys are inferred from the first returned sample except for
# `idx_key`. Set this explicitly when you want stable SCP filenames.
#
output_keys:
  - text
  - segments

# Sample identifier field name expected in the final inference output dict.
# Inference uses `utt_id` by default, and the final output dict must contain it
# unless you explicitly override `idx_key`.
# This value becomes the first column in generated SCP files and is used to map
# each inference result back to the corresponding dataset sample.
#
#idx_key: utt_id

# Number of utterances decoded per model call. Consecutive dataset items form a
# batch and are passed to the model as a list per input key.
# `espnet2.bin.s2t_inference.Speech2Text` decodes such a list in one beam
# search, which is 1.5-2.5x faster than one utterance at a time on a GPU.
# A long utterance next to short ones pads them all, so 4 is a safe default;
# 8-16 pays off when the test set is roughly sorted by length. A batch that does
# not fit in memory is split in halves and retried with a warning; a single
# utterance that does not fit raises an error that names its length.
# Set to `null` for a model or `output_fn` that only supports one item per call;
# S2TLongFormBackend decides per item: a recording that fits one window and
# carries no previous text joins a group decoded in one beam search, and
# anything longer, or conditioned, or phones on an encoder-decoder
# checkpoint, is decoded on its own. So the value is an upper bound rather
# than a promise, and 4 is safe -- a long utterance beside short ones pads
# them all. Raise it when the test set is roughly sorted by length; `null`
# decodes strictly one at a time.
batch_size: 4


# The same contract is applied around the runner for infer, publication and
# demo. `speech` is resampled to the checkpoint's rate before the runner sees
# it; `language` and `task` are optional, because a checkpoint that carries a
# language symbol can work the language out itself.
contract:
  inputs:
    speech:
      kind: audio
      label: Input Audio
      sample_rate: 16000
      rate_policy: resample
      channels: 1
    language:
      kind: text
      label: Language
      optional: true
    task:
      kind: text
      label: Task
      optional: true
  outputs:
    text:
      kind: text
      label: Transcription
    segments:
      kind: segments
      label: Segments

# Optional artifact writers for non-scalar outputs.
# Primitive values (str/int/float/bool) are written directly into SCP files.
# Non-primitive values can be saved under:
#   `${inference_dir}/<test_name>/split.<rank>/<field>/<utt_id>.*`
# and the generated file path is written to the SCP entry.
#
# Supported built-in types:
#   - wav    : requires `sample_rate`
#   - npy
#   - json
#   - pickle
#
# If an output field is a `dict`, it is saved as JSON by default. Any nested
# lists inside that dict are preserved through JSON serialization.
#
# You can either declare a built-in type here, or provide a custom writer via
# `_target_`. Custom writers must return the written file path.
#
# output_artifacts:
#   audio:
#     type: wav
#     sample_rate: 16000
#   posterior:
#     type: npy
#   debug_obj:
#     type: pickle
#   custom_field:
#     writer:
#       _target_: src.inference.write_custom_artifact
#       some_option: 123

##########################################################
#               PROVIDER AND RUNNER SETTING              #
##########################################################
provider:
  _target_: espnet3.systems.base.inference_provider.InferenceProvider
# The provider builds `model`; ESP2S2TInferenceRunner turns the backend's
# (start, end, text) utterances into the contracted `text` and `segments`.
# The shared contract checks inputs and the runner's result.
runner:
  _target_: espnet3.systems.esp2_s2t.inference.ESP2S2TInferenceRunner
