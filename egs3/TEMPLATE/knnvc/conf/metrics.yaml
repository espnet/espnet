##########################################################
#                 METRIC SCORING SETTING                 #
##########################################################
# Quick usage:
#   python run.py --stages measure \
#       --training_config conf/training.yaml \
#       --inference_config conf/inference.yaml --metrics_config conf/metrics.yaml
#
# Shared default merged under every kNN-VC recipe's metrics config. The
# `infer` stage writes `wav.scp` (the converted audio) per test set; the
# source transcript a metric scores against is the test set's own `text`
# column, read from the data as `dataset:text` and written to
# `<test_name>/dataset/text.scp` on first use. Test sets are discovered from
# the `infer` output directory, so the same conversion pairs are scored.
#
# `ASRIntelligibility` transcribes the converted audio and scores it against
# the source transcript: the protocol behind the WER/CER the kNN-VC authors
# report. Recipes inherit it; a recipe whose conversion items carry no `text`
# must set its own `metrics:` list (OmegaConf replaces the list wholesale).
# `asr` is any tag `Speech2Text.from_pretrained` accepts, and scores are only
# comparable across systems scored by the same ASR. Set `device: cuda` to use
# a GPU.

recipe_dir: .
exp_tag:
exp_dir: ${recipe_dir}/exp/${exp_tag}

dataset:

metrics:
  - metric:
      _target_: espnet3.systems.knnvc.metrics.intelligibility.ASRIntelligibility
      asr: espnet/simpleoier_librispeech_asr_train_asr_conformer7_wavlm_large_raw_en_bpe5000_sp
      device: cpu
    inputs:
      wav: wav            # <test_name>/wav.scp, the converted audio
      ref: dataset:text   # the source utterance's transcript
