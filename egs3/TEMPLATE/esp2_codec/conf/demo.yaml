##########################################################
#                    DEMO PACK SETTING                   #
##########################################################
# Quick usage:
#   python run.py --stages pack_demo \
#     --training_config conf/training.yaml --demo_config conf/demo.yaml
#   python run.py --stages upload_demo \
#     --training_config conf/training.yaml --demo_config conf/demo.yaml
#
# `--training_config` is required for both stages: this config refers to
# `${exp_tag}`, which is owned by the training config and copied in by the
# runner. Without it the interpolation is unresolved and the stage fails.
#
# Main stages and what this config is used for:
# - `pack_demo`: packs `demo.yaml`, `ui.app_script`, and `pack.include`
# - `upload_demo`: uploads the packed demo directory
recipe_dir: .

##########################################################
#                    MODEL SOURCE                        #
##########################################################
# `model.dir_or_tag` selects the packed model used by the demo.
# - local packed directory relative to the demo dir, e.g. `../model_pack`
# - remote model tag understood by `espnet_model_zoo`
#
# The bundle runs through the installed `espnet3.systems.esp2_codec` runner
# and carries no recipe code, so `trust_user_code` stays false.
model:
  dir_or_tag: ${upload_demo.hf_repo}
  trust_user_code: false

##########################################################
#                     UI DEFINITION                      #
##########################################################
# `ui.app_script` is copied into the packed demo as `app.py`.
#
# `ui.description` may be:
# - a markdown/text file path; `pack_demo` copies that file into the bundle
# - inline text; the app shows it directly
# The default is the short guide shown above the inputs,
# `egs3/TEMPLATE/esp2_codec/src/demo_description.md`, referenced relative to
# the repository root so `pack_demo` finds and copies it from any recipe.
#
# The input and output widgets are built from the packed inference contract
# (`contract` in conf/inference.yaml): one audio input, one audio output, with
# the labels declared there. A codec demo is audio in / audio out: the
# uploaded waveform is encoded to discrete codes and decoded back, so the
# visible result is the resynthesized audio. Set `ui.inputs` / `ui.outputs`
# (`key`, `type`, `label` entries) only to override that wiring.
ui:
  app_script: src/app.py
  title: ${set_corpus_and_system:} demo
  description: egs3/TEMPLATE/esp2_codec/src/demo_description.md

##########################################################
#                    PACKING SETTING                     #
##########################################################
# `pack.include` copies extra files or directories into the packed demo.
# Globs are supported, e.g. `assets/**/*.png`.
#
# `pack.exclude` removes matches from copied include directories. Patterns use
# the same style as publication bundle excludes, e.g.:
# - `**/*.log`
# - `**/tensorboard/**`
#
# `pack.readme` renders the Hugging Face Space README.md. Values under
# `readme_context` override the defaults inferred by `pack_demo`.
pack:
  out_dir: demo
  include: []
  exclude: []
  # Python packages written to requirements.txt in the packed demo.
  # Standard pip specifiers and git+https:// entries are both supported.
  # Example git install: git+https://github.com/espnet/espnet@main
  requirements:
    - git+https://github.com/espnet/espnet.git
  readme: ${config_path:../src/hf_demo_readme.md}
  readme_context:
    title: ${ui.title}
    emoji: "\U0001f5dc️"
    color_from: blue
    color_to: green
    sdk: gradio
    app_file: app.py
    pinned: "false"
    license: apache-2.0
    tags: |-
      - espnet
      - espnet3
      - gradio
      - neural-codec
      - audio-codec
      - audio-to-audio
    hf_repo: ${upload_demo.hf_repo}
    model_ref: ${model.dir_or_tag}

##########################################################
#                    UPLOAD SETTING                      #
##########################################################
# Upload target used by `upload_demo`.
upload_demo:
  hf_repo: espnet/${set_corpus_and_system:}_${exp_tag}
  # organization: your-org
  # update: false (default) raises an error if the Space already exists,
  # preventing accidental overwrites of a published demo.
  # Set to true to upload over an existing Space.
  update: false
  # Glob patterns of existing Space files to delete before uploading.
  # Only used when update: true. Default ["*"] fully replaces the Space
  # contents. Set to [] for an additive upload.
  delete_patterns:
    - "*"
