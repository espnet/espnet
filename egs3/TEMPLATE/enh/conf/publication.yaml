##########################################################
#                  PUBLICATION SETTING                   #
##########################################################
# Quick usage:
#   python run.py --stages pack_model \
#       --training_config conf/training.yaml \
#       --publication_config conf/publication.yaml
#   python run.py --stages upload_model \
#       --training_config conf/training.yaml \
#       --publication_config conf/publication.yaml
#
# Assumptions:
# - Running `infer` and `measure` before `pack_model` is recommended.
# - `measure` writes `metrics.json` under `${inference_dir}`.
# - If `${inference_dir}` contains that `metrics.json`, `pack_model` bundles it
#   and uses it when rendering the README.

##########################################################
#                    PATHS AND INPUTS                    #
##########################################################
recipe_dir: .
exp_tag: ${self_name:}
exp_dir: exp/${exp_tag}
inference_dir: ${exp_dir}/inference
data_dir: ${recipe_dir}/data

##########################################################
#                   PACK MODEL SETTING                   #
##########################################################
# `pack_model` builds the bundle in this order:
#   1. Bulk-copy `${exp_dir}` and each `include` path (honoring `exclude`)
#   2. Named artifacts / rewritten YAML configs
#   3. `meta.yaml` at the bundle root
#
# Include recipe `src` and `dataset` when the packed model needs local code.
pack_model:
  out_dir: ${exp_dir}/model_pack
  allow_overwrite: false
  inference_dir: ${inference_dir}
  include_model_detail: false
  readme: ${config_path:../src/hf_model_readme.md}
  include:
    - src
    - dataset
  exclude:
    - inference
    - inference_*
    - last.ckpt
    - "**/step*.ckpt"
    - "**/*.log"
    - "**/tensorboard/**"
    - "**/wandb/**"

##########################################################
#                  UPLOAD MODEL SETTING                  #
##########################################################
# Upload uses `huggingface_hub` with your local Hugging Face login.
# Run `hf auth login` first so the Python API can reuse the saved token.
upload_model:
  hf_repo: espnet/${set_corpus_and_system:}_${exp_tag}
  private: false
  # update: false raises if the repo already exists (safer default).
  update: false
  delete_patterns:
    - "*"
