##########################################################
#                    DEMO PACK SETTING                   #
##########################################################
# Quick usage:
#   python run.py --stages pack_demo   --demo_config conf/demo.yaml
#   python run.py --stages upload_demo --demo_config conf/demo.yaml
#
# Main stages and what this config is used for:
# - `pack_demo`: packs `demo.yaml`, `ui.app_script`, and `pack.include`
# - `upload_demo`: uploads the packed demo directory
recipe_dir: .

##########################################################
#                    MODEL SOURCE                        #
##########################################################
# `model.dir_or_tag` selects the packed model used by the demo.
# - local packed directory relative to the demo dir, e.g. `../model_pack`
# - Hugging Face repo containing a recipe archive with conf/inference.yaml
#
# Include --inference_config when running pack_model: DemoSession loads the
# packed inference config through InferenceModel.
model:
  dir_or_tag: exp/${exp_tag}/model_pack
  device: auto

##########################################################
#                     UI DEFINITION                      #
##########################################################
# `ui.app_script` is copied into the packed demo as `app.py`.
#
# `ui.description` may be:
# - a markdown/text file path; `pack_demo` copies that file into the bundle
# - inline text; the app shows it directly
#
# Inputs and outputs are generated from conf/inference.yaml's contract.
# Set ui.inputs or ui.outputs explicitly to override that layout. Custom
# kinds need a matching UI asset registered in the demo session registry.
ui:
  app_script: ${config_path:../src/app.py}
  title: ${set_corpus_and_system:} demo
  description: README.md

##########################################################
#                    PACKING SETTING                     #
##########################################################
# `pack.include` copies extra files or directories into the packed demo.
# Globs are supported, e.g. `assets/**/*.png`.
#
# `pack.exclude` removes matches from copied include directories. Patterns use
# the same style as publication bundle excludes, e.g.:
# - `**/*.log`
# - `**/tensorboard/**`
#
# `pack.readme` renders the Hugging Face Space README.md. Values under
# `readme_context` override the defaults inferred by `pack_demo`.
pack:
  out_dir: demo
  include: []
  exclude: []
  # Python packages written to requirements.txt in the packed demo.
  # Standard pip specifiers and git+https:// entries are both supported.
  # Example git install: git+https://github.com/espnet/espnet@main
  requirements:
    - espnet[asr,demo] @ git+https://github.com/espnet/espnet.git
  readme: ${config_path:../src/hf_demo_readme.md}
  readme_context:
    title: ${ui.title}
    emoji: "\U0001f399\ufe0f"
    color_from: blue
    color_to: green
    sdk: gradio
    app_file: app.py
    pinned: "false"
    license: apache-2.0
    tags: |-
      - espnet
      - espnet3
      - gradio
      - speech-recognition
      - automatic-speech-recognition
    hf_repo: ${upload_demo.hf_repo}
    model_ref: ${model.dir_or_tag}

##########################################################
#                    UPLOAD SETTING                      #
##########################################################
# Upload target used by `upload_demo`.
upload_demo:
  hf_repo: espnet/${set_corpus_and_system:}_${exp_tag}
  # organization: your-org
  # update: false (default) raises an error if the Space already exists,
  # preventing accidental overwrites of a published demo.
  # Set to true to upload over an existing Space.
  update: false
  # Glob patterns of existing Space files to delete before uploading.
  # Only used when update: true. Default ["*"] fully replaces the Space
  # contents. Set to [] for an additive upload.
  delete_patterns:
    - "*"
