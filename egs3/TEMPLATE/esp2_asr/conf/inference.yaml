##########################################################
#                   Inference SETTING                    #
##########################################################
# Quick usage:
#   python run.py --stages infer --inference_config conf/inference.yaml
#
# Outputs:
# - `${inference_dir}/<test_name>/*.scp`
# - each SCP stores `utt_id value` pairs for one inference field

##########################################################
#                    PATHS AND INPUTS                    #
##########################################################
# Common case:
# - pass both `--training_config` and `--inference_config`
# - `recipe_dir`, `exp_tag` and `exp_dir` are inherited from the training
#   config (the `train` stage's own `exp_tag`/`exp_dir`), not redeclared here
# - `${self_name:}` resolves to the stem of the config file passed to
#   `--inference_config`
# - if `inference_dir` is omitted, `conf/<name>.yaml` becomes `${exp_dir}/<name>`
# Override `inference_dir` only when you want a different output location.
inference_dir: ${exp_dir}/${self_name:}

# If inference needs access to manifests under the same dataset root as
# training, define `dataset_dir` here by reusing the training config instead of
# hardcoding a dataset name again.
#
# Example:
# dataset_dir: ${recipe_dir}/data


# Test split definitions are required for inference.
# Each item in `dataset.test` is a dataset reference entry.
# - `name` becomes the output subdirectory name under `${inference_dir}`
# - `data_src` can be a `<recipe>/<task>` tag, a dotted module path, or be
#   omitted to load `${recipe_dir}/dataset/__init__.py`
# - `data_src_args` is forwarded to `Dataset(...)`
# - `transform` is optional and runs before `preprocessor`
#
# Only `data_src_args` is passed to the recipe `Dataset` constructor.
# Top-level fields such as `name` and `transform` are consumed by
# `DataOrganizer`.
#
# The recipe `Dataset` class must inherit
# `espnet3.components.data.base_dataset.BaseDataset` and declare `fields`:
# a tuple of `espnet3.contract.Field` declarations, e.g.
# `fields = (Field("speech", "audio"), Field("text", "text"))` after
# importing `Field` from `espnet3.contract`. The first item of each instance
# is checked against this declaration.
#
# An inference-only dataset only needs to declare the fields it actually
# returns (e.g. `speech` and `utt_id`); it does not need to declare `text`
# or other training-only fields it does not provide.
#
# Example:
# dataset:
#   test:
#     - name: librispeech_test_clean
#       data_src: librispeech/asr
#       data_src_args:
#         split: test_clean
#         data_path: ${dataset_dir}
#     - name: local_eval
#       data_src_args:
#         split: test
#
# When training already defines `dataset_dir`, prefer referencing that shared
# location rather than requiring users to specify a second dataset path just
# for inference.
dataset:
  _target_: espnet3.components.data.data_organizer.DataOrganizer
  _recursive_: false
  recipe_dir: ${recipe_dir}
  test:
  preprocessor:

##########################################################
#                  PARALLELIZATION SETTING               #
##########################################################
parallel:
  env: local
  n_workers: 1
  # Replace a stale shard lock left by an interrupted run. Do not enable while
  # another run may still be writing to the same output directory.
  allow_overwrite_lock: false

##########################################################
#                    MODEL AND OUTPUT                    #
##########################################################
# The ASRInferenceRunner formats native ESPnet2 n-best results as `text`.
# `model` takes the arguments of `espnet2.bin.asr_inference.Speech2Text`;
# `device` is added by the provider. For transducer, set `_target_` to
# `espnet2.bin.asr_transducer_inference.Speech2Text`, set
# `return_decoded_hyp: true`, and use `batch_size: null`.
model:
  _target_: espnet2.bin.asr_inference.Speech2Text
  # asr_train_config: ${exp_dir}/config.yaml
  # asr_model_file: ${exp_dir}/valid.acc.ave.pth
  # beam_size: 10

# Nothing but the model's outputs is written here: `text.scp` is what the
# model said. The reference for scoring is the dataset's `text` column, and
# `measure` reads it from the data (bind `ref` to `dataset:text` in the
# metrics config's `inputs:`), so it is not copied by this stage.

# The dataset field(s) passed to the model. If `dataset[i]` returns `{"speech": ..., "text": ..., "utt_id": ...}` and
# `input_key: speech`, inference uses `dataset[i]["speech"]` as model input;
# `input_key: [speech, text]` calls `model(speech=..., text=...)`.
#
input_key: speech

# Optional output key list.
# These keys must exist in the runner's named result.
# Only the fields listed here are written as SCP files under
# `${inference_dir}/<test_name>/`.
# If omitted, keys are inferred from the first returned sample except for
# `idx_key`. Set this explicitly when you want stable SCP filenames.
#
# output_keys:
#   - hyp

# Sample identifier field name added by the runner to each result.
# Inference uses `utt_id` by default unless you override `idx_key`.
# This value becomes the first column in generated SCP files and is used to map
# each inference result back to the corresponding dataset sample.
#
#idx_key: utt_id

# Number of utterances decoded per model call. Consecutive dataset items form a
# batch and are passed to the model as a list per input key.
# `espnet2.bin.asr_inference.Speech2Text` decodes such a list in one beam
# search, which is 1.5-2.5x faster than one utterance at a time on a GPU.
# A long utterance next to short ones pads them all, so 4 is a safe default;
# 8-16 pays off when the test set is roughly sorted by length. A batch that does
# not fit in memory raises an error with input lengths and advice to lower
# `batch_size`. Set to `null` for a model that only supports one
# item per call. Unsupported batching raises an error without retrying.
batch_size: 4

# The same contract is applied around the runner for infer, publication and
# demo. An audio input with a known rate is resampled to 16 kHz before the
# runner receives Audio with every channel preserved. Bare arrays carry no rate
# and are assumed to be at the declared rate. Set rate_policy: reject to refuse
# mismatches.
# Custom kinds or normalizers can be registered from a recipe module with
# `imports: [src.contracts]`. A normalizer receives the Kind's checked value
# (for audio, an Audio object) and returns the same Kind. This lets a recipe
# reuse its deterministic training preprocessor. Loading that module from a
# published bundle requires trust_user_code=True.
contract:
  inputs:
    speech:
      kind: audio
      label: Input Audio
      sample_rate: 16000
      rate_policy: resample
      # Exactly this many channels reach the model. Multichannel input is
      # rejected unless a normalizer below reduces it first (normalizers run
      # before this check). Remove `channels` for a multichannel model to pass
      # the input through unchanged, or set `channels: N` to require N.
      channels: 1
      # Explicit mono conversion, if required by the model:
      # normalize: [mean_channels]  # or [first_channel]
  outputs:
    text:
      kind: text
      label: Transcription
      # Add normalize: [strip, to_lower] when the same deterministic text
      # normalization is used for recipe evaluation and public inference.

# Optional artifact writers for non-scalar outputs. To write audio as WAV,
# configure its sample rate explicitly.
# Primitive values (str/int/float/bool) are written directly into SCP files.
# Non-primitive values can be saved under:
#   `${inference_dir}/<test_name>/split.<rank>/<field>/<utt_id>.*`
# and the generated file path is written to the SCP entry.
#
# Supported built-in types:
#   - wav    : requires `sample_rate`
#   - npy
#   - json
#   - pickle
#
# If an output field is a `dict`, it is saved as JSON by default. Any nested
# lists inside that dict are preserved through JSON serialization.
#
# You can either declare a built-in type here, or provide a custom writer via
# `_target_`. Custom writers must return the written file path.
#
# output_artifacts:
#   audio:
#     type: wav
#     sample_rate: 16000
#   posterior:
#     type: npy
#   debug_obj:
#     type: pickle
#   custom_field:
#     writer:
#       _target_: src.artifacts.write_custom_artifact
#       some_option: 123

##########################################################
#               PROVIDER AND RUNNER SETTING              #
##########################################################
# The provider builds `model`; ASRInferenceRunner decodes its n-best output
# to `text`. The shared inference contract validates inputs and runner results.
provider:
  _target_: espnet3.systems.base.inference_provider.InferenceProvider
runner:
  _target_: espnet3.systems.esp2_asr.inference.ASRInferenceRunner
