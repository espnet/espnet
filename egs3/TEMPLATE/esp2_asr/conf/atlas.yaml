##########################################################
#                   ATLAS DEFAULT SETTING                #
##########################################################
# Shared defaults for ATLAS (hyperparameter/architecture search) studies.
# Recipe-level conf/atlas.yaml files only need to declare study-specific
# values (study_name, task/dataset/model, metric, budget limits, trial
# timeouts, search_space, etc.); this file supplies the infra boilerplate
# that is the same across recipes and is merged in automatically by
# `load_atlas_config()`.

atlas:
  tick_interval_sec_idle: 60
  tick_interval_sec_trial_active: 600


  submission:
    environment: slurm
    instructions: |
      Submit jobs with Slurm: write the script to the supplied script_path, map
      resource limits to #SBATCH options, and submit it with sbatch. Use squeue
      and sacct for job status and scancel to cancel jobs. Run the supplied worker
      command from the recipe directory with the repository's pixi environment.
      Return the Slurm job ID.
    resources:
      gpus: 1
      mem: 32G
      time: "24:00:00"
      # Set these to your cluster's Slurm partition/account.
      partition: YOUR_GPU_PARTITION
      account: YOUR_SLURM_ACCOUNT
    controller:
      resources:
        gpus: 0
        cpus: 1
        mem: 4G
        time: "06:00:00"
        partition: YOUR_CPU_PARTITION
        account: YOUR_SLURM_ACCOUNT
      handoff_after_sec: 18000

  agent:
    provider: codex

  trial:
    timeout_sec: 86400

  budget:
    max_parallel_trials: 1
    max_failures: 10
    no_improve_stop: 10
