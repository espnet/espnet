##########################################################
#                 METRIC SCORING SETTING                 #
##########################################################
# Quick usage:
#   python run.py --stages measure --metrics_config conf/metrics.yaml
# Or, to reuse the identity (and inference_dir) baked by a previous
# training/infer run, without passing any config explicitly:
#   python run.py --stages measure --exp_dir exp/train_asr_transformer
#
# Assumptions:
# - `infer` has already produced `<test_name>/*.scp` files: one per output of
#   the model, named after the output (`text.scp` for ASR).
# - A metric's `inputs:` binds each declared input name to a source: one of
#   those files (`hyp: text`), or a column of the test set itself as
#   `dataset:<column>` (`ref: dataset:text`): the reference is the data's, so
#   it is read from the data, into `<test_name>/dataset/<column>.scp` on
#   first use.
# - If `dataset.test` is omitted, test sets are discovered from `${inference_dir}`
#   subdirectories.

##########################################################
#                    PATHS AND INPUTS                    #
##########################################################
# Common case:
# - pass `--training_config`, `--inference_config`, and `--metrics_config`
# - `recipe_dir`, `exp_tag` and `exp_dir` are inherited from the training
#   config; `inference_dir` is inherited from the `infer` stage's own
#   config, so `measure` reads the same directory used by `infer`
#
# Standalone `measure` is also supported with `--exp_dir`: it inherits
# `train`'s and `infer`'s baked configs from `<exp_dir>/config/`, so no
# `--training_config`/`--inference_config` is needed. Add `inference_dir`
# below only when you want to score a different inference output directory.

# A `dataset:<column>` input that is not a scalar (a reference waveform for
# an audio metric, say) is written as an artifact under
# `<test_name>/dataset/<column>/<id>.<ext>` and the .scp holds its path.
# Say how, per column, in the form of inference.yaml's `output_artifacts`;
# an array becomes `.npy` and a dict JSON when nothing is said.
# dataset_artifacts:
#   speech:
#     type: wav
#     sample_rate: 16000


##########################################################
#                    METRIC DEFINITION                   #
##########################################################
# WER/CER/TER declare the inputs they read (`ref`, `hyp`, both kind `text`)
# and the output key they return (kind `number`). `inputs:` is required: it
# binds each declared name to where it is read from. Before running a
# metric, `measure` checks each declared input against the inference
# config's model: a plain SCP input (`text` above) must name one of the
# model's own declared `outputs` (and agree with its kind); a `dataset:`
# input is the test set's own data, so it is not checked against the model.
# A model that is not an `espnet3.api.inference.InferenceAPI` subclass (so
# declares no outputs at all) is rejected outright, explaining why, instead
# of a bare "Missing SCP file" assertion.
metrics:
  - metric:
      _target_: espnet3.systems.esp2_asr.metrics.wer.WER
      clean_types:        # optional TextCleaner pipeline, e.g. [tacotron]
    inputs:
      ref: dataset:text  # the test set's transcript
      hyp: text          # <test_name>/text.scp

  - metric:
      _target_: espnet3.systems.esp2_asr.metrics.cer.CER
      clean_types:        # optional TextCleaner pipeline, e.g. [jaconv]
    inputs:
      ref: dataset:text  # the test set's transcript
      hyp: text          # <test_name>/text.scp

# TER (token error rate) scores on the model's subword tokens, so it needs the
# recipe's trained SentencePiece model. It is recipe-specific and off by default.
# To enable it, uncomment below and point `bpemodel` at your trained model:
# - metric:
#     _target_: espnet3.systems.esp2_asr.metrics.ter.TER
#     bpemodel: exp/bpe_5000/bpe.model  # path to the trained SentencePiece model
#     clean_types:        # optional TextCleaner pipeline
#   inputs:
#     ref: dataset:text  # the test set's transcript
#     hyp: text          # <test_name>/text.scp
