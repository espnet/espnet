##########################################################
#                 METRIC SCORING SETTING                 #
##########################################################
# Quick usage:
#   python run.py --stages measure --metrics_config conf/metrics.yaml
#
# Assumptions:
# - `infer` has already produced `<test_name>/*.scp` files.
# - Each metric reads matching SCP keys such as `ref.scp` and `hyp.scp`.
# - If `dataset.test` is omitted, test sets are discovered from `${inference_dir}`
#   subdirectories.

##########################################################
#                    PATHS AND INPUTS                    #
##########################################################
recipe_dir: .
# Common case:
# - pass `--training_config`, `--inference_config`, and `--metrics_config`
# - `run.py` copies `training_config.exp_tag` / `training_config.exp_dir` here
# - `run.py` also copies `inference_config.inference_dir` here, so `measure`
#   reads the same directory used by `infer`
#
# Standalone `measure` is also supported. In that case, set either `exp_tag` or
# a concrete `exp_dir` below, and add `inference_dir` here unless
# `--inference_config` provides it. Add `inference_dir` only when you want to
# score a different inference output directory.
exp_tag:
exp_dir: ${recipe_dir}/exp/${exp_tag}


##########################################################
#                    METRIC DEFINITION                   #
##########################################################
# The three rates egs2/TEMPLATE/s2t1/s2t.sh reports (s2t.sh:1596-1612): char,
# word and BPE, over EVERY row. s2t.sh does not split by task, so a translation
# is scored against its translation as if it were a transcript; that is the
# number the OWSM recipe produces. There is no BLEU here because there is none
# in any owsm recipe to match.
#
# Two normalization details are reproduced because they change the numbers:
#
#   remove_tags strips the reference's OWSM tags.
#
#   cleaner and hyp_cleaner are separate, as s2t.sh keeps them, and both default
#   to none. egs2/owsm_v3/s2t1/run.sh:18 suggests whisper_en for both, commented
#   out; pass cleaner: [whisper_en] to enable it.
metrics:
  - metric:
      _target_: espnet3.systems.owsm.metrics.error_rate.CER
      cleaner:
      hyp_cleaner:
      remove_tags: true
  - metric:
      _target_: espnet3.systems.owsm.metrics.error_rate.WER
      cleaner:
      hyp_cleaner:
      remove_tags: true
  - metric:
      _target_: espnet3.systems.owsm.metrics.error_rate.TER
      # BPE-piece error rate, s2t.sh's third pass. Not sacreBLEU's TER
      # (translation edit rate), which espnet3/systems/esp2_st reports.
      bpemodel: ${tokenizer.save_path}/${tokenizer.model_type}.model
      cleaner:
      hyp_cleaner:
      remove_tags: true
