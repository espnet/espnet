##########################################################
#                 METRIC SCORING SETTING                 #
##########################################################
# Quick usage:
#   python run.py --stages measure \
#       --training_config conf/training.yaml \
#       --inference_config conf/inference.yaml \
#       --metrics_config conf/metrics.yaml
#
# Assumptions:
# - `infer` has already written `<test_name>/reference.scp` and
#   `<test_name>/enhanced.scp` (plus matching wavs).
# - If `dataset.test` is omitted, test sets are discovered from
#   `${inference_dir}` subdirectories.
#
# Common speech enhancement metrics: SI-SNR, PESQ, STOI.

##########################################################
#                    PATHS AND INPUTS                    #
##########################################################
recipe_dir: .
exp_tag:
exp_dir: ${recipe_dir}/exp/${exp_tag}

##########################################################
#                    METRIC DEFINITION                   #
##########################################################
metrics:
  - metric:
      _target_: espnet3.systems.esp2_enh.metrics.sisnr.SISNR
      ref_key: reference
      hyp_key: enhanced
    inputs:
      reference: reference
      enhanced: enhanced

  - metric:
      _target_: espnet3.systems.esp2_enh.metrics.pesq.PESQ
      ref_key: reference
      hyp_key: enhanced
      fs: 16000
    inputs:
      reference: reference
      enhanced: enhanced

  - metric:
      _target_: espnet3.systems.esp2_enh.metrics.stoi.STOI
      ref_key: reference
      hyp_key: enhanced
      fs: 16000
    inputs:
      reference: reference
      enhanced: enhanced
