##########################################################
#                   INFERENCE SETTING                    #
##########################################################
# Quick usage:
#   python run.py --stages infer \
#       --training_config conf/training.yaml \
#       --inference_config conf/inference.yaml
#
# Outputs:
# - `${inference_dir}/<test_name>/*.scp` (and matching wav artifacts)
# - each SCP stores `utt_id value` pairs for one inference field

##########################################################
#                    PATHS AND INPUTS                    #
##########################################################
recipe_dir: .
# Common case:
# - pass both `--training_config` and `--inference_config`
# - `launch()` copies `training_config.exp_tag` / `training_config.exp_dir` here
# - `${self_name:}` resolves to the stem of the config file passed to
#   `--inference_config`
exp_tag:
exp_dir: ${recipe_dir}/exp/${exp_tag}
data_dir: ${recipe_dir}/data
inference_dir: ${exp_dir}/${self_name:}

# Test split definitions are required for inference.
# Each item in `dataset.test` is a dataset reference entry.
# - `name` becomes the output subdirectory name under `${inference_dir}`
# - omit `data_src` to load `${recipe_dir}/dataset/__init__.py`
# - `data_src_args` is forwarded to `Dataset(...)`
#
# Example:
# dataset:
#   test:
#     - name: test
#       data_src_args:
#         split: test
#         data_path: ${dataset_dir}
#         inference: true
dataset:
  _target_: espnet3.components.data.data_organizer.DataOrganizer
  _recursive_: false
  recipe_dir: ${recipe_dir}
  test:
  preprocessor:

##########################################################
#                  PARALLELIZATION SETTING               #
##########################################################
parallel:
  env: local
  n_workers: 1

##########################################################
#                    MODEL AND OUTPUT                    #
##########################################################
# The model is the enhancement system's `Inference`
# (espnet3.systems.esp2_enh.src.inference): it takes `speech_mix` and returns
# `enhanced`, written as `enhanced.scp` plus one wav per utterance at
# `sample_rate`. Its other arguments are the ones
# `espnet2.bin.enh_inference.SeparateSpeech` takes; `device` is added by the
# provider. The clean reference is not written here: `measure` reads it from
# the dataset's `speech_ref1` column.
model:
  _target_: espnet3.systems.esp2_enh.src.inference.Inference
  # train_config: ${exp_dir}/config.yaml
  # model_file: ${exp_dir}/last.ckpt
  # sample_rate: 16000

input_key: speech_mix

# Checked around the model for infer, publication and demo. Input audio at
# another rate is resampled to 16 kHz, and the first channel of a multichannel
# input is the one enhanced.
contract:
  inputs:
    speech_mix:
      kind: audio
      label: Noisy Speech
      sample_rate: 16000
      channels: 1
      normalize:
        - first_channel
  outputs:
    enhanced:
      kind: audio
      label: Enhanced Speech
      sample_rate: 16000
      channels: 1

provider:
  _target_: espnet3.systems.base.inference_provider.InferenceProvider
runner:
  _target_: espnet3.systems.base.inference_runner.InferenceRunner
