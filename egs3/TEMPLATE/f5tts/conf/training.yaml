##########################################################
#                    TRAINING SETTING                    #
##########################################################
# Quick usage:
#   python run.py --stages train --training_config conf/training.yaml
#
# This is the shared default merged under every F5-TTS recipe's training
# config (see `load_and_merge_config` in `run.py`). Only path/system
# scaffolding lives here; the dataset, model, optimizer and dataloader blocks
# are left null for the recipe config to fill in.

##########################################################
#                  SYSTEM AND PATH SETTING               #
##########################################################
num_device: 1
num_nodes: 1

# F5-TTS is an ESPnet3-native model: `model` is instantiated directly via
# Hydra, so the ESPnet2 `task` bridge stays unset.
task:

recipe_dir: .
data_dir: ${recipe_dir}/data
exp_tag: ${self_name:}
exp_dir: ${recipe_dir}/exp/${exp_tag}
stats_dir: ${exp_dir}/stats
inference_dir: ${exp_dir}/inference

##########################################################
#                 DATASET CREATION SETTING               #
##########################################################
# Arguments of the `create_dataset` stage, passed to the recipe's
# `dataset.DatasetBuilder` (`prepare_source` then `build`). An F5-TTS recipe
# typically sets `recipe_dir: ${recipe_dir}` so the builder writes its
# manifests under the recipe's `data/`. Left empty, the builder is called
# with no arguments.
create_dataset: {}

##########################################################
#                    DATASET DEFINITION                  #
##########################################################
# `_recursive_: false` hands `DataOrganizer` the split entries and the
# `preprocessor` block as configs: it instantiates the preprocessor itself,
# with `train=True` for the training split and `False` for valid/test. Without
# it Hydra would build the preprocessor first, and ESPnet2's
# `CommonPreprocessor` needs that `train` argument.
dataset:
  _target_: espnet3.components.data.data_organizer.DataOrganizer
  _recursive_: false
  recipe_dir: ${recipe_dir}
  train:
  valid:
  test:
  preprocessor:

##########################################################
#                      MODEL SETTING                     #
##########################################################
model:

##########################################################
#            OPTIMIZER & SCHEDULER SETTING               #
##########################################################
# Single optimizer path:
optimizer:
scheduler:
scheduler_interval:
scheduler_monitor:

# Multiple-loss / multiple-optimizer path (e.g. GAN-based TTS):
optimizers:
schedulers:

##########################################################
#                OTHER TRAINING SETTING                  #
##########################################################
best_model_criterion:

# Optional random seed used by collect_stats/train.
seed:

# Extra model initialization mode forwarded to ESPnet's initializer.
init:

##########################################################
#                   PARALLELIZATION SETTING              #
##########################################################
parallel:
  env: local
  n_workers: 1
  # Replace a stale shard lock left by an interrupted run. Do not enable while
  # another run may still be writing to the same output directory.
  allow_overwrite_lock: false

##########################################################
#                   DATALOADER SETTING                   #
##########################################################
dataloader:

##########################################################
#                    TRAINER SETTING                     #
##########################################################
# These settings map to `lightning.Trainer(...)`.
# Lightning `Trainer` arguments, as `egs3/TEMPLATE/esp2_asr` defaults them.
# `log_every_n_steps` is read by espnet3's trainer for its own progress
# logging, so it must be set. A recipe adds `max_steps` or `max_epochs`, its
# callbacks (an F5-TTS recipe trains with `EMACallback`) and anything else.
trainer:
  accelerator: auto
  devices: ${num_device}
  num_nodes: ${num_nodes}
  strategy: auto
  accumulate_grad_batches: 1
  check_val_every_n_epoch: 1
  gradient_clip_val: 1.0
  log_every_n_steps: 100
  logger:
    - _target_: lightning.pytorch.loggers.TensorBoardLogger
      save_dir: ${exp_dir}/tensorboard
      name: tb_logger

##########################################################
#                      FIT SETTING                       #
##########################################################
fit: {}
