##########################################################
#                   Inference SETTING                    #
##########################################################
# Quick usage:
#   python run.py --stages infer --inference_config conf/inference.yaml
#
# Shared default merged under every F5-TTS recipe's inference config.

recipe_dir: .
exp_tag:
exp_dir: ${recipe_dir}/exp/${exp_tag}
data_dir: ${recipe_dir}/data
inference_dir: ${exp_dir}/${self_name:}

dataset:

parallel:
  env: local
  n_workers: 1
  # Replace a stale shard lock left by an interrupted run. Do not enable while
  # another run may still be writing to the same output directory.
  allow_overwrite_lock: false

# The model is the system's `Inference` (espnet3.api.inference): it declares
# what it takes (`text`, `reference_speech`, optional `reference_text`) and
# what it returns (`wav`), so the runner picks those fields out of each test
# item by name and writes `wav.scp` itself. No `input_key`, `output_fn` or
# `output_artifacts` is declared for it; `measure` reads the scoring
# references from the data (`dataset:<column>` in metrics.yaml).
model:

# One utterance per model call (`null`); an `Inference` is always safe here.
batch_size:

provider:
  _target_: espnet3.systems.base.inference_provider.InferenceProvider
runner:
  _target_: espnet3.systems.base.inference_runner.InferenceRunner
