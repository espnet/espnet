##########################################################
#                 METRIC SCORING SETTING                 #
##########################################################
# Quick usage:
#   python run.py --stages measure \
#       --training_config conf/training.yaml \
#       --inference_config conf/inference.yaml \
#       --metrics_config conf/metrics.yaml
#
# Shared default merged under every esp2_gan_tts recipe's metrics config.
# Scores the `infer` stage output (`${inference_dir}/<test>/wav.scp`) with
# versa (https://github.com/wavlab-speech/versa), which must be installed in
# the evaluation environment: pseudo-MOS (UTMOS, DNSMOS), Whisper WER/CER
# against the transcript, and speaker similarity against the ground-truth
# recording. The two references are columns of the test set itself
# (`dataset:<column>`): `wav_path`, the original utterance, and `raw_text`,
# its transcript; `infer` writes only what the model produced.
#
# `--inference_config` is required: the test set definition is read from it
# to materialize those columns.

recipe_dir: .
exp_tag:
exp_dir: ${recipe_dir}/exp/${exp_tag}

##########################################################
#                   TEST SETS TO SCORE                   #
##########################################################
dataset:
  test:
    - name: valid
    - name: test

##########################################################
#                VERSA METRIC DEFINITION                 #
##########################################################
metrics:
  - metric:
      _target_: espnet3.systems.esp2_gan_tts.metrics.versa.VersaMetric
      score_config:
        - name: pseudo_mos
          predictor_types: [utmos, dnsmos]
          predictor_args:
            utmos:
              fs: 16000
            dnsmos:
              fs: 16000
        - name: whisper_wer
          model_tag: default
          beam_size: 1
        - name: speaker
          model_tag: espnet/voxcelebs12_ecapa_wavlm_joint
      # The scores the configuration above promises; `measure` fails if versa
      # drops one (a metric whose dependency is missing is disabled without
      # failing the run). `whisper_wer` / `whisper_cer` are the corpus-level
      # rates VersaMetric pools from the edit counts; every other versa key is
      # returned as well.
      outputs:
        - whisper_wer
        - whisper_cer
        - spk_similarity
        - utmos
        - dns_overall
        - dns_p808
      wav_key: wav
      ref_key: ref
      text_key: text
      use_gpu: true
    inputs:
      wav: wav                 # the model's output -> <test_name>/wav.scp
      ref: dataset:wav_path    # the ground-truth recording, a column of the test set
      text: dataset:raw_text   # its transcript, another column
