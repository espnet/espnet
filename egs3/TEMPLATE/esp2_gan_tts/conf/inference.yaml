##########################################################
#                   INFERENCE SETTING                    #
##########################################################
# Quick usage:
#   python run.py --stages infer \
#       --training_config conf/training.yaml \
#       --inference_config conf/inference.yaml
#
# Shared default merged under every esp2_gan_tts recipe's inference config.
# The dataset block mirrors the training template: the filtered manifests
# and x-vector directories written by the preparation stages, plus the same
# text preprocessor. `inference: true` makes the recipe dataset also return
# `utt_id` / `wav_path` / `raw_text` for the measure stage.

recipe_dir: .
exp_tag:
exp_dir: ${recipe_dir}/exp/${exp_tag}
data_dir: ${recipe_dir}/data
inference_dir: ${exp_dir}/${self_name:}

##########################################################
#               SPEAKER EMBEDDING SETTING                #
##########################################################
# Must match the `xvector` block of the training config.
xvector:
  spk_embed_tag: voxcelebs12_rawnet3
  save_path: ${data_dir}/x_vectors

##########################################################
#                   DATASET DEFINITION                   #
##########################################################
dataset:
  _target_: espnet3.components.data.data_organizer.DataOrganizer
  _recursive_: false
  recipe_dir: ${recipe_dir}
  test:
    - name: valid
      data_src_args:
        split: valid
        manifest_path: ${data_dir}/manifests_filtered/valid.tsv
        xvector_dir: ${xvector.save_path}/${xvector.spk_embed_tag}_valid
        load_speech: true
        inference: true
    - name: test
      data_src_args:
        split: test
        manifest_path: ${data_dir}/manifests_filtered/test.tsv
        xvector_dir: ${xvector.save_path}/${xvector.spk_embed_tag}_test
        load_speech: true
        inference: true
  preprocessor:
    _target_: espnet2.train.preprocessor.CommonPreprocessor
    fs: 22050
    token_type: phn
    token_list: ${data_dir}/tokens/tokens.txt
    text_cleaner:
      - tacotron
    g2p_type: espeak_ng_english_us_vits

##########################################################
#                   PARALLELIZATION SETTING              #
##########################################################
parallel:
  env: local
  n_workers: 1

##########################################################
#                     MODEL SETTING                      #
##########################################################
# espnet2's Text2Speech rebuilt from the espnet2-style config that `train`
# writes to `${exp_dir}/config.yaml`.
model:
  _target_: espnet2.bin.tts_inference.Text2Speech
  train_config: ${exp_dir}/config.yaml
  model_file: ${exp_dir}/last.ckpt

##########################################################
#                 INPUT / OUTPUT SETTING                 #
##########################################################
# A multi-speaker model takes `spembs` next to `text`; drop it for a
# single-speaker recipe.
input_key: [text, spembs]
batch_size:
output_fn:
output_artifacts:

provider:
  _target_: espnet3.systems.base.inference_provider.InferenceProvider
runner:
  _target_: espnet3.systems.base.inference_runner.InferenceRunner
