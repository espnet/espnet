##########################################################
#                      DEMO SETTING                      #
##########################################################
# Quick usage:
#   python run.py --stages pack_demo \
#       --training_config conf/training.yaml --demo_config conf/demo.yaml
#   python run.py --stages upload_demo \
#       --training_config conf/training.yaml --demo_config conf/demo.yaml
#
# Shared default merged under every esp2_gan_tts recipe's demo config. Pass
# `--training_config` too: `launch()` copies its `exp_tag` here, which
# `model.dir_or_tag` and `upload_demo.hf_repo` are built from. `pack_model`
# must already have written the bundle `model.dir_or_tag` points at.

recipe_dir: .

##########################################################
#                     MODEL SOURCE                       #
##########################################################
# `model.dir_or_tag` is the packed model the demo loads: a local bundle
# (resolved relative to the packed demo directory at runtime) or a Hugging
# Face model tag, loaded through `espnet3.publication.InferenceModel`. The
# packed inference config names only installed espnet code and declares its
# contract inline, so the bundle's own files are never imported and
# `trust_user_code` stays false.
model:
  dir_or_tag: exp/${exp_tag}/model_pack
  trust_user_code: false

##########################################################
#               SPEAKER EMBEDDING SETTING                #
##########################################################
# The model is conditioned on a speaker embedding (`spembs` in the inference
# contract), which no browser widget can produce. `src/app.py` therefore
# takes a reference recording instead and runs the same extractor as the
# `compute_xvectors` stage on it. Keep `toolkit` / `pretrained_model` equal
# to the `xvector` block of the training config, or the embedding the demo
# builds does not match the space the model was trained in.
xvector:
  toolkit: espnet
  pretrained_model: espnet/voxcelebs12_rawnet3
  device: cpu

##########################################################
#                     UI DEFINITION                      #
##########################################################
# `ui.app_script` is the launcher `pack_demo` copies into the packed demo as
# `app.py`: the template's, which turns the reference recording into the
# embedding the model takes. `ui.description` is a markdown/text file
# `pack_demo` copies into the bundle, or inline text.
#
# `ui.inputs` is set explicitly because the widgets differ from the model's
# inputs: the page shows a text box and an audio widget, and the launcher
# maps them onto the contract's `text` and `spembs`. The output widgets come
# from the packed inference contract (the synthesized speech).
ui:
  app_script: ${config_path:../src/app.py}
  title: ${set_corpus_and_system:} demo
  description: README.md
  inputs:
    - key: text
      type: text
      label: Text to synthesize
    - key: reference_speech
      type: audio
      label: Reference recording (voice to clone)

##########################################################
#                    PACKING SETTING                     #
##########################################################
# `pack.out_dir` is the packed demo directory, relative to the recipe
# directory; `pack.include` / `pack.exclude` copy extra files into it.
# `pack.requirements` is written to the demo's requirements.txt: the `train`
# extra brings in Hydra, which builds the model from the packed configs; the
# `tts` extra brings in the g2p dependencies of the text preprocessing. A
# recipe whose `xvector.toolkit` is `speechbrain` adds that package.
# `pack.readme` renders the Space README from `readme_context`.
pack:
  out_dir: demo
  include: []
  exclude: []
  requirements:
    - "espnet[train,tts] @ git+https://github.com/espnet/espnet.git"
  readme: ${config_path:../src/hf_demo_readme.md}
  readme_context:
    title: ${ui.title}
    emoji: "\U0001f5e3️"
    color_from: blue
    color_to: green
    sdk: gradio
    app_file: app.py
    pinned: "false"
    license: apache-2.0
    tags: |-
      - espnet
      - espnet3
      - gradio
      - text-to-speech
      - tts
    hf_repo: ${upload_demo.hf_repo}
    model_ref: ${model.dir_or_tag}

##########################################################
#                    UPLOAD SETTING                      #
##########################################################
# `update: false` refuses to overwrite an existing Space; `delete_patterns`
# applies only when `update: true` (`["*"]` replaces, `[]` adds).
upload_demo:
  hf_repo: espnet/${set_corpus_and_system:}_${exp_tag}
  update: false
  delete_patterns:
    - "*"
