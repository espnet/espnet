##########################################################
#               TOKENIZER TRAINING SETTING               #
##########################################################
# BEATs VQ tokenizer training (knowledge distillation from the iteration N-1
# encoder) for iterations N > 0.
#
# Quick usage (iteration 1):
#   python run.py --stages train_tokenizer \
#       --training_config conf/training_iter1.yaml \
#       --train_tokenizer_config conf/training_tokenizer.yaml
#
# Used only by the `train_tokenizer` stage. run.py overwrites `iteration`,
# `teacher_ckpt_path`, `ssl_tag`, `fbank_mean`, `fbank_std`, `waveform_input`,
# `num_device`, `num_nodes`, and the data/stats paths with the values of
# `--training_config`, so set those there.

##########################################################
#                  SYSTEM AND PATH SETTING               #
##########################################################
num_device: 1
num_nodes: 1

task: espnet2.tasks.beats.BeatsTokenizerTask

iteration: 1
teacher_ckpt_path:

recipe_dir: .
data_dir: ${recipe_dir}/data
ssl_tag: base
exp_tag: beats_tokenizer_iter${iteration}_${ssl_tag}
exp_dir: ${recipe_dir}/exp/${exp_tag}
stats_dir: ${recipe_dir}/exp/stats_${ssl_tag}
dataset_dir: ${data_dir}

fbank_mean: 15.29130
fbank_std: 5.90532
waveform_input: true

# The teacher encoder only produces regression targets.
freeze_param:
  - teacher

##########################################################
#                    DATASET DEFINITION                  #
##########################################################
# Recipes fill `train` and `valid` with entries that produce `speech` only
# (no `target_path`).
dataset:
  _target_: espnet3.components.data.data_organizer.DataOrganizer
  _recursive_: false
  recipe_dir: ${recipe_dir}
  train:
  valid:
  test:
  preprocessor:

##########################################################
#                      MODEL SETTING                     #
##########################################################
# Passed to `espnet2.tasks.beats.BeatsTokenizerTask.build_model`.
model:
  beats_teacher_ckpt_path: ${teacher_ckpt_path}
  encoder_conf:
    fbank_mean: ${fbank_mean}
    fbank_std: ${fbank_std}
    tokenizer_config:
      embed_loss_beta: 10.0
      layer_wise_gradient_decay_ratio: 1.0
      encoder_layerdrop: 0.0
      dropout: 0.1
      codebook_vocab_size: 1024
      decoder_layers: 3
      deep_norm: true
      use_flash_attn: false
      relative_position_embedding: true
      num_buckets: 320
      max_distance: 800
      gru_rel_pos: true
  model_conf:
    waveform_input: ${waveform_input}

##########################################################
#            OPTIMIZER & SCHEDULER SETTING               #
##########################################################
# Equivalent of egs2 `conf/ds_beats_tok.json`: AdamW, linear warmup from 1e-6
# to 5e-5 over 32k steps, then linear decay back to 1e-6 at 400k steps (held afterwards).
optimizer:
  _target_: torch.optim.AdamW
  lr: 5.0e-5
  betas: [0.9, 0.98]
  eps: 1.0e-12
  weight_decay: 0.01

scheduler:
  _target_: espnet2.schedulers.piecewise_linear_warmup_lr.PiecewiseLinearWarmupLR
  # The last point holds the final LR after 400K steps, like DeepSpeed's
  # WarmupDecayLR. Without it, PiecewiseLinearWarmupLR switches to an
  # inverse-sqrt decay from the base LR and the LR jumps ~50x.
  warmup_steps_list: [0, 32000, 400000, 1000000000]
  warmup_lr_list: [1.0e-6, 5.0e-5, 1.0e-6, 1.0e-6]

scheduler_interval: step
scheduler_monitor:

##########################################################
#                OTHER TRAINING SETTING                  #
##########################################################
# The averaged checkpoint of these models is exported as
# `${exp_dir}/beats_tokenizer_iter<N>.pt`.
best_model_criterion:
  - - valid/loss
    - 1
    - min

seed: 0

##########################################################
#                   PARALLELIZATION SETTING              #
##########################################################
parallel:
  env: local
  n_workers: 1

##########################################################
#                   DATALOADER SETTING                   #
##########################################################
dataloader:
  collate_fn:
    _target_: espnet2.train.collate_fn.CommonCollateFn
    float_pad_value: 0.0
    int_pad_value: -1
  train:
    iter_factory:
      _target_: espnet2.iterators.sequence_iter_factory.SequenceIterFactory
      shuffle: true
      num_workers: 4
      collate_fn: ${dataloader.collate_fn}
      batches:
        type: length
        shape_files:
          - ${stats_dir}/train/feats_shape
        batch_size: 1
        # Per device (egs2 `batch_bins` divided by the number of GPUs).
        batch_bins: 35000
  valid:
    iter_factory:
      _target_: espnet2.iterators.sequence_iter_factory.SequenceIterFactory
      shuffle: false
      num_workers: ${dataloader.train.iter_factory.num_workers}
      collate_fn: ${dataloader.collate_fn}
      batches:
        type: length
        shape_files:
          - ${stats_dir}/valid/feats_shape
        batch_size: 1
        batch_bins: ${dataloader.train.iter_factory.batches.batch_bins}

##########################################################
#                    TRAINER SETTING                     #
##########################################################
trainer:
  accelerator: auto
  devices: ${num_device}
  num_nodes: ${num_nodes}
  precision: bf16-mixed
  accumulate_grad_batches: 1
  check_val_every_n_epoch: 1
  gradient_clip_val: 1.0
  log_every_n_steps: 1000
  max_epochs: 14

  logger:
    - _target_: lightning.pytorch.loggers.TensorBoardLogger
      save_dir: ${exp_dir}/tensorboard
      name: tb_logger

  strategy: auto

##########################################################
#                      FIT SETTING                       #
##########################################################
fit: {}
