builder:
  # Where the prepared manifests are written, relative to the recipe root.
  data_path: data
  # Where the trial protocol is downloaded to, relative to the recipe root.
  download_path: download
  source_env_var: VOXCELEB
  musan_env_var: MUSAN
  rir_env_var: RIRS_NOISES

  # VoxCeleb2 ships as AAC in `.m4a` containers, which soundfile cannot read.
  # `build()` decodes anything with one of these extensions into WAV under
  # `convert_path`, and the manifests point at the converted files. VoxCeleb1
  # is already WAV and is left where it is.
  convert_path: data/converted
  # Empty on this cluster: the VoxCeleb2 copy under $VOXCELEB is already 16 kHz
  # WAV, so there is nothing to decode. This is not cosmetic -- `scan_split`
  # runs one full `rglob` per suffix, so leaving `.m4a` and `.aac` here walks
  # all ~178k VoxCeleb2 directories twice more to match nothing, tripling a
  # scan that is pure Lustre metadata I/O. Restore the two entries for a stock
  # VoxCeleb2 tree, where the audio really is AAC.
  convert_suffixes: []
  # Must match `dataset.sample_rate` below; the dataset rejects anything else.
  sample_rate: 16000
  channels: 1

  # Dask cluster used to decode in parallel. ffmpeg is the bottleneck, so one
  # worker per core is the right shape. Override from a training config with
  # `create_dataset.n_workers`, or point `env` at a job scheduler for a cluster.
  parallel:
    env: local
    n_workers: 8

  # Audio directories inside the VoxCeleb root, relative to it.
  sources:
    voxceleb1_dev: voxceleb1/dev
    voxceleb1_test: voxceleb1/test
    voxceleb2_dev: voxceleb2/dev

  # Speaker label spaces. Training merges splits through `CombinedDataset`, by
  # listing them under `dataset.train` in the training config, so there is no
  # need to concatenate manifests on disk. `SpkPreprocessor` does still need one
  # `spk2utt` spanning every training split, because that file defines the
  # speaker -> class index mapping and its line count is `model.spk_num`. Each
  # union below therefore gets a directory holding only that `spk2utt`.
  speaker_unions:
    voxceleb12_dev:
      - voxceleb1_dev
      - voxceleb2_dev

  # Trial protocols, keyed by the name recipes pass as `trials`.
  trials:
    vox1_o:
      split: voxceleb1_test
      file_name: veri_test2.txt
      url: https://www.robots.ox.ac.uk/~vgg/data/voxceleb/meta/veri_test2.txt

  # RIR rooms used for augmentation. Large rooms are left out, following
  # Kaldi and voxceleb_trainer.
  rir_rooms:
    - simulated_rirs/smallroom
    - simulated_rirs/mediumroom
  musan_categories:
    - speech
    - noise
    - music

dataset:
  data_path: data
  sample_rate: 16000
  # `voxceleb12_dev` is deliberately absent: it is a label space, not a split.
  # Train on both development sets by listing them under `dataset.train`.
  supported_splits:
    - voxceleb1_dev
    - voxceleb1_test
    - voxceleb2_dev
