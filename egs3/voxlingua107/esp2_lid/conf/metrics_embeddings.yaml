# LID metrics embeddings settings.
inference_dir: ${exp_dir}/inference_embeddings
metrics:
  - metric:
      _target_: espnet3.systems.esp2_lid.metrics.accuracy.Accuracy
  - metric:
      _target_: espnet3.systems.esp2_lid.metrics.embedding.Embedding
      max_utt_per_lang: 100
      save_tsne_plot: true
    inputs:
      ref: ref
      embedding: embedding
  - metric:
      _target_: espnet3.systems.esp2_lid.metrics.classification_report.ClassificationReport
