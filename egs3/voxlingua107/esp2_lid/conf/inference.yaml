##########################################################
#                   INFERENCE SETTING                    #
##########################################################
# Common usage:
#   python run.py --stages infer \
#       --training_config conf/training.yaml \
#       --inference_config conf/inference.yaml

##########################################################
#                    DATASET DEFINITION                  #
##########################################################
dataset:
  test:
    - name: dev
      data_src_args:
        split: dev
        data_dir: ${data_dir}/voxlingua107
        sample_rate: 16000

##########################################################
#                    MODEL AND OUTPUT                    #
##########################################################
# Writes `<test_name>/language.scp`, the predicted ISO 639-3 codes.
model:
  lid_train_config: ${exp_dir}/config.yaml
  lid_model_file: ${exp_dir}/valid.accuracy.best.pth
  lang2utt: ${stats_dir}/train/lang2utt
  dtype: float32
