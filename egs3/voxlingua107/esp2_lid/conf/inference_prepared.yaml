# LID inference prepared settings.
dataset_dir: ${oc.env:VOXLINGUA107,/path/to/voxlingua107}
dataset:
  test:
    - name: ${prepared_name}
      data_src: egs3.voxlingua107.esp2_lid.src.prepared_dataset
      data_src_args:
        manifest: ${prepared_manifest}
        lang2utt: ${stats_dir}/train/lang2utt
model:
  _target_: espnet3.systems.esp2_lid.inference.Speech2Language
  lid_train_config: ${exp_dir}/config.yaml
  lid_model_file: ${exp_dir}/valid.accuracy.best.pth
  lang2utt: ${stats_dir}/train/lang2utt
  dtype: float32
input_key: speech
output_keys:
  - hyp
  - ref
idx_key: utt_id
batch_size: 4
output_fn: src.inference.build_output
prepared_name: fleurs_test
prepared_manifest: ${recipe_dir}/data/fleurs/test/manifest.tsv
