##########################################################
#                   INFERENCE SETTING                    #
##########################################################
# Decoding for the two-pass SLU models, the counterpart of stage 12 of
# `egs2/TEMPLATE/slu1/slu.sh`. `conf/inference.yaml` cannot do this job: it
# builds `espnet2.bin.asr_inference.Speech2Text`, which takes speech only, so
# the BERT post-decoder would never see a transcript.
#
# UNVERIFIED. No SLU model has been decoded with this file yet, and one piece
# is known to be missing: `InferenceRunner.forward` passes dataset fields to
# the model untouched, while `Speech2Understand.__call__` wants `transcript` as
# a tensor of token ids -- `transcript.unsqueeze(0)` in
# `espnet2/bin/slu_inference.py`. `SlurpDataset` yields it as a string, which
# training tokenizes through `SLUPreprocessor` but inference does not. So
# running this config as it stands will fail on the transcript field. Closing
# that gap needs either a preprocessor on the inference dataset or a thin
# wrapper in `src/` that tokenizes `transcript` before the call; it is left out
# deliberately rather than guessed at.
#
# What the file does fix is the shape of the stage: which class to build, which
# checkpoint to read, which fields to feed it, and the decoding parameters to
# match egs2. Run it as:
#
#   python run.py --stages infer,measure \
#       --training_config conf/tuning/train_slu_bert_conformer_deliberation.yaml \
#       --inference_config conf/inference_slu.yaml \
#       --metrics_config conf/metrics.yaml
#
# Only values that differ from `egs3/TEMPLATE/asr/conf/inference.yaml` appear
# here.

# One shard per worker on a single node. Size it against memory: each worker
# builds its own copy of the model, BERT included.
parallel:
  n_workers: 16

##########################################################
#                    DATASET DEFINITION                  #
##########################################################
# `test` first, then `devel`, as in `test_sets="test devel"` in
# `egs2/slurp/slu1/run.sh`. Both need `with_transcript`, and the
# ASR-transcript model additionally needs `transcript_source` set to the same
# directory its training config names, so that decoding reads the same kind of
# transcript it was trained on.
dataset:
  test:
    - name: test
      data_src_args:
        split: test
        with_transcript: true
    - name: devel
      data_src_args:
        split: devel
        with_transcript: true

##########################################################
#                     MODEL SETTING                      #
##########################################################
# `beam_size` and `ctc_weight` are the defaults of
# `espnet2.bin.slu_inference`, which is what egs2 decodes with: its `run.sh`
# passes no `--inference_config`, so `conf/decode_asr.yaml` is never read.
model:
  _target_: espnet2.bin.slu_inference.Speech2Understand
  slu_train_config: ${exp_dir}/config.yaml
  slu_model_file: ${exp_dir}/valid.acc.ave_10best.pth
  beam_size: 20
  ctc_weight: 0.5

# Both fields are forwarded as keyword arguments, matching
# `Speech2Understand.__call__(speech, transcript)`.
input_key:
  - speech
  - transcript

output_fn: src.inference.build_output
output_keys:
  - hyp
  - ref
  - hyp_intent
  - ref_intent
  - hyp_transcript
  - ref_transcript
