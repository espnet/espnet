##########################################################
#                   Inference SETTING                    #
##########################################################
# First-pass transcript dump: runs the trained one-pass ASR model over every
# split so the two-pass SLU config can train on ASR hypotheses instead of the
# corpus transcript. This is the `--gt false` branch of
# `egs2/slurp/slu1/local/data.sh`, which reads the same hypotheses from a
# first-pass `hyp.trn`.
#
# Quick usage:
#   python run.py --stages infer \
#       --training_config conf/tuning/training_conformer.yaml \
#       --inference_config conf/inference_transcripts.yaml
#
# Output: ${exp_dir}/inference_transcripts/<split>/hyp_transcript.scp, which
# `train_slu_bert_conformer_deliberation_asr.yaml` points `transcript_source` at.
#
# The training splits dominate the cost: 141,648 utterances in total against
# 21,768 for the evaluation splits alone. Beam and CTC weight match
# `conf/inference.yaml` so the transcripts the model trains on carry the same
# error profile as the ones it will see at test time.

parallel:
  n_workers: 16

dataset:
  test:
    - name: train
      data_src_args:
        split: train
    - name: train_synthetic
      data_src_args:
        split: train_synthetic
    - name: devel
      data_src_args:
        split: devel
    - name: test
      data_src_args:
        split: test

model:
  _target_: espnet2.bin.asr_inference.Speech2Text
  asr_train_config: ${exp_dir}/config.yaml
  asr_model_file: ${exp_dir}/valid.acc.ave_10best.pth
  beam_size: 20
  ctc_weight: 0.5

output_fn: src.inference.build_output
output_keys:
  - hyp
  - hyp_transcript
