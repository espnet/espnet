##########################################################
#                   INFERENCE SETTING                    #
##########################################################
# Decoding for the deliberation model trained on first-pass ASR hypotheses,
# the `conf/inference_slu.yaml` counterpart for that variant. It differs in one
# respect: the transcript comes from the first pass, not from the corpus.
# Decoding this model against the reference instead would hand it clean text it
# never saw in training and report a number no deployment can reproduce.
#
# Prerequisite: `conf/inference_transcripts.yaml` must have been run, so that
# `hyp_transcript.scp` exists for `test` and `devel`.
#
#   python run.py --stages infer,measure \
#       --training_config conf/tuning/train_slu_bert_conformer_deliberation_asr.yaml \
#       --inference_config conf/inference_slu_asr.yaml \
#       --metrics_config conf/metrics.yaml
#
# Only values that differ from `egs3/TEMPLATE/asr/conf/inference.yaml` appear
# here. `parallel.n_workers` is left at the TEMPLATE default of 1, so the stage
# runs in the calling process; raise it locally to shard across cores, and size
# it against memory, since each worker builds its own copy of the model, BERT
# included.

##########################################################
#                    DATASET DEFINITION                  #
##########################################################
# `test` first, then `devel`, as in `test_sets="test devel"` in
# `egs2/slurp/slu1/run.sh`. `transcript_source` points at the first-pass dump,
# the same directory the training config reads, so the model meets the kind of
# recognition errors it was trained on.
dataset:
  test:
    - name: test
      data_src_args:
        split: test
        with_transcript: true
        transcript_source: ${recipe_dir}/exp/training_conformer/inference_transcripts
    - name: devel
      data_src_args:
        split: devel
        with_transcript: true
        transcript_source: ${recipe_dir}/exp/training_conformer/inference_transcripts

##########################################################
#                     MODEL SETTING                      #
##########################################################
# `espnet3.systems.esp2_slu.inference.SLUInference` wraps `Speech2Understand` and tokenizes the
# transcript, which the `infer` stage would otherwise pass through as a string.
# `transcript_token_list` must be the file the training config names, or every
# id shifts.
#
# `beam_size` and `ctc_weight` are the defaults of
# `espnet2.bin.slu_inference`, which is what egs2 decodes with: its `run.sh`
# passes no `--inference_config`, so `conf/decode_asr.yaml` is never read.
model:
  _target_: espnet3.systems.esp2_slu.inference.SLUInference
  slu_train_config: ${exp_dir}/config.yaml
  slu_model_file: ${exp_dir}/valid.acc.ave_10best.pth
  transcript_token_list: ${data_dir}/manifest/transcript_tokens_asr.txt
  beam_size: 20
  ctc_weight: 0.5

# Both fields are forwarded as keyword arguments, matching
# `SLUInference.__call__(speech, transcript)`.
input_key:
  - speech
  - transcript

output_fn: src.inference.build_output
output_keys:
  - hyp
  - ref
  - hyp_intent
  - ref_intent
  - hyp_transcript
  - ref_transcript
