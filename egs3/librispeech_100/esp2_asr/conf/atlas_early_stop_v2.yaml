atlas:
  study_name: ls100_early_stop_v2
  study_dir: exp/atlas/ls100_early_stop_v2
  graph:
  application: hyperparameter_search
  objective_file: program.md

  task: ASR
  dataset: LibriSpeech 100h
  model: e_branchformer
  year: 2026

  recipe:
    training_config: conf/tuning/training_e_branchformer.yaml
    inference_config: conf/inference.yaml
    metrics_config: conf/metrics.yaml

  metric:
    name: dev_clean_wer
    mode: min
    extraction:
      - path: "inference/metrics.json"
        name: dev_clean_wer
        key: "espnet3.systems.esp2_asr.metrics.wer.WER.dev-clean.WER"
      - path: "exp/score_wer/result.txt"
        name: dev_clean_wer
        pattern: "WER: {value}"

  budget:
    max_trials: 200
    max_parallel_trials: 4
    max_wallclock_hours: 24
    max_gpu_hours: 96

  submission:
    resources:
      cpus: 16
      time: "12:00:00"

  early_stopping:
    enabled: true

  trial:
    timeout_sec: 50000

  search_space:
    allowed_keys:
      - trainer.*
      - optimizer.*
      - scheduler.*
      - model.specaug
      - model.specaug_conf.*
      - dataset.preprocessor.*
      - tokenizer.*
    denied_keys:
      - data.*
      - output_dir
      - collect_stats_dir
      - recipe_dir
      - exp_dir
      - stats_dir
      - inference_dir
