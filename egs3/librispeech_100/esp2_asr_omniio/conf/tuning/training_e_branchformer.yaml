##########################################################
#                    TRAINING SETTING                    #
##########################################################
# Quick usage:
#   python run.py --stages create_dataset --training_config conf/training.yaml
#   python run.py --stages train          --training_config conf/training.yaml
#
# Reference training environment:
# - Number of GPUs: 2
# - GPU type: NVIDIA A40 (44 GB)
# - Training time: approximately 9 h 40 min for 200 epochs
#
# Note:
# This base configuration inherits `num_device: 1` from the TEMPLATE config;
# it is configured for single-GPU training with gradient accumulation of 4.
# The reference run used 2 GPUs with gradient accumulation of 2. To reduce
# gradient accumulation while keeping the effective batch size comparable,
# increase `batch_bins` by the same factor when GPU memory permits. For example,
# halve `accumulate_grad_batches` and double `batch_bins`.

##########################################################
#                  SYSTEM AND PATH SETTING               #
##########################################################
# `recipe_dir`, `data_dir`, `exp_tag`, `exp_dir`, and `stats_dir` are inherited
# from the TEMPLATE config. In particular, `exp_tag` follows `${self_name:}`.
task: espnet3.systems.esp2_asr.task.ASRTask

##########################################################
#                    DATASET DEFINITION                  #
##########################################################
# This recipe uses `${recipe_dir}/dataset/__init__.py` in the same way as
# `mini_an4`, so `data_src` is omitted and only `data_src_args` is forwarded.
#
# Each entry selects its rows with a DuckDB query over the omniio dump that
# `create_dataset` writes:
#   <dump_root>/audio/librispeech/<split>/metadata.parquet  (speech)
#   <dump_root>/text/librispeech/<split>/metadata.parquet   (text)
# The query returns one row per utterance with
#   id                                  item ID
#   <field>_path/_start/_size           byte range of `speech` / `text`
#                                       in an omniio blob (or an inline
#                                       `<field>` column)
#   length                              size used for batching
# `{name}` placeholders are filled from `params`; `{dump_root}` is
# $OMNIIO_DUMP_ROOT, else ${recipe_dir}/dump/omniio. An entry without `query`
# uses `default_query` from dataset/config.yaml with `params.split`.
#
# The training rows are split into `total_shards` shards by hash(id); each GPU
# runs the query for its own shard only, so no rank holds the full index.
dataset:
  train:
    - data_src_args:
        query: |
          SELECT a.id,
                 a.path AS speech_path, a.start_byte AS speech_start,
                 a.end_byte - a.start_byte AS speech_size,
                 -- frontend output size: frames (160-sample hop) x 80 mels
                 (a.samples // 160 + 1) * 80 AS length,
                 t.path AS text_path, t.start_byte AS text_start,
                 t.end_byte - t.start_byte AS text_size
          FROM read_parquet('{dump_root}/audio/librispeech/train-clean-100/metadata.parquet') AS a
          JOIN read_parquet('{dump_root}/text/librispeech/train-clean-100/metadata.parquet') AS t
            USING (id)
          -- Filter on the fly with any metadata column, e.g.:
          -- WHERE a.samples / a.sample_rate BETWEEN 0.5 AND 20
          ORDER BY a.id
        total_shards: ${dataloader.train.total_shards}
        dist_world_size: ${dataloader.train.dist_world_size}
  valid:
    - data_src_args:
        params:
          split: dev-clean
    - data_src_args:
        params:
          split: dev-other
  preprocessor:
    _target_: espnet2.train.preprocessor.CommonPreprocessor
    train: true
    token_type: bpe
    token_list: ${tokenizer.save_path}/tokens.txt
    bpemodel: ${tokenizer.save_path}/bpe.model
    text_cleaner:
    fs: 16000
    data_aug_prob: 0.667
    data_aug_effects:
      - [0.5, "speed_perturb", {"factor": 0.9}]
      - [0.5, "speed_perturb", {"factor": 1.1}]

# 1) Raw LibriSpeech is looked up under <corpora_root>/librispeech/LibriSpeech
#    ($CORPORA_ROOT, else ${recipe_dir}/download); only missing splits are
#    downloaded from OpenSLR.
# 2) Each split is dumped with omniio's Blob.append to <dump_root>.
# Uncomment to override the environment variables / defaults.
create_dataset:
  recipe_dir: ${recipe_dir}
  # corpora_root: /path/to/corpora
  # dump_root: /path/to/omniio_dump
  # num_workers: 8      # Blob.append worker processes
  # keep_archive: false # keep the downloaded .tar.gz files

##########################################################
#                   TOKENIZER SETTING                    #
##########################################################
tokenizer:
  vocab_size: 5000
  character_coverage: 1.0
  model_type: bpe
  save_path: ${data_dir}/${tokenizer.model_type}_${tokenizer.vocab_size}
  text_builder:
    func: src.tokenizer.gather_training_text
    recipe_dir: ${recipe_dir}
    split: train-clean-100

##########################################################
#                      MODEL SETTING                     #
##########################################################
model:
  vocab_size: ${tokenizer.vocab_size}
  token_list: ${tokenizer.save_path}/tokens.txt

  encoder: e_branchformer
  encoder_conf:
    output_size: 256
    attention_heads: 4
    attention_layer_type: rel_selfattn
    pos_enc_layer_type: rel_pos
    rel_pos_type: latest
    cgmlp_linear_units: 1024
    cgmlp_conv_kernel: 31
    use_linear_after_conv: false
    gate_activation: identity
    num_blocks: 12
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.1
    input_layer: conv2d
    layer_drop_rate: 0.0
    linear_units: 1024
    positionwise_layer_type: linear
    use_ffn: true
    macaron_ffn: true
    merge_conv_kernel: 31

  decoder: transformer
  decoder_conf:
    attention_heads: 4
    linear_units: 2048
    num_blocks: 6
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    self_attention_dropout_rate: 0.1
    src_attention_dropout_rate: 0.1
    layer_drop_rate: 0.0

  normalize: global_mvn
  normalize_conf:
    stats_file: ${stats_dir}/train/feats_stats.npz

  model_conf:
    ctc_weight: 0.3
    lsm_weight: 0.1
    length_normalized_loss: false

  frontend: default
  frontend_conf:
    n_fft: 512
    win_length: 400
    hop_length: 160

  specaug: specaug
  specaug_conf:
    apply_time_warp: true
    time_warp_window: 5
    time_warp_mode: bicubic
    apply_freq_mask: true
    freq_mask_width_range: [0, 27]
    num_freq_mask: 2
    apply_time_mask: true
    time_mask_width_ratio_range: [0.0, 0.05]
    num_time_mask: 5

##########################################################
#            OPTIMIZER & SCHEDULER SETTING               #
##########################################################
optimizer:
  _target_: torch.optim.Adam
  lr: 0.002
  weight_decay: 0.000001

scheduler:
  _target_: espnet2.schedulers.warmup_lr.WarmupLR
  warmup_steps: 15000

##########################################################
#                OTHER TRAINING SETTING                  #
##########################################################
best_model_criterion:
  - - valid/acc
    - 10
    - max

# Apply the train preprocessor's random augmentation (data_aug_effects, speed
# perturbation, ...) while collecting statistics. Off by default, as in
# ESPnet2: the statistics and shape files are then the same on every run and
# match the unaugmented input seen at inference. Training augments either way.
collect_stats_train_mode: false

##########################################################
#                   DATALOADER SETTING                   #
##########################################################
parallel:
  env: local
  n_workers: 1

dataloader:
  train:
    # One index shard per GPU (see DATASET DEFINITION). Both must equal the
    # total number of GPUs: set them to num_device * num_nodes for multi-node.
    total_shards: ${num_device}
    dist_world_size: ${num_device}
    iter_factory:
      num_workers: 4
      batches:
        type: numel
        # Batch by the query's `length` column, over this rank's shard only,
        # instead of collect_stats shape files over the whole training set.
        lengths_from_dataset: true
        shape_files: []
        batch_size: 16
        # For reproducibility, 3.8M corresponds to egs2's 16M setting
        # (about 475 s of audio per minibatch). With gradient accumulation of
        # 4, this yields about 1,900 s of audio per optimizer update.
        batch_bins: 3800000
  valid:
    iter_factory:
      batches:
        lengths_from_dataset: true
        shape_files: []

##########################################################
#                    TRAINER SETTING                     #
##########################################################
trainer:
  accumulate_grad_batches: 4
  check_val_every_n_epoch: 1
  gradient_clip_val: 5.0
  log_every_n_steps: 100
  max_epochs: 200
  precision: bf16-mixed

  logger:
    - _target_: lightning.pytorch.loggers.TensorBoardLogger
      save_dir: ${exp_dir}/tensorboard
      name: tb_logger
