##########################################################
#           PUBLICATION SETTING (kNN-VC vocoder)         #
##########################################################
#   python run.py --stages pack_model \
#       --training_config conf/training.yaml \
#       --publication_config conf/publication.yaml
#
# Only overrides of `egs3/TEMPLATE/knnvc/conf/publication.yaml` live here.
# The bundle must carry the recipe's dataset module (the packed model is
# validated from outside the recipe tree) and the prematched-feature settings
# are recorded through the bundled training config.

pack_model:
  include:
    - ${recipe_dir}/dataset
    - ${recipe_dir}/src
  exclude:
    # The prematched WavLM features are regenerated by `prepare_features`;
    # they are far too large to publish (~36 GB for train-clean-100).
    - wavlm_l*_prematched
    - inference
    - inference_*
    - last.ckpt
    - "**/step*.ckpt"
    - "**/*.log"
    - "**/tensorboard/**"
    - "**/wandb/**"
