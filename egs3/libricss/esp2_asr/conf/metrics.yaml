##########################################################
#           LIBRICSS METRIC SETTINGS (SA-WER)            #
##########################################################
# Speaker-attributed WER for the diarized flow, ported from
# egs/libri_css/asr1/local/{multispeaker_score.sh,get_perspeaker_output.py,
# best_wer_matching.py}. Per recording, hypothesis streams (grouped by the
# diarizer's speaker labels) are matched to oracle reference speaker streams
# with the Hungarian algorithm; reported per overlap condition and overall.
#
#   python run.py --stages measure --eval_config conf/eval.yaml \
#       --inference_config conf/inference.yaml \
#       --metrics_config conf/metrics.yaml
#
# (--eval_config/--inference_config supply exp_dir/inference_dir and the
# test-set definition the `dataset:` inputs are read from.)
#
# `inputs` binds each SA-WER input to its source:
#   hyp    text.scp written by the infer stage (the transcripts)
#   spk    diarized speaker label per segment      (dataset column)
#   reco   recording (meeting) id per segment      (dataset column)
#   start  segment start time in seconds, for chronological ordering
#          (dataset column)

data_dir: ${recipe_dir}/data

metrics:
  - metric:
      _target_: src.metrics.sawer.SAWER
      data_dir: ${data_dir}
      # True (default): unmatched reference speakers count as deletions and
      # unmatched hypothesis speakers as insertions (CHiME-style). The ESPnet1
      # scoring dropped unmatched speakers instead; set to false to mimic it.
      pad_missing_speakers: true
    inputs:
      hyp: text
      spk: dataset:spk
      reco: dataset:reco
      start: dataset:start
