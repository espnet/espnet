##########################################################
#  Supervised BSRNN seed, URGENT 2025 pool -- commercial-use data only
##########################################################
# Denoising only: half of the crops are reverberant and the speech target is
# the speech as it is in the input, so the model keeps the reverberation
# (mixture consistency: speech + noise = mixture). Only data whose license
# allows commercial use and derivative models, without share-alike:
#   speech: CommonVoice (CC0), DNS5 read speech (LibriVox, CC BY 4.0),
#           LibriTTS, MLS, VCTK (CC BY 4.0). EARS (CC BY-NC) is dropped.
#   noise:  FSD50K, FMA no-vocal and DNS5 Freesound clips restricted to
#           CC0 / CC BY / public domain by ${data_dir}/commercial_allow.txt
#           (per-file record with attribution: noise_licenses.tsv, written by
#           create_dataset); URGENT simulated wind; MUSAN noise (public
#           domain / CC BY 3.0). Dropped: WHAM! (CC BY-NC), DNS5 AudioSet
#           clips (YouTube), and every NC / ND / SA / Sampling+ / unknown file.
#   RIRs:   DNS5 (SLR26 / SLR28, Apache 2.0).
# 1.17 M speech files (~2020 h), 32.6 k noise files (80.7 h). SNR -5..20 dB.
exp_tag: supervised_commercial_bsrnn
urgent_root: ${oc.env:URGENT25_ROOT}
data_dir: ${oc.env:URGENT_OUTPUT,${recipe_dir}/data}

# Builder arguments (dataset/builder.py): commercial_only runs the per-file
# license audit, which needs the dataset metadata (see README); the dev set
# needs the URGENT 2026 store.
create_dataset:
  recipe_dir: ${recipe_dir}
  urgent_root: ${urgent_root}
  dev_root: ${oc.env:URGENT26_ROOT,null}
  out_dir: ${data_dir}
  commercial_only: true
  fsd50k_meta: ${oc.env:FSD50K_META,null}
  fma_meta: ${oc.env:FMA_META,null}
  fsdkaggle_meta: ${oc.env:FSDKAGGLE2018_META,null}
  musan_noise: ${oc.env:MUSAN_NOISE,null}

urgent_data: &urgent_data
  root: ${urgent_root}
  speech_subsets: [speech_commonvoice, speech_dns5, speech_libritts, speech_mls, speech_vctk]
  noise_subsets: [noise_dns5, noise_fsd50k, noise_fma_novocal, noise_wind]
  noise_allow_list: ${data_dir}/commercial_allow.txt
  noise_allow_subsets: [noise_dns5, noise_fsd50k, noise_fma_novocal]
  extra_noise_list: ${data_dir}/musan_noise_commercial.txt
  segment_seconds: 3.0
  reverb_prob: 0.5
  snr_range: [-5.0, 20.0]

dataset:
  train:
    - data_src_args:
        <<: *urgent_data
        split: train
        num_items: 320000   # 5000 steps per epoch at batch 64
  valid:
    - data_src_args:
        <<: *urgent_data
        split: valid
        num_items: 1000
        deterministic: true

model:
  mode: supervised
  readout: dnf
  mix_consistency: energy
  net:
    # URGENT 2024 BSRNN layout; the 48 kHz STFT is scaled to 16 kHz
    # (20 ms window, 10 ms hop) and only the bands below 8 kHz are used.
    encoder: stft
    encoder_conf:
      n_fft: 960
      hop_length: 480
      use_builtin_complex: true
      default_fs: 48000
    decoder: stft
    decoder_conf:
      n_fft: 960
      hop_length: 480
      default_fs: 48000
    separator: bsrnn
    separator_conf:
      num_spk: 2
      num_channels: 64
      num_layers: 6
      target_fs: 48000
      causal: false

# bf16 BSRNN saturates an H200 at batch 64 (~840 s of audio/s, 28 GiB).
# persistent_workers: no re-fork per epoch (the first run hung there);
# timeout: a stuck worker raises after 10 min instead of holding the GPU.
dataloader:
  train:
    batch_size: 64
    num_workers: 15
    persistent_workers: true
    timeout: 600
  valid:
    batch_size: 64
    persistent_workers: true
    timeout: 600

trainer:
  max_steps: 100000   # 6.4 M crops (~5300 h of audio), ~7 h on one H200
