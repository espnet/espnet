##########################################################
#                   TRAINING SETTING                     #
##########################################################
# Used by the create_dataset, collect_stats and train stages.
#
# This file overrides parts of egs3/TEMPLATE/esp2_s2t/conf/training.yaml, which
# sets the task and the iter_factory and collate_fn of the dataloader. It
# cannot be used alone.
recipe_dir: .
exp_tag: whisper_sot_train
exp_dir: ${recipe_dir}/exp/${exp_tag}
stats_dir: ${recipe_dir}/exp/stats/${exp_tag}

num_device: 1
num_nodes: 1

# The builder writes the token list under the corpus root, at data/tokens.txt.
token_list_path: ${oc.env:AMI_SOT_DATA_ROOT,${recipe_dir}}/data/tokens.txt

##########################################################
#                    DATASET DEFINITION                  #
##########################################################
# data_src is omitted, so ESPnet3 loads ${recipe_dir}/dataset/__init__.py and
# creates the DatasetBuilder that it exports. All three splits use the same
# builder, which prepares each split once.
#
# dataset/builder.py implements create_dataset. It downloads the Lhotse CutSet
# manifests and the AMI SDM audio. For each split, it points the recordings to
# the downloaded audio, adds the serialized text of each utterance group to its
# cut, and writes one CutSet. The serialization options are under builder.sot
# in dataset/config.yaml.
dataset:
  train:
    - name: train
      data_src_args:
        split: train
  valid:
    - name: valid
      data_src_args:
        split: valid
  # Training reads only train and valid. All three entries use one builder, and
  # create_dataset calls it once. The builder prepares every split in
  # split_dirs of dataset/config.yaml, including test, which the inference
  # stage reads.
  test:
    - name: test
      data_src_args:
        split: test
  # espnet3/systems/esp2_s2t/src/sot/preprocessor.py explains why
  # S2TPreprocessor needs changes for a Whisper vocabulary. DataOrganizer sets
  # `train` itself, so it is not set here.
  preprocessor:
    _target_: espnet3.systems.esp2_s2t.src.sot.preprocessor.SotS2TPreprocessor
    token_type: whisper_multilingual
    bpemodel: whisper_multilingual
    # Whisper vocabulary for the tokenizer and the token id converter.
    whisper_model_type: whisper_multilingual
    token_list: ${token_list_path}
    # The same separator that dataset/config.yaml uses to serialize the
    # corpus. Inference and metrics read the same variable.
    speaker_change_symbol: ${oc.env:AMI_SOT_SPEAKER_CHANGE_SYMBOL,????}
    # The default symbols are from OWSM. They are not in the Whisper vocabulary
    # and raise KeyError.
    notime_symbol: "<|notimestamps|>"
    first_time_symbol: "<|0.00|>"
    last_time_symbol: "<|30.00|>"
    # With the default 0.5, about half of the samples lose all their
    # timestamps.
    time_apply_prob: 1.0
    # The default "<na>" is not a Whisper token. BPE splits it into several
    # tokens, so the check `if self.na in y_prev` in the model fails, and the
    # decoder is conditioned on those characters.
    na_symbol: "<|nospeech|>"
    # The preprocessor replaces text_prev with na_symbol when uniform() is
    # larger than this value, so 0.0 always replaces it. The dataset already
    # sets text_prev to na_symbol for every sample, so the result is the same
    # either way, and no random choice is made.
    text_prev_apply_prob: 0.0
    speech_length: 30
    speech_resolution: 0.02
    fs: 16000

##########################################################
#                      MODEL SETTING                     #
##########################################################
model:
  token_list: ${token_list_path}

  # S2TTask.build_model ignores this block, and training uses the
  # dataset.preprocessor block above. The block is here so that it is saved in
  # exp/<tag>/config.yaml, from which the inference stage builds the
  # preprocessor of Speech2Text. It is interpolated from dataset.preprocessor,
  # so training and decoding use the same preprocessor settings.
  preprocessor_conf:
    notime_symbol: ${dataset.preprocessor.notime_symbol}
    first_time_symbol: ${dataset.preprocessor.first_time_symbol}
    last_time_symbol: ${dataset.preprocessor.last_time_symbol}
    na_symbol: ${dataset.preprocessor.na_symbol}
    fs: ${dataset.preprocessor.fs}
    speech_length: ${dataset.preprocessor.speech_length}
    speech_resolution: ${dataset.preprocessor.speech_resolution}
    time_apply_prob: ${dataset.preprocessor.time_apply_prob}
    text_prev_apply_prob: ${dataset.preprocessor.text_prev_apply_prob}
  frontend: null
  input_size: 1
  specaug: null
  normalize: null

  encoder: whisper
  encoder_conf:
    whisper_model: small
    dropout_rate: 0.0
    do_pad_trim: true

  decoder: whisper
  decoder_conf:
    whisper_model: small
    # This is needed when the token list is longer than the Whisper vocabulary,
    # which happens when builder.separator is not in the vocabulary. It keeps
    # the pretrained embedding rows, which would otherwise all be initialized
    # again. It also changes the state_dict keys, so every config that loads
    # this checkpoint later must use the same value.
    load_origin_token_embedding: true

  model_conf:
    ctc_weight: 0.0
    # ESPnetS2TModel looks up these five symbols with token_list.index, and the
    # Whisper vocabulary does not contain the default symbols. <|translate|>
    # takes the place of the CTC blank, which is never used with ctc_weight
    # 0.0.
    sym_blank: "<|translate|>"
    sym_sos: "<|startoftranscript|>"
    sym_eos: "<|endoftext|>"
    sym_sop: "<|startofprev|>"
    sym_na: "<|nospeech|>"

##########################################################
#            OPTIMIZER & SCHEDULER SETTING               #
##########################################################
optimizer:
  _target_: torch.optim.AdamW
  lr: 5.0e-6
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.01
  # fused is false because a fused optimizer unscales the gradients inside its
  # own step. Lightning's precision plugin then refuses
  # trainer.gradient_clip_val, and this recipe uses gradient clipping.

# Linear warmup followed by one cosine decay. first_cycle_steps equals
# trainer.max_steps, so the cycle does not restart. warmup_steps is 4% of
# max_steps.
scheduler:
  _target_: espnet2.schedulers.cosine_anneal_warmup_restart.CosineAnnealingWarmupRestarts
  first_cycle_steps: 50000
  max_lr: 5.0e-6
  min_lr: 0.0
  warmup_steps: 2000
  cycle_mult: 1.0
  gamma: 1.0
scheduler_interval: step

best_model_criterion:
  - - valid/loss
    - 1
    - min

# The batches are not sorted, because the preprocessor pads every utterance to
# speech_length * fs, so all inputs have the same length. feats_shape is used
# only as the list of keys. shape_files come from collect_stats, which must run
# first.
#
# batch_size 16 with accumulate_grad_batches 2 gives an effective batch size of
# 32. A batch size of 32 per device does not fit in memory. Peak memory depends
# on the length of the decoder target, which varies a lot, so a batch of long
# targets runs out of the 95 GiB of GPU memory in the label-smoothing loss.
dataloader:
  train:
    iter_factory:
      batches:
        type: unsorted
        batch_size: 16
        shape_files:
          - ${stats_dir}/train/feats_shape
  valid:
    iter_factory:
      batches:
        type: unsorted
        batch_size: 16
        shape_files:
          - ${stats_dir}/valid/feats_shape

trainer:
  max_steps: 50000
  accumulate_grad_batches: 2
  gradient_clip_val: 1.0
  precision: bf16-mixed

fit: {}
