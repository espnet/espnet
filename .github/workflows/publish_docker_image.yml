name: publish docker image

on:
  schedule:
    # Runs every Monday at midnight UTC
    - cron: "0 0 * * 1"

jobs:
  docker-build:
    runs-on: ubuntu-latest
    environment: docker
    # Only runs if the current branch is 'master'
    # Only runs if the current repository is espnet/espnet
    if: github.repository == 'espnet/espnet' && github.ref == 'refs/heads/master'
    strategy:
      matrix:
        include:
          - variant: cpu
            from_tag: runtime-latest
            image_tag: espnet/espnet:cpu-latest
            cuda_arg: ""
          - variant: gpu
            from_tag: cuda-latest
            image_tag: espnet/espnet:gpu-latest
            cuda_arg: "--build-arg CUDA_VER=11.1"
    steps:
      # See ci_on_ubuntu.yml: the default persists GITHUB_TOKEN in .git/config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.variant }} container
        run: |
          cd docker
          docker build --build-arg FROM_TAG=${{ matrix.from_tag }} \
            ${{ matrix.cuda_arg }} \
            -f prebuilt/devel.dockerfile \
            --target devel \
            -t ${{ matrix.image_tag }} .
          docker push ${{ matrix.image_tag }}
