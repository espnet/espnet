name: ci on ubuntu

on:
  push:
    branches:
      - master
      - espnet3
  pull_request:
    # ready_for_review is required: jobs are skipped on draft PRs, so the
    # gate below must get a fresh run once the PR leaves draft.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master
      - espnet3

# Only one run per PR at a time: a new push cancels the superseded run.
# Non-PR events key the group on github.sha rather than github.ref so that
# every push to master gets its own group. cancel-in-progress only protects
# runs that have actually started; a *pending* run is cancelled when a newer
# run joins its group, and master runs here sit pending for a long time.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NLTK_DISABLE_IMPORT_SECURITY: "1"

jobs:
  process_labels:
    runs-on: ubuntu-latest
    outputs:
      is_docker: ${{ steps.step1.outputs.is_docker }}
      test_upload: ${{ steps.step2.outputs.test_upload }}
    steps:
      - name: Get PR labels
        id: pr-labels
        uses: joerick/pr-labels-action@v1.0.9
      - name: Check whether PR is related to only docker
        id: step1
        run: |
          if [ -z "$GITHUB_PR_LABEL_ESPNET2" ] && [ -z "$GITHUB_PR_LABEL_ESPNET3" ] && [ -n "$GITHUB_PR_LABEL_DOCKER" ]; then
            echo "is_docker=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_docker=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check whether PR requests publication upload test
        id: step2
        run: |
          if [ -n "$GITHUB_PR_LABEL_TEST_UPLOAD" ]; then
            echo "test_upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "test_upload=false" >> "$GITHUB_OUTPUT"
          fi

  # NOTE (Nelson): The setup_environment job is currently disabled to avoid the cache CI issues. It can be re-enabled when needed.
  # Or be replaced with a more efficient caching strategy for system dependencies. Will consider Docker-based caching or pre-built images if the issue persists.
  # setup_environment:
  #   runs-on: ubuntu-latest
  #   needs: process_labels
  #   if: |
  #     github.event.pull_request.draft == false
  #   strategy:
  #     max-parallel: 20
  #     matrix:
  #       python-version: ["3.10", "3.12"]
  #       pytorch-version: [2.9.1, 2.10.0, 2.11.0]
  #       use-conda: [false]
  #   steps:
  #     - uses: actions/checkout@master
  #     - uses: actions/cache@v6
  #       with:
  #         path: ~/.cache/pip
  #         key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.pytorch-version }}-${{ hashFiles('**/pyproject.toml') }}-${{ hashFiles('**/Makefile') }}
  #     # - name: Cache tools
  #     #   uses: actions/cache@v6
  #     #   with:
  #     #     path: tools
  #     #     key: ${{ runner.os }}-tools-${{ github.run_id }}-${{ matrix.python-version }}-${{ matrix.pytorch-version }}-${{ hashFiles('**/pyproject.toml') }}-${{ hashFiles('**/Makefile') }}
  #     - name: Make environment
  #       uses: ./.github/actions/prepare-environment
  #       with:
  #         os-version: ubuntu
  #         python-version: ${{ matrix.python-version }}
  #         pytorch-version: ${{ matrix.pytorch-version }}
  #         use-conda: ${{ matrix.use-conda }}
  #     - name: Install Kaldi
  #       run: ./ci/install_kaldi.sh

  test_python_espnet2:
    runs-on: ubuntu-latest
    needs: process_labels
    if: |
      github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        python-version: ["3.10", "3.12"]
        pytorch-version: [2.9.1, 2.10.0, 2.11.0]
        use-conda: [false]
    steps:
      - uses: actions/checkout@master
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.pytorch-version }}-${{ hashFiles('**/pyproject.toml') }}-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.pytorch-version }}-
      # Pretrained checkpoints downloaded by s3prl at test-collection time
      # (currently only hubert_base_ls960.pt, ~360 MB). Without this every job
      # re-downloads it from huggingface.co, and under load the download returns
      # an HTML error page that then fails to unpickle in torch.load.
      # One stable key shared by all jobs and matrix cells: the upstream
      # checkpoints are immutable, so bump the suffix to refresh them.
      - name: Cache s3prl pretrained checkpoints
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/s3prl
          key: ${{ runner.os }}-s3prl-v1
      - name: Make environment
        uses: ./.github/actions/prepare-environment
        with:
          os-version: ubuntu
          python-version: ${{ matrix.python-version }}
          pytorch-version: ${{ matrix.pytorch-version }}
          use-conda: ${{ matrix.use-conda }}
          hf-token: ${{ secrets.HF_CI_TOKEN }}
      - name: test python
        run: ./ci/test_python_espnet2.sh
      - uses: codecov/codecov-action@v7
        with:
          flags: test_python_espnet2
      - name: coverage erase
        continue-on-error: true
        run: |
          source tools/activate_python.sh
          coverage erase
      # Only pushes write caches. Pull request runs restore and never save, so a
      # miss on a PR branch cannot add another per-ref copy of the same entry.
      - name: Save pip cache
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.pytorch-version }}-${{ hashFiles('**/pyproject.toml') }}-${{ hashFiles('**/Makefile') }}
      - name: Save s3prl checkpoint cache
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/s3prl
          key: ${{ runner.os }}-s3prl-v1

  # ---------------------------------------------------------------------------
  # Experiment. Runs the same tests as the 3.10 / 2.9.1 cell of
  # test_python_espnet2, but inside the prebuilt image from
  # docker/ci.dockerfile, so the two can be compared directly.
  #
  # What is being measured is the "Initialize containers" step, which is the
  # image pull, against the 8.0 min "Make environment" it is meant to replace.
  #
  # Deliberately NOT in ci_gate_ubuntu's needs, and continue-on-error, so this
  # cannot block a merge while it is being evaluated. Delete both this job and
  # resolve_ci_image once the question is answered either way.
  # ---------------------------------------------------------------------------
  resolve_ci_image:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.draft == false
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        # Same inputs, same order as build_ci_image.yml. Computing it rather
        # than hardcoding keeps the two from drifting apart.
        run: |
          hash=${{ hashFiles('ci/install.sh', 'docker/ci.dockerfile', 'pyproject.toml', 'tools/Makefile', 'tools/installers/**') }}
          echo "tag=py3.10-th2.9.1-${hash:0:12}" >> "$GITHUB_OUTPUT"

  test_python_espnet2_container:
    runs-on: ubuntu-latest
    needs: [process_labels, resolve_ci_image]
    if: |
      github.event.pull_request.draft == false
    continue-on-error: true
    container:
      image: ghcr.io/espnet/espnet-ci:${{ needs.resolve_ci_image.outputs.tag }}
      # The package is private, so a token is needed until it is published
      # publicly. Whether this is enough for a pull request from a fork is one
      # of the things this experiment answers.
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Link the prebuilt tools into the checkout
        # tools/ in a checkout has the tracked files but none of the build
        # output - no venv, no activate_python.sh, no sctk. Link in whatever
        # the image has and the checkout does not, which leaves tracked files
        # alone and needs no list to keep up to date.
        run: |
          for path in /espnet/tools/*; do
            name=$(basename "$path")
            [ -e "tools/${name}" ] || ln -s "$path" "tools/${name}"
          done
          ls -la tools/ | head -20

      - name: Point the editable install at this checkout
        # The image's editable install refers to a source tree that is not in
        # the final stage. This is what makes the tested code the code in this
        # pull request. Everything it depends on is already installed.
        run: |
          start=$SECONDS
          pip install -e . --no-deps
          pip install -r ci/no_redistribute.txt || echo "no_redistribute.txt not present on this branch yet"
          echo "reinstall took $((SECONDS - start))s"
          python -c "import espnet, espnet2; print('espnet from', espnet.__file__)"

      - name: test python
        run: ./ci/test_python_espnet2.sh

  test_utils_espnet2:
    runs-on: ubuntu-latest
    needs: process_labels
    if: |
      github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        python-version: ["3.10", "3.12"]
        pytorch-version: [2.9.1]
        use-conda: [false]
    steps:
      - uses: actions/checkout@master
      - uses: actions/cache/restore@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.pytorch-version }}-${{ hashFiles('**/pyproject.toml') }}-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.pytorch-version }}-
      - name: Make environment
        uses: ./.github/actions/prepare-environment
        with:
          os-version: ubuntu
          python-version: ${{ matrix.python-version }}
          pytorch-version: ${{ matrix.pytorch-version }}
          use-conda: ${{ matrix.use-conda }}
          hf-token: ${{ secrets.HF_CI_TOKEN }}
      - name: test utils
        run: ./ci/test_utils.sh
      - uses: codecov/codecov-action@v7
        with:
          flags: test_utils
      - name: coverage erase
        continue-on-error: true
        run: |
          source tools/activate_python.sh
          coverage erase
      # Only pushes write caches. Pull request runs restore and never save, so a
      # miss on a PR branch cannot add another per-ref copy of the same entry.
      - name: Save pip cache
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.pytorch-version }}-${{ hashFiles('**/pyproject.toml') }}-${{ hashFiles('**/Makefile') }}

  test_shell_espnet2:
    runs-on: ubuntu-latest
    needs: process_labels
    if: |
      github.event.pull_request.draft == false
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        python-version: ["3.10"]
        pytorch-version: [2.9.1]
        use-conda: [false]
    steps:
      - uses: actions/checkout@master
      - uses: actions/cache/restore@v6
        with:
