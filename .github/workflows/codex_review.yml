name: Request Codex review

# Most ESPnet pull requests come from forks. pull_request_target is required
# so the base repository's GITHUB_TOKEN can post a comment on those PRs.
# This workflow must not check out or execute code from the pull request.
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions: {}

jobs:
  request-codex-review:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Request Codex review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "${PR_DRAFT}" = "true" ]; then
            echo "PR is still a draft; skipping Codex review request."
            exit 0
          fi

          gh api --method POST "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -f body='@codex review'
