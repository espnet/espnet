name: ci on debian12

on:
  push:
    branches:
      - master
      - espnet3
  pull_request:
    # ready_for_review is required: jobs are skipped on draft PRs, so the
    # gate below must get a fresh run once the PR leaves draft.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master
      - espnet3

# Only one run per PR at a time: a new push cancels the superseded run.
# Non-PR events key the group on github.sha rather than github.ref so that
# every push to master gets its own group. cancel-in-progress only protects
# runs that have actually started; a *pending* run is cancelled when a newer
# run joins its group, and master runs here sit pending for a long time.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The default on this repository is almost entirely write - a job's GITHUB_TOKEN
# reports Contents: write, Actions: write, PullRequests: write, Packages: write
# and more. This job checks out a pull request's code and runs it, next to
# third-party actions, and writes nothing.
#
#   contents       checkout, and actions/cache
#   pull-requests  joerick/pr-labels-action
#
# No packages: read here - unlike ci_on_ubuntu.yml these pull no GHCR image
# (ci_on_debian12.yml's debian:12 comes from Docker Hub, which does not use
# GITHUB_TOKEN). No id-token either: it is not granted today and nothing here
# uploads to codecov. See #6583, which did the same for ci_on_ubuntu.yml.
permissions:
  contents: read
  pull-requests: read

env:
  NLTK_DISABLE_IMPORT_SECURITY: "1"

jobs:
  unit_test_espnet2_and_espnet3_on_debian12:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    container:
      image: debian:12
      env:
        ESPNET_PYTHON_VERSION: "3.10"
        TH_VERSION: 2.9.1
        USE_CONDA: true
        # To avoid UnicodeEncodeError for python<=3.6
        LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v7
      - name: check OS
        run: cat /etc/os-release
      - name: install dependencies
        run: |
          apt-get update -qq
          # NOTE(kamo): cmake sndfile will be downloaded using anaconda:
          apt-get install -qq -y \
            build-essential git unzip bzip2 wget curl bc locales make sox \
            libncurses5-dev automake libtool pkg-config
          localedef -f UTF-8 -i en_US en_US
      - name: Get PR labels
        id: pr-labels
        uses: joerick/pr-labels-action@v1.0.9
      - name: install espnet
        run: ./ci/install.sh
        env:
          HF_TOKEN: ${{ secrets.HF_CI_TOKEN }}
      - name: test shell
        run: |
          ./ci/test_shell_espnet2.sh
      - name: test python
        run: |
          ./ci/test_python_espnet2.sh
          ./ci/test_python_espnet3.sh

  # Single stable status check that aggregates every job in this workflow.
  # Register THIS job as the required status check instead of the individual
  # matrix jobs, whose names change whenever the matrix changes.
  ci_gate_debian12:
    if: always()
    needs:
      - unit_test_espnet2_and_espnet3_on_debian12
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "At least one job did not succeed:"
          echo "$NEEDS_JSON"
          exit 1
      - name: All jobs succeeded
        run: echo "All jobs in this workflow succeeded."
