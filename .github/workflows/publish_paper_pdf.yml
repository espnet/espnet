name: publish paper pdf

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Only one run per PR at a time: a new push cancels the superseded run.
# Runs on master and in the merge queue are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  generate_and_upload_paper_pdf:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@master
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          # This should be the path to the paper within your repo.
          paper-path: doc/paper/espnet-se++/paper.md
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: paper
          # This is the output path where Pandoc will write the compiled
          # PDF. Note, this should be the same directory as the input
          # paper.md
          path: doc/paper/espnet-se++/paper.pdf
