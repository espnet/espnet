name: ci on macos

on:
  push:
    branches:
      - master
      - espnet3
  pull_request:
    # ready_for_review is required: jobs are skipped on draft PRs, so the
    # gate below must get a fresh run once the PR leaves draft.
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master
      - espnet3

env:
  NLTK_DISABLE_IMPORT_SECURITY: "1"

jobs:
  check_installable_on_macos:
    runs-on: macOS-latest
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        python-version: ["3.10"]
        pytorch-version: [2.9.1]
        use-conda: [true, false]
    steps:
      - uses: actions/checkout@master
      - name: Install FFmpeg
        uses: ./.github/actions/install-ffmpeg
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ matrix.pytorch-version }}-${{ hashFiles('**/pyproject.toml') }}-${{ hashFiles('**/Makefile') }}
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Get PR labels
        id: pr-labels
        uses: joerick/pr-labels-action@v1.0.9
      - name: install espnet
        env:
          ESPNET_PYTHON_VERSION: ${{ matrix.python-version }}
          TH_VERSION: ${{ matrix.pytorch-version }}
          CHAINER_VERSION: 6.0.0
          USE_CONDA: ${{ matrix.use-conda }}
          # FIXME(kamo): clang is used by default, but I don't know how to use "-fopenmp" with clang
          WITH_OMP: OFF
          # NOTE(kamo): If it's hard to build with clang, please consider using gcc
          # However, I couldn't build pysptk with gcc on MacOS
          # CC: /usr/local/bin/gcc-11
          # CXX: /usr/local/bin/g++-11
          HF_TOKEN: ${{ secrets.HF_CI_TOKEN }}
        run: |
          ./ci/install_macos.sh

  # Single stable status check that aggregates every job in this workflow.
  # Register THIS job as the required status check instead of the individual
  # matrix jobs, whose names change whenever the matrix changes.
  ci_gate_macos:
    if: always()
    needs:
      - check_installable_on_macos
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        if: >-
          contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled')
          || contains(needs.*.result, 'skipped')
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "At least one job did not succeed:"
          echo "$NEEDS_JSON"
          exit 1
      - name: All jobs succeeded
        run: echo "All jobs in this workflow succeeded."
