name: build ci image

# Builds the prebuilt CI environment described in docker/ci.dockerfile.
#
# This is deliberately NOT run per pull request. It runs when the files that
# determine the image's contents change on master, plus nightly to catch
# upstream package drift, plus on demand. CI jobs only ever pull.
#
# Pull requests build the image without pushing it, which is what makes this
# measurable from a fork: the size and build time are reported in the summary.

on:
  workflow_dispatch:
  schedule:
    # 03:00 UTC daily - upstream wheels move even when this repository does not.
    - cron: "0 3 * * *"
  push:
    branches:
      - master
    paths:
      - "ci/install.sh"
      - "ci/install_kaldi.sh"
      - "ci/no_redistribute.txt"
      - "ci/report_unlicensed.py"
      - "docker/ci.dockerfile"
      - "pyproject.toml"
      - "tools/Makefile"
      - "tools/installers/**"
      - ".github/workflows/build_ci_image.yml"
  pull_request:
    branches:
      - master
    paths:
      - "ci/install.sh"
      - "ci/install_kaldi.sh"
      - "ci/no_redistribute.txt"
      - "ci/report_unlicensed.py"
      - "docker/ci.dockerfile"
      - "pyproject.toml"
      - "tools/Makefile"
      - "tools/installers/**"
      - ".github/workflows/build_ci_image.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The same 2 python x 3 torch grid the test jobs use. Builds run in
        # parallel, so this costs the same wall clock as one cell and about
        # 66 runner-minutes - paid only when the inputs change or nightly,
        # against the 13.5 runner-hours a single pull request spends today
        # rebuilding the same environment 101 times.
        python-version: ["3.10", "3.12"]
        pytorch-version: ["2.9.1", "2.10.0", "2.11.0"]
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          echo "::group::before"
          df -h /
          echo "::endgroup::"
          # ubuntu-latest ships ~14 GB free; these are not needed here and the
          # image is expected to be several GB.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "${AGENT_TOOLSDIRECTORY}" || true
          echo "::group::after"
          df -h /
          echo "::endgroup::"

      - name: Resolve image tag
        id: tag
        run: |
          hash=${{ hashFiles('ci/install.sh', 'ci/install_kaldi.sh', 'ci/no_redistribute.txt', 'docker/ci.dockerfile', 'pyproject.toml', 'tools/Makefile', 'tools/installers/**') }}
          echo "tag=py${{ matrix.python-version }}-th${{ matrix.pytorch-version }}-${hash:0:12}" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        run: |
          start=$SECONDS
          docker build \
            --build-arg PYTHON_VERSION=${{ matrix.python-version }} \
            --build-arg TH_VERSION=${{ matrix.pytorch-version }} \
            -f docker/ci.dockerfile \
            -t "ghcr.io/${{ github.repository }}-ci:${{ steps.tag.outputs.tag }}" \
            .
          echo "seconds=$((SECONDS - start))" >> "$GITHUB_OUTPUT"

      - name: Report size and build time
        run: |
          image="ghcr.io/${{ github.repository }}-ci:${{ steps.tag.outputs.tag }}"
          bytes=$(docker image inspect "$image" --format '{{.Size}}')
          secs=${{ steps.build.outputs.seconds }}
          {
            echo "### Prebuilt CI image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| tag | \`${{ steps.tag.outputs.tag }}\` |"
            echo "| uncompressed size | $((bytes / 1048576)) MiB |"
            echo "| build time | $((secs / 60))m $((secs % 60))s |"
            echo
            echo "For comparison, \`Make environment\` currently averages 8.0 min in each of ~101 jobs per run."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "size=$((bytes / 1048576)) MiB  build=${secs}s"
          docker history "$image" --human --format 'table {{.Size}}\t{{.CreatedBy}}' | head -20

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name != 'pull_request'
        run: docker push "ghcr.io/${{ github.repository }}-ci:${{ steps.tag.outputs.tag }}"

      - name: Delete untagged versions
        # The nightly build produces the same tag whenever the inputs are
        # unchanged, but a different digest, because upstream wheels move. The
        # version it replaces is left untagged and keeps consuming storage, so
        # without this the package grows by six images a day forever.
        #
        # Tagged versions are never touched: a pull request may still resolve
        # to an older tag if it does not change the inputs.
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          owner: ${{ github.repository_owner }}
          package-name: espnet-ci
          package-type: container
          delete-only-untagged-versions: "true"
