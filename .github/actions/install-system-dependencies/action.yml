name: Install System Dependencies
description: Install required system packages for ESPnet testing

inputs:
  packages:
    description: 'Space-separated list of packages to install'
    required: false
    default: 'cmake libsndfile1-dev bc sox ffmpeg libjpeg-dev'
  enable-cache:
    description: 'Enable apt cache to speed up installation'
    required: false
    default: 'true'

runs:
  using: "composite"
  steps:

    - name: Install system packages
      shell: bash
      run: |
        # The runner image ships apt repositories espnet installs nothing from,
        # packages.microsoft.com among them, and a 403 from any one of them
        # fails `apt-get update` outright:
        #
        #   E: Failed to fetch https://packages.microsoft.com/... 403 Forbidden
        #   ##[error]Process completed with exit code 100
        #
        # Refreshing the index is a means, not the goal. Let it report errors
        # and judge on whether the packages actually asked for arrived - if the
        # failure did matter, the install below fails and says which package.
        #
        # A stalled mirror connection otherwise hangs the job: on the
        # ubuntu-26.04 runners 5 of 32 jobs of one run sat 11-47 min between
        # starting `apt-get update` and dpkg unpacking the first package (the
        # median job takes 0.3 min). Give every fetch a timeout and retries so
        # a dead connection is dropped and retried, and log how long each
        # phase takes so a stall shows where it happened.
        apt_opts=(-o Acquire::Retries=5
                  -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
        start=$SECONDS
        sudo apt-get "${apt_opts[@]}" update -qq \
          || echo "::warning::apt-get update reported errors; continuing to install"
        echo "apt-get update: $((SECONDS - start)) s"
        start=$SECONDS
        sudo apt-get "${apt_opts[@]}" install -qq -y ${{ inputs.packages }}
        echo "apt-get install: $((SECONDS - start)) s"
