name: Use the prebuilt environment
description: >
  Wires a checkout to the environment baked into the CI image built by
  docker/ci.dockerfile. Only makes sense inside a job with a matching
  `container:`.

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        VENV: /espnet/tools/venv/bin
      run: |
        # tools/ in a checkout has the tracked files but none of the build
        # output - no venv, no activate_python.sh, no sctk. Link in whatever the
        # image has and the checkout does not: that leaves tracked files alone
        # and needs no list to keep up to date.
        for path in /espnet/tools/*; do
          name=$(basename "$path")
          [ -e "tools/${name}" ] || ln -s "$path" "tools/${name}"
        done

        # The image's editable install points at a source tree it does not
        # contain. Re-pointing it at the checkout is what makes the tested code
        # the code under review. Every dependency is present, so this is seconds.
        #
        # Call the interpreter by absolute path: GitHub composes its own PATH
        # for container steps rather than inheriting the image's.
        "${VENV}/python" -m pip install -e . --no-deps

        # kaldiio and anything else in this file is deliberately absent from the
        # image because its licence forbids redistribution. Installing it here
        # is not distribution by this project: the runner fetches its own copy
        # from PyPI, exactly as the non-container path does.
        "${VENV}/python" -m pip install -r ci/no_redistribute.txt

        # k2 is here because it spent four years being "installed" without being
        # importable, and once by landing in the system interpreter instead of the
        # venv while the log said it had succeeded. An install log is not
        # evidence; an import is.
        #
        # Except on a torch version k2 publishes no wheel for at all:
        # tools/installers/install_k2.sh skips those, so demanding the import
        # here fails every job on that part of the grid. That is not
        # hypothetical - it is what torch 2.14.0 did the moment its images were
        # published, while the runs before that were green only because the
        # image did not exist yet and this whole step was skipped.
        #
        # Ask the interpreter which torch it has rather than trusting the image
        # tag, and read the gap list out of the installer so the two cannot say
        # different things.
        torch_version=$("${VENV}/python" -c 'import torch; print(torch.__version__.split("+")[0])')
        k2_missing_for=$(sed -n 's/^k2_missing_for="\(.*\)"/\1/p' tools/installers/install_k2.sh)
        expect_k2=true
        for missing in ${k2_missing_for}; do
          if [ "${torch_version}" = "${missing}" ]; then
            expect_k2=false
          fi
        done

        if "${expect_k2}"; then
          "${VENV}/python" -c 'import espnet2, espnet3, kaldiio, k2; print("espnet2 from", espnet2.__file__); print("k2 from", k2.__file__)'
        else
          echo "k2 publishes no wheel for torch ${torch_version}; not requiring its" \
               "import here (tools/installers/install_k2.sh: k2_missing_for)"
          "${VENV}/python" -c 'import espnet2, espnet3, kaldiio; print("espnet2 from", espnet2.__file__)'
        fi
