name: Use the prebuilt environment
description: >
  Wires a checkout to the environment baked into the CI image built by
  docker/ci.dockerfile. Only makes sense inside a job with a matching
  `container:`.

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        VENV: /espnet/tools/venv/bin
      run: |
        # tools/ in a checkout has the tracked files but none of the build
        # output - no venv, no activate_python.sh, no sctk. Link in whatever the
        # image has and the checkout does not: that leaves tracked files alone
        # and needs no list to keep up to date.
        for path in /espnet/tools/*; do
          name=$(basename "$path")
          [ -e "tools/${name}" ] || ln -s "$path" "tools/${name}"
        done

        # The image's editable install points at a source tree it does not
        # contain. Re-pointing it at the checkout is what makes the tested code
        # the code under review. Every dependency is present, so this is seconds.
        #
        # Call the interpreter by absolute path: GitHub composes its own PATH
        # for container steps rather than inheriting the image's.
        "${VENV}/python" -m pip install -e . --no-deps

        # Anything listed in this file is deliberately absent from the image
        # because its licence forbids redistribution. Installing it here is not
        # distribution by this project: the runner fetches its own copy from the
        # original source, exactly as the non-container path does. The list is
        # empty now that kaldiio is gone, so this is a no-op; the step stays so
        # that re-excluding a package needs no change here.
        #
        # omniio needs nothing of the kind: it is MIT-licensed and an ordinary
        # dependency, so it is baked into the image like any other.
        "${VENV}/python" -m pip install -r ci/no_redistribute.txt

        # k2 is asserted because it spent four years being "installed" without
        # being importable, and once by landing in the system interpreter
        # instead of the venv while the log said it had succeeded. An install
        # log is not evidence; an import is.
        #
        # Except where there is no k2 to install: it publishes one wheel per
        # torch version and lags new releases, so install_k2.sh skips the
        # versions it has nothing for and lists them in k2_missing_for. Read
        # that list rather than keeping a second copy of it here - this
        # assertion firing on a version k2 does not build is what it did when
        # torch 2.14.0 arrived.
        torch_version=$("${VENV}/python" -c 'import torch; print(torch.__version__.split("+")[0])')
        k2_missing_for=$(sed -n 's/^k2_missing_for="\(.*\)"$/\1/p' tools/installers/install_k2.sh)
        expect_k2=true
        for missing in ${k2_missing_for}; do
            [ "${torch_version}" = "${missing}" ] && expect_k2=false
        done

        if "${expect_k2}"; then
            "${VENV}/python" -c 'import espnet2, espnet3, k2; print("espnet2 from", espnet2.__file__); print("k2 from", k2.__file__)'
        else
            echo "k2 publishes no wheel for torch=${torch_version}; not asserting it (see k2_missing_for in tools/installers/install_k2.sh)"
            "${VENV}/python" -c 'import espnet2, espnet3; print("espnet2 from", espnet2.__file__)'
        fi
