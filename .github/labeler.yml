          - "espnet2/bin/asr_*"
          - "espnet3/systems/asr/**"
          - "test/espnet2/asr/**"
          - "egs2/*/asr1/**"
          - "egs2/*/asr2/**"
          - "egs2/*/asr1_pipeline/**"
          - "egs2/*/sot_asr1/**"
          - "egs2/*/diar_asr1/**"
          - "egs2/*/enh_asr1/**"
          - "egs3/*/asr/**"

