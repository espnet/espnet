          - "CONTRIBUTING.md"

# Only the top-level one. `files~=README.md` in mergify matched all 256 of
# them, so every recipe change was labelled README.
README:
  - changed-files:
      - any-glob-to-any-file:
          - "README.md"

mergify:
  - changed-files:
      - any-glob-to-any-file:
          - ".mergify.yml"
