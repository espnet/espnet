# Labels v2.1 without Common Voice, with the corrected MUSAN licence filter (rev. 2: a block's
# licence is its most restrictive line; no bare "zero"): as
# conf/data_v2_1_nocv.conf, with the musan corpus re-prepared into dump/v2_clean2 (the
# per-file filter that also rejects "Share Alike" written with a space, and the
# directory-wide CC BY of music/rfm) and every other corpus from dump/v2_1 and dump/v2.
#   local/data.sh --config conf/data_v2_1_nocv_clean2.conf --stage 3 --stop_stage 3 --corpora musan
#   local/data.sh --config conf/data_v2_1_nocv_clean2.conf --stage 5 --stop_stage 5
. conf/data_v2_1_nocv.conf
dumpdir=dump/v2_clean2
reuse_dumpdir="dump/v2_1 dump/v2"
raw_dir=dump_v2_1_nocv_clean2/raw
