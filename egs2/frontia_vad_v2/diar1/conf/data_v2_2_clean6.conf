# conf/data_v2_2_clean5.conf without the material whose upstream rights are unknown
# (Shinji 2026-11-26, after the upstream licence audit):
#   slakh2100     Lakh MIDI renders: the MIDI (scraped songs) has no licence and the
#                 Native Instruments EULA reserves AI training on its sounds
#   lsx           mixtures that contain Slakh2100 stems
#   marmosetvox   InfantMarmosetsVox: the README keeps the copyright with the original
#                 recorders, who granted no licence that we could find
# and with two corpora re-prepared into dump/v2_clean6 by their adapters:
#   starss23               clips with loudspeaker music (class 8) left out
#   dcase2025_bioacoustic  bird_* clips (no stated source) left out
#   local/data.sh --config conf/data_v2_2_clean6.conf --stage 3 --stop_stage 3 \
#       --corpora starss23,dcase2025_bioacoustic
#   local/data.sh --config conf/data_v2_2_clean6.conf --stage 5 --stop_stage 5
. conf/data_v2_2_clean5.conf
dumpdir=dump/v2_clean6
reuse_dumpdir="dump/v2_clean2 dump/v2_2 dump/v2_1 dump/v2"
exclude_corpora=${exclude_corpora:+${exclude_corpora},}slakh2100,lsx,marmosetvox
raw_dir=dump_v2_2_clean6/raw
