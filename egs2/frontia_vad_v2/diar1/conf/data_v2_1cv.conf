# frontia_vad_v2 labels v2.1 with Common Voice, validated on the dev set of
# conf/data_v2_1_nocv.conf (local/data.sh --config conf/data_v2_1cv.conf --stage 5
# --stop_stage 5, sourced as shell): train is that of dump_v2_1/raw (all v2.1 corpora,
# Common Voice included), dev leaves the Common Voice dev recordings out, so that the
# runs with and without Common Voice select their checkpoints on the same dev set.
. conf/data_v2_1.conf
raw_dir=dump_v2_1cv/raw
dev_exclude_corpora=commonvoice
