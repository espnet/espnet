# frontia_vad_v2 labels v2.1 (local/data.sh --config conf/data_v2_1.conf, sourced as shell): the corpora
# labelled by alignment (label source A) prepared again with their transcript clips kept
# inside packs, and aligned per clip with token timing. The other corpora are reused from
# dump/v2; the combined sets go to dump_v2_1/raw (diar.sh --dumpdir dump_v2_1), so dump/v2,
# dump/raw and the models trained on them stay as they are.
#
# Padding and in-clip min_pause, chosen by Shinji (2026-11-15) from the label check
# (local/v2/align_label_check.py; local/check_labels_librispeech.sh): start pad 0 ms,
# end pad 300 ms, min_pause 0.5 s, the best of the grid on LibriSpeech dev against MFA
# word times (DetER 8.62). On AMI dev (spontaneous) min_pause 0.5 s splits utterances at
# false pauses; NB Samtale and MInDS-14 are closer to spontaneous speech and use the same
# setting, unmeasured (noted in their corpus reports, local/v2/corpus_report.py).
label_source=A
dumpdir=dump/v2_1
reuse_dumpdir=dump/v2
raw_dir=dump_v2_1/raw
align_word_timing=tokens
align_clip_mode=true
align_pad_start=0.0
align_pad_end=0.3
align_min_pause=0.5
