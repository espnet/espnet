# conf/data_v2_2_clean4.conf without the read-speech corpora whose prompts are not
# under a licence we use for training (Shinji 2026-11-26: leave them out):
#   fleurs             FLoRes sentences, CC BY-SA 4.0
#   german_kinect      Tuda-De, prompts include Wikipedia sentences (CC BY-SA)
#   ksc                Kazakh Speech Corpus, prompts include Wikipedia sentences
#   samromur           Samrómur, prompts include Wikipedia sentences
#   samromur_children  Samrómur Children, prompts include Wikipedia sentences
#   malromur           Málrómur, prompts from news text with no stated licence
#   zeroth_korean      Zeroth-Korean, prompts from news text with no stated licence
# The recordings are CC BY (CC0 for none of them), but the speech reads the prompt
# text, so the prompt licence applies as well.
#   local/data.sh --config conf/data_v2_2_clean5.conf --stage 5 --stop_stage 5
. conf/data_v2_2_clean4.conf
exclude_corpora=${exclude_corpora:+${exclude_corpora},}fleurs,german_kinect,ksc,samromur,samromur_children,malromur,zeroth_korean
raw_dir=dump_v2_2_clean5/raw
