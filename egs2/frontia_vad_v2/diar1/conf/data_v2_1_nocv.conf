# frontia_vad_v2 labels v2.1 without Common Voice (local/data.sh --config
# conf/data_v2_1_nocv.conf --stage 5 --stop_stage 5, sourced as shell): the dumps and
# labels of conf/data_v2_1.conf, combined into dump_v2_1_nocv/raw without the corpus
# commonvoice, which v2 did not have. A model trained on it differs from v2 in the
# labels only (Shinji, 2026-11-15); dump_v2_1/raw keeps Common Voice.
. conf/data_v2_1.conf
raw_dir=dump_v2_1_nocv/raw
exclude_corpora=commonvoice
