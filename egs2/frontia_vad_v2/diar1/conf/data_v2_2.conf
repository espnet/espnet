# frontia_vad_v2 labels v2.2 (local/data.sh --config conf/data_v2_2.conf --stage 3
# --stop_stage 5, sourced as shell): the labels of v2.1 (conf/data_v2_1.conf) with the dev
# split fixed. In v2 and v2.1, packs of short clips joined the groups (speakers, sessions)
# of a corpus into a few units, and stage 5 put one whole unit in dev when there were 50
# or fewer: aishell3, babycry and samromur lost 94-98 % of their grouped hours to dev
# (about 183 h out of train). v2.2:
#   stage 3  packs hold one group each in the corpora whose packs joined groups (below;
#            they are prepared again into dump/v2_2, and stage 4 aligns the transcribed
#            ones again with the v2.1 settings);
#   stage 5  dev by hours (local/v2/registry.py dev_by_hours): units in hash order up to
#            2 % of each corpus's hours, at most 3 %; a unit above that stays in train;
#            if no unit fits, the smallest when it holds at most 10 %, else no dev.
# The other corpora come from dump/v2_1 (A corpora, v2.1 labels) and dump/v2. Common
# Voice is in train and dev (dev: about 2 % of its hours, like every corpus).
. conf/data_v2_1.conf
label_source=""
corpora=aishell3,babycry,bcp,cavemove,chime3_background,commonvoice,malromur,samromur,vocal_imitation,voices,zeroth_korean
pack_by_group=${corpora}
dumpdir=dump/v2_2
reuse_dumpdir="dump/v2_1 dump/v2"
raw_dir=dump_v2_2/raw
dev_pick=hours
