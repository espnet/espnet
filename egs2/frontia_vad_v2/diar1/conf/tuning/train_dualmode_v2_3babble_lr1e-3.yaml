# frontia_vad_v2 v2.3 with babble: the v2.2aug clean2 setup
# (train_dualmode_v2_2aug_clean2_lr1e-3.yaml: dump_v2_2_clean2, labels unchanged, dual-mode
# model, lr 0.001, 1024 windows per update) with the noise, music and impulse-response banks
# of OpenNoise v0.1 (train split; local/v2/opennoise_banks.py writes data/opennoise_v01/) and
# a stronger telephone channel: on 40% of the windows (v2.2aug 20%), low-pass at 3.0-3.95 kHz
# (3.4-3.95), 300 Hz high-pass on 70% of them (50%), 8-bit mu-law or A-law on 70% (50%);
# and on 30% of the other windows a wide-band low-pass at 16 kHz with a cut-off of 3.4-8 kHz
# (BatchWavAugment lowpass_*; the 4-6 kHz band limits of e.g. Earnings21).
# No item flagged as singing, vocals or speech is in any bank.
# Babble: OpenNoise's real-recorded crowd speech (kind babble) is part of the noise bank
# (data/opennoise_v01/noise_babble.scp = noise.scp + babble), mixed like any noise; the frames
# keep their labels, so background babble is trained as non-speech interference.
# Run with --dumpdir dump_v2_2_clean2 and its own --expdir (its diar_stats_16k: the
# statistics of exp_v2_2_clean2, the same data).

frontend: default
frontend_conf:
    n_fft: 512
    win_length: 512
    hop_length: 128      # 8 ms at 16 kHz
    n_mels: 40
    center: false

encoder: tcn
encoder_conf:
    output_size: 128
    bottleneck_size: 64
    hidden_size: 128
    kernel_size: 3
    num_blocks: 5
    num_repeats: 2       # receptive field 125 frames = 1.0 s of past context
    norm_type: cLN
    future_taps: 2       # 2 taps after the current frame per depthwise conv
    look_ahead: 0        # online at inference unless --look_ahead is given

decoder: linear

label_aggregator: label_aggregator
label_aggregator_conf:
    win_length: 512
    hop_length: 128
    center: false

# on-the-fly noise augmentation of the whole batch on the GPU, in the model
# (training only): the same procedure as the preprocessor's noise_scp
wav_augment: batch_wav
wav_augment_conf:
    noise_scp: data/opennoise_v01/noise_babble.scp
    noise_apply_prob: 0.6
    noise_db_range: "-5_20"
    music_scp: data/opennoise_v01/music.scp
    music_apply_prob: 0.4
    music_db_range: "-10_20"
    telephone_apply_prob: 0.4        # v2.2aug: 0.2
    telephone_cutoff_range: "3000_3950"   # v2.2aug: 3400_3950
    telephone_highpass_hz: 300
    telephone_highpass_prob: 0.7     # v2.2aug: 0.5
    telephone_companding_prob: 0.7   # v2.2aug: 0.5
    # wide-band low-pass at 16 kHz (no resampling), Earnings21-style band limits
    lowpass_apply_prob: 0.3          # of the windows outside the telephone channel
    lowpass_cutoff_range: "3400_8000"
    rir_scp: data/opennoise_v01/rir.scp
    rir_apply_prob: 0.5
    context: 16000       # 1 s of reverberation history, removed before the frontend
    # the banks on the GPU (noise and music about 2 bytes per sample, impulse
    # responses 0.15 GB per GPU),
    # copied once: no pinned host buffers per step, which stalled the data
    # loader's pin-memory thread (127 -> 75 ms per step of 64 windows on an
    # H200); the same output as the host banks
    keep_on_device: true

# 10 s chunks of the recordings, each read on its own (as conf/train.yaml)
iterator_type: chunk
chunk_random_access: true
chunk_length: 160000
chunk_shift_ratio: 1.0
# each epoch draws its chunks per domain (utt2category), domain c getting a share
# proportional to n_c^0.3 of its n_c chunks: small domains are upsampled
chunk_upsampling_factor: 0.3
# the 1 s context of wav_augment: speech chunks start 16000 samples early
chunk_left_context: 16000
batch_size: 256      # per mini-batch, all GPUs: 64 windows per GPU on 4 GPUs
accum_grad: 4        # 1024 windows per update
num_workers: 15      # per GPU process (profiled: 24 was slower than 16 on 4-GPU DDP)
seed: 1
optim: adam
optim_conf:
    lr: 0.001
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 625    # updates: the 640k windows of v1's 10000 steps x 64
grad_clip: 5
max_epoch: 60         # as the v2 run (resumed at epoch 31 to 60; it stopped early at 39)
patience: 5

best_model_criterion:
-   - valid
    - acc
    - max
keep_nbest_models: [2, 5]  # averages of the 2 and 5 best

model_conf:
    look_aheads: [0, 124]
    # loss and accuracy per domain at each validation (local/v2/domain_dev_stats.py)
    valid_category_file: dump_v2_2_clean2/raw/dev/utt2category
