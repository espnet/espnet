# Combined training, shared trainable conditioning projections.
model: lang2vec
model_conf:
  lang2vec_dim: 299
  lang2vec_loss: mse
  lang2vec_weight: 0.2
  lang2vec_conditioning_layers:
  - 32
  - 36
  - 40
  - 44
  apply_intermediate_lang2vec_loss: true
  apply_intermediate_lang2vec_condition: true
  inter_lang2vec_loss_weight: 0.4
  # True detaches the residual AND freezes the conditioning projection.
  cutoff_gradient_from_backbone: false
  cutoff_gradient_before_condproj: true
  shared_conditioning_proj: true
frontend: s3prl
frontend_conf:
  frontend_conf:
    upstream: hf_wav2vec2_custom
    path_or_url: facebook/mms-1b
  download_dir: ./hub
  multilayer_feature: true
normalize: utterance_mvn
normalize_conf:
  norm_vars: false
encoder: ecapa_tdnn
encoder_conf:
  model_scale: 8
  ndim: 512
  output_size: 1536
pooling: chn_attn_stat
projector: rawnet3
projector_conf:
  output_size: 192
encoder_condition: identity
pooling_condition: chn_attn_stat
projector_condition: rawnet3
projector_condition_conf:
  output_size: 192
preprocessor: lid
preprocessor_conf:
  fix_duration: false
  sample_rate: 16000
  noise_apply_prob: 0.0
  rir_apply_prob: 0.0
  rir_scp: null
  lang2vec_table: data/combined_lang2vec.txt
loss: aamsoftmax_sc_topk
loss_conf:
  margin: 0.5
  scale: 30
  K: 3
  mp: 0.06
  k_top: 5
num_att_plot: 0
num_workers: 8
cudnn_deterministic: false
cudnn_benchmark: true
log_interval: 100
unused_parameters: true
use_amp: true
keep_nbest_models: 2
grad_clip: 9999
best_model_criterion:
- - valid
  - accuracy
  - max
iterator_type: category
valid_iterator_type: category
seed: 3702
max_epoch: 33
accum_grad: 4
num_iters_per_epoch: 2000
batch_type: catpow_balance_dataset
batch_bins: 1440000
max_batch_size: 6
upsampling_factor: 0.5
dataset_scaling_factor: 1.2
drop_last_iter: false
optim: adam
optim_conf:
  lr: 1.0e-05
  betas:
  - 0.9
  - 0.98
scheduler: tristagelr
scheduler_conf:
  max_steps: 16500
  warmup_ratio: 0.1
  hold_ratio: 0.4
  decay_ratio: 0.5
  init_lr_scale: 0.6
  final_lr_scale: 0.1
valid_batch_type: catpow
category_upsampling_factor: 0.5
dataset_upsampling_factor: 0.3
