# Restoration feature predictor for CI: the tiny w2v-BERT 2.0 written by
# local/data.sh, a small LoRA adapter, one short epoch on CPU.
ssl_encoder: w2v_bert2
ssl_encoder_conf:
    model_tag: data/tiny_w2v_bert
    target_layer: 2
    freeze_base: true
lora_rank: 4
lora_alpha: 8
lora_dropout: 0.0
input_sr: 16000

noise_dir: data/noise_pool
rir_dir: data/rir_pool
degrade_prob: 0.5
online_degradation: true
max_duration: 4.0

optim: adam
optim_conf:
    lr: 1.0e-3
max_epoch: 1
batch_type: unsorted
batch_size: 2
valid_batch_size: 2
num_workers: 0
seed: 0
best_model_criterion:
    -   - valid
        - loss
        - min
keep_nbest_models: 1
use_amp: false
num_att_plot: 0
