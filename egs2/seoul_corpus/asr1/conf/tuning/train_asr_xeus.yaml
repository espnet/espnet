# XEUS as a frozen SSL frontend.
#
# XEUS (https://huggingface.co/espnet/xeus) is an ESPnet SSL model, not an s3prl
# one, so it loads through frontend: espnet_ssl (espnet2/asr/frontend/espnet_ssl.py,
# registered as "espnet_ssl" in espnet2/tasks/asr.py).  path_or_url goes to
# espnet_model_zoo, whose meta.yaml for this tag names model/config.yaml and
# model/xeus_checkpoint_new.pth; the download is cached, so it happens once.
# A local checkout of that repository works too: give the path of the .pth and
# the frontend calls SSLTask.build_model_from_file(None, path) instead, which
# resolves the config as Path(model_file).parent / "config.yaml" (abs_task.py)
# and so needs the snapshot's model/config.yaml sitting next to it.  Either way
# the model ends up at self.upstream, which is what freeze_param names.
# Config shape follows
# egs2/librilight_limited/asr1/conf/tuning/train_espnet_ssl_hubert_multilayer.yaml,
# the one worked example of this frontend, including normalize/specaug: null --
# the SSL model masks its own input while training (mask_feats defaults to true),
# so it is not being left without augmentation.
#
# XEUS is itself a 19-block e-branchformer at 1024 over a wav2vec CNN frontend
# (20 ms frames, like WavLM), hence input_size 1024 in the preencoder and
# conv2d2 in the encoder so the final frame rate stays the 40 ms the from-scratch
# runs used.
#
# Unlike WavLM-large, which is English-only, XEUS is multilingual and covers
# Korean, so this is the upstream that should transfer here.  batch_bins and
# accum_grad are the from-scratch values, so an epoch is the same 564 steps and
# the curves line up with exp_tags2/asr_tags2 (valid acc 0.200 at epoch 10,
# against a 0.184 text-only bigram floor).
unused_parameters: true
freeze_param: [
"frontend.upstream"
]

frontend: espnet_ssl
frontend_conf:
    frontend_conf:
        path_or_url: espnet/xeus
    multilayer_feature: true

normalize: null
specaug: null

preencoder: linear
preencoder_conf:
    input_size: 1024            # XEUS encoder output_size
    output_size: 80

encoder: e_branchformer
encoder_conf:
    output_size: 256
    attention_heads: 4
    linear_units: 1024
    num_blocks: 12
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.1
    layer_drop_rate: 0.1
    input_layer: conv2d2        # 2 (XEUS 20 ms) * 2 = 40 ms
    macaron_ffn: true
    pos_enc_layer_type: rel_pos
    attention_layer_type: rel_selfattn
    rel_pos_type: latest
    cgmlp_linear_units: 3072
    cgmlp_conv_kernel: 31
    use_linear_after_conv: false
    gate_activation: identity
    positionwise_layer_type: linear
    use_ffn: true
    merge_conv_kernel: 31

decoder: transformer
decoder_conf:
    attention_heads: 4
    linear_units: 2048
    num_blocks: 6
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    self_attention_dropout_rate: 0.1
    src_attention_dropout_rate: 0.1
    layer_drop_rate: 0.2

model_conf:
    ctc_weight: 0.5
    lsm_weight: 0.1
    length_normalized_loss: false
    extract_feats_in_collect_stats: false

seed: 2022
log_interval: 200
num_att_plot: 0
# num_workers is 0 on purpose.  This venv is CPython 3.14, where the default
# multiprocessing start method on Linux is forkserver rather than fork, and
# espnet2/iterators/sequence_iter_factory.py builds its DataLoader without
# passing multiprocessing_context, so worker startup goes through a forkserver.
# On this filesystem that deadlocks: the trainer blocks in pipe_write sending
# the worker payload (syscall 1 on the forkserver pipe) while the forkserver
# child sits in cl_sync_io_wait on Lustre, no worker is ever created, and the
# GPU stays at 0% -- measured at 0.1% mean over 361 samples across ten minutes
# of a "running" epoch.  With 0 the loading happens inline in the trainer, which
# the benchmark puts at 473 ms/batch against 1163 ms/step of forward.
num_workers: 0   # 4 hung before the first forward: the trainer sat in pipe_write (a DataLoader worker pipe) with the GPU at 0% and only the frozen weights resident.  2 is what every run that worked on this data used.
sort_in_batch: descending
sort_batch: descending
batch_type: numel
# batch_bins is halved against the from-scratch runs and accum_grad set to 2, so
# the effective batch and the 564 optimizer steps per epoch are unchanged and
# warmup_steps still means the same thing -- only the peak memory halves.  At
# batch_bins 4000000 the first WavLM epoch reported gpu_max_cached_mem_GB=43.994
# on a 46 GB A40, which leaves nothing for the 40 GB A100 the batch job may
# equally land on.
batch_bins: 2000000
accum_grad: 2
grad_clip: 5
max_epoch: 40
patience: none
init: none
best_model_criterion:
-   - valid
    - acc
    - max
keep_nbest_models: 10

use_amp: true
cudnn_deterministic: false
cudnn_benchmark: false

optim: adam
optim_conf:
    lr: 0.001
    weight_decay: 0.000001
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 2500
