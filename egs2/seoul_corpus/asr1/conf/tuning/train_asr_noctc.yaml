# Attention-only variant of conf/train_asr.yaml, for the tag-preserving data.
# With <SIL>/<NOISE>/<LAUGH>/... kept as targets the hybrid model does not
# learn: at ctc_weight 0.5 and again at 0.2 valid acc plateaued near 0.31 with
# wer ~1.0 over 40 epochs, while cer_ctc stayed at 0.92-1.00 (kept at
# exp_tags/asr_tags_ctcw0.5 and exp_tags/asr_tags).  Halving ctc_weight changed
# nothing, so the stuck branch is the attention one, and the only measured
# anomaly was grad_norm 50-170 against grad_clip 5.0 -- clipping on ~99% of
# steps, 11x, where the working no-tag run clipped 4x.  That comes from
# length_normalized_loss: false summing the label-smoothing loss over targets
# that grew from ~14 to 64.6 BPE tokens once the tags were added.
#
# Dropping CTC and normalizing by token count together remove the confound:
# length_normalized_loss reaches only LabelSmoothingLoss, so with a CTC branch
# present it would rescale the attention loss to ~2.7 while CTC kept its own
# batch average near 318 and would then supply ~97% of the gradient.  With
# ctc_weight 0.0 the CTC branch is gone (espnet_model.py sets self.ctc = None),
# grad_norm lands near 0.9, and grad_clip 5.0 never fires -- so if this run
# still plateaus, the cause is the tags themselves and not the clipping.
# Decode with conf/tuning/decode_asr_noctc.yaml: ctc_weight must match, and
# BeamSearch drops any zero-weight scorer, so no CTC prefix scorer is built.
batch_type: numel
batch_bins: 4000000
accum_grad: 1
max_epoch: 40
patience: none
init: none
best_model_criterion:
-   - valid
    - acc
    - max
keep_nbest_models: 10
num_workers: 2
use_amp: true

frontend_conf:
    n_fft: 512
    hop_length: 160

preprocessor: default
preprocessor_conf:
    fs: 16000
    data_aug_prob: 0.7
    data_aug_num:
    - 1
    - 1
    data_aug_effects:
    -   - 1.0
        -   -   - 0.5
                - speed_perturb
                - factor: 0.9
            -   - 0.5
                - speed_perturb
                - factor: 1.1

specaug: specaug
specaug_conf:
    apply_time_warp: true
    time_warp_window: 5
    time_warp_mode: bicubic
    apply_freq_mask: true
    freq_mask_width_range:
    - 0
    - 27
    num_freq_mask: 2
    apply_time_mask: true
    time_mask_width_ratio_range:
    - 0.
    - 0.05
    num_time_mask: 5

encoder: e_branchformer
encoder_conf:
    output_size: 256
    attention_heads: 4
    attention_layer_type: rel_selfattn
    pos_enc_layer_type: rel_pos
    rel_pos_type: latest
    cgmlp_linear_units: 1024
    cgmlp_conv_kernel: 31
    use_linear_after_conv: false
    gate_activation: identity
    num_blocks: 8
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.1
    input_layer: conv2d
    layer_drop_rate: 0.1
    linear_units: 1024
    positionwise_layer_type: linear
    use_ffn: true
    macaron_ffn: true
    merge_conv_kernel: 31

decoder: transformer
decoder_conf:
    attention_heads: 4
    linear_units: 2048
    num_blocks: 4
    dropout_rate: 0.2
    positional_dropout_rate: 0.2
    self_attention_dropout_rate: 0.1
    src_attention_dropout_rate: 0.1

model_conf:
    ctc_weight: 0.0
    lsm_weight: 0.1
    length_normalized_loss: true

optim: adam
optim_conf:
    lr: 0.001
    weight_decay: 0.000001
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 4000
