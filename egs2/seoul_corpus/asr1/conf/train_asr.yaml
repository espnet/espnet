# E-Branchformer baseline for the Seoul Corpus (~21 h of spontaneous Korean).
# Trained with NVIDIA A100 (40GB) x 1.
#
# WHY THIS CONFIG LOOKS SMALL AND HEAVILY REGULARIZED
# The first attempt at this recipe (kept as conf/tuning/train_asr_scratch_v1.yaml)
# used a 12-block encoder, lr 2e-3 and ctc_weight 0.3 on unfiltered data.  It
# peaked at validation epoch 9 and then overfitted for 38 more epochs: train acc
# 0.582 vs valid acc 0.277, valid cer_ctc stuck at 0.83, and decoding emitted
# frequent fillers regardless of the audio ("네", "음", "어 좀 좀 좀 ...").
# Three things caused that, and each is addressed below:
#   1. 9.4% of training utterances were a single backchannel syllable (네 x1360,
#      음 x367, ...) and p10 of the token count was 1, so the model could drive
#      the loss down by learning the label prior instead of the acoustics.
#      Fixed in run.sh with --min_wav_duration 1.0, which drops 26% of the
#      utterances but only 5% of the audio (train/valid only -- asr.sh stage 4
#      deliberately leaves test_sets unfiltered).
#   2. Only 24 training speakers, so the encoder memorised them.  Fixed here with
#      on-the-fly 3-way speed perturbation (see preprocessor_conf).
#   3. ~35M parameters for 21 h.  Fixed here: 8 blocks instead of 12, stochastic
#      depth, and a gentler peak LR.

# Sizing arithmetic -- redo this if you change the corpus or max_epoch.
# batch_bins counts raw samples; train/ holds ~1.19e9 after the 1.0 s floor.
# Measured at 4e6 bins: 487 batches/epoch, mean 39.6 utterances per batch (min 8,
# max 133), so with accum_grad 1 that is 487 optimizer steps/epoch and 35 epochs is
# ~17k steps -- warmup below stays a small fraction of that.  Do not compute this
# as total_samples/batch_bins (~300): NumElementsBatchSampler counts PADDED elements
# (max_len x batch_size), so read N-batch off the "[train] Batch sampler:" log line.  Speed perturbation here is applied
# per sample at load time, so it does not change the number of batches.
# Do not raise batch_bins to "fill" the GPU: this peaks well under 10 GB of the
# 40 GB an A100 offers, but GPU compute is only ~30% of epoch wall clock (the rest
# is data loading and validation), so bigger batches mainly buy fewer steps.
batch_type: numel
batch_bins: 4000000
accum_grad: 1
max_epoch: 35
patience: none
init: none
best_model_criterion:
-   - valid
    - acc
    - max
keep_nbest_models: 10
# Keep this at 2.  Raising it to 6 to speed up the dataloader (on-the-fly speed
# perturbation runs there) intermittently DEADLOCKS training: the worker processes
# disappear and the main process sleeps forever on the queue, with the GPU at 0%
# utilisation holding only its CUDA context.  Observed three times -- between
# epochs 29 and 30 (~20 min), and twice at epoch 34 (10 min, then 24 min) -- which
# is what made the 1 h interactive training links time out.  Lustre was fine at the
# time (84 MB/s), the node was idle (loadavg 0.47), and no workers were alive, so it
# is a torch DataLoader/fork interaction, not I/O.
#
# CAUTION for stage 10: collect_stats runs one asr_train process per parallel job,
# each with its own workers, so nj x (1 + num_workers) processes share the node.
# At nj 16 this measured 2.1 GB/job with 2 workers (33.6 GB total); 6 workers is
# roughly 56 GB, which no longer fits the 64 GB a single GPU's fair share buys on
# a 4-GPU node.  Run collect_stats on the cpu partition with --mem 240g, or pass
# --asr_args "--num_workers 2" for that stage.
num_workers: 2
# Attention plots cost ~42 s/epoch (21% of wall clock); a debugging aid only.
num_att_plot: 0
use_amp: true

frontend_conf:
    n_fft: 512
    hop_length: 160

# On-the-fly waveform augmentation.  The two speed factors are nested so they are
# mutually exclusive (one draw per utterance), and data_aug_prob 0.7 leaves ~30% of
# utterances unperturbed.  fs must be set for the preprocessor to build the effects.
preprocessor: default
preprocessor_conf:
    fs: 16000
    data_aug_prob: 0.7
    data_aug_num:
    - 1
    - 1
    data_aug_effects:
    -   - 1.0
        -   -   - 0.5
                - speed_perturb
                - factor: 0.9
            -   - 0.5
                - speed_perturb
                - factor: 1.1

# Spontaneous speech, few speakers, small corpus: SpecAugment carries a lot of the
# regularisation here, so it stays at full strength.
specaug: specaug
specaug_conf:
    apply_time_warp: true
    time_warp_window: 5
    time_warp_mode: bicubic
    apply_freq_mask: true
    freq_mask_width_range:
    - 0
    - 27
    num_freq_mask: 2
    apply_time_mask: true
    time_mask_width_ratio_range:
    - 0.
    - 0.05
    num_time_mask: 5

encoder: e_branchformer
encoder_conf:
    output_size: 256
    attention_heads: 4
    attention_layer_type: rel_selfattn
    pos_enc_layer_type: rel_pos
    rel_pos_type: latest
    cgmlp_linear_units: 1024
    cgmlp_conv_kernel: 31
    use_linear_after_conv: false
    gate_activation: identity
    num_blocks: 8
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.1
    input_layer: conv2d
    # Stochastic depth: cheap extra regularisation for a small corpus.
    layer_drop_rate: 0.1
    linear_units: 1024
    positionwise_layer_type: linear
    use_ffn: true
    macaron_ffn: true
    merge_conv_kernel: 31

decoder: transformer
decoder_conf:
    attention_heads: 4
    linear_units: 2048
    num_blocks: 4
    dropout_rate: 0.2
    positional_dropout_rate: 0.2
    self_attention_dropout_rate: 0.1
    src_attention_dropout_rate: 0.1

model_conf:
    # CTC is monotonic and conditionally independent, so it cannot fake progress
    # from a label prior the way the attention decoder did.  Weighting it higher
    # forces the encoder to actually learn acoustics on this little data.
    ctc_weight: 0.5
    lsm_weight: 0.1
    length_normalized_loss: false

optim: adam
optim_conf:
    lr: 0.001
    weight_decay: 0.000001
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 4000
