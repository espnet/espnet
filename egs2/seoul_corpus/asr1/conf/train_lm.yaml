lm: transformer
lm_conf:
    pos_enc: null
    embed_unit: 128
    att_unit: 512
    head: 8
    unit: 2048
    layer: 6
    dropout_rate: 0.1

batch_type: numel
batch_bins: 4000000
accum_grad: 1
max_epoch: 25
patience: none
best_model_criterion:
-   - valid
    - loss
    - min
keep_nbest_models: 5

optim: adam
optim_conf:
    lr: 0.001
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 5000
