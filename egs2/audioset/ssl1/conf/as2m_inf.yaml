# Tokenizer inference config (beats.sh stage 5, --tokenizer_inference_config).
# Encodes AudioSet-2M into discrete tokens with the trained VQ tokenizer,
# used as targets for iter>0 encoder training.
tokenizer_config:
    seed: 45
# Paper AS-2M values (arXiv:2212.09058 Table 4). Stage 4 will overlay
# these with corpus-computed stats if use_corpus_fbank_stats=true.
fbank_mean: 15.66439
fbank_std: 6.38312
