# Same as conf/slurm.conf, except CPU-only jobs go to the `gpu` partition
# instead of `cpu`, without requesting a GPU.
#
# Why: the `cpu` partition is 2 nodes / 64 cores and is shared with other
# users' long-running jobs, while the `gpu` nodes carry 208 cores each and
# typically have several hundred idle. Iteration 0 of the WavLM recipe has to
# MFCC-and-label all 62 M training utterances on CPU (perform_kmeans.sh:68
# hard-forces use_gpu=false for mfcc), and 64 cores is the difference between
# hours and days.
#
# Use it for that stage only, e.g.
#   --kmeans_opts "... --cpu_cmd 'slurm.pl --config conf/slurm_cpu_on_gpu.conf'"
#
# CAUTION: GPU jobs need CPUs too (~26 cores per GPU on a 208-core / 8-GPU
# node). A large nj here can leave GPUs idle because their cores are taken, so
# keep the job count well under the idle-core count and check `sinfo -N -o %C`
# first.
command sbatch --export=PATH
option name=* --job-name $0
option time=* --time $0
option mem=* --mem-per-cpu $0
option mem=0
option num_threads=* --cpus-per-task $0
option num_threads=1 --cpus-per-task 1
option num_nodes=* --nodes $0
default gpu=0
option gpu=0 -p gpu --time=10-00:00:00
option gpu=* -p gpu --gres=gpu:$0 --time=10-00:00:00
