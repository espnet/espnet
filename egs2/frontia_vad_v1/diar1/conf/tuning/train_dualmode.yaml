# Dual-mode (online and offline) voice activity detection with one set of weights:
# a TCN encoder whose look-ahead is chosen at run time. Each training step runs
# look-ahead 0 (online: causal, 1.0 s of past context) and 124 frames (offline:
# 0.99 s of future context) and averages the two losses. Inference uses look-ahead 0
# unless diar_inference gets --look_ahead (conf/tuning/decode_offline.yaml: 124).
# Needs the look-ahead TCN encoder (encoder_conf future_taps, model_conf look_aheads)
# and the batch augmentation in the model (wav_augment).

frontend: default
frontend_conf:
    n_fft: 512
    win_length: 512
    hop_length: 128      # 8 ms at 16 kHz
    n_mels: 40
    center: false

encoder: tcn
encoder_conf:
    output_size: 128
    bottleneck_size: 64
    hidden_size: 128
    kernel_size: 3
    num_blocks: 5
    num_repeats: 2       # receptive field 125 frames = 1.0 s of past context
    norm_type: cLN
    future_taps: 2       # 2 taps after the current frame per depthwise conv
    look_ahead: 0        # online at inference unless --look_ahead is given

decoder: linear

label_aggregator: label_aggregator
label_aggregator_conf:
    win_length: 512
    hop_length: 128
    center: false

# on-the-fly noise augmentation of the whole batch on the GPU, in the model
# (training only): the same procedure as the preprocessor's noise_scp
wav_augment: batch_wav
wav_augment_conf:
    noise_scp: data/noise.scp
    noise_apply_prob: 0.8
    noise_db_range: "-5_20"

iterator_type: sequence
batch_type: unsorted
batch_size: 64
num_workers: 14
seed: 1
optim: adam
optim_conf:
    lr: 0.0005
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 10000
grad_clip: 5
max_epoch: 30
patience: 5

best_model_criterion:
-   - valid
    - acc
    - max
keep_nbest_models: 5

model_conf:
    look_aheads: [0, 124]
